function currentSeasonRows() {
  const tot = harvestTotals();
  const m = {};
  allSegs().forEach(({seg}) => {
    const c = cropById(seg.cropId); if (!c) return;
    const k = c.id;
    m[k] = m[k] || { cropId:c.id, name:c.name, variety:seg.variety||null, ft:0, lb:0 };
    m[k].ft += (+seg.ft||0);
    if (seg.variety && !m[k].variety) m[k].variety = seg.variety;
  });
  Object.keys(tot).forEach(k => {
    m[k] = m[k] || { cropId:k, name:(cropById(k)||{}).name||k, variety:null, ft:0, lb:0 };
    m[k].lb = tot[k];
  });
  return Object.values(m).map(r => ({ ...r,
    perFt: r.ft ? +(r.lb/r.ft).toFixed(2) : 0 }));
}

function seasonsView() {
  const cur = currentSeasonRows();
  const years = state.seasons.map(s=>s.year).sort((a,b)=>b-a);
  const allYears = [YEAR, ...years.filter(y=>y!==YEAR)];
  const cropIds = Array.from(new Set([
    ...cur.map(r=>r.cropId),
    ...state.seasons.flatMap(s=>s.entries.map(e=>e.cropId))]));

  const cell = (cid, y) => {
    if (y===YEAR) { const r = cur.find(x=>x.cropId===cid); return r?r:null; }
    const s = state.seasons.find(x=>x.year===y);
    return s ? s.entries.find(e=>e.cropId===cid) || null : null;
  };
  const best = cid => {
    const vals = allYears.map(y=>cell(cid,y)).filter(Boolean).map(e=>e.perFt||0);
    return Math.max(...vals, 0);
  };

  return `<div class="wrap">
    <div class="eyebrow">Season log</div>
    ${state.seasons.length?'':`<div class="card"><div class="empty">No past seasons on file. Close out this year and it becomes the baseline everything after gets measured against.</div></div>`}

    <div class="grid-scroll" style="margin-bottom:16px"><div class="grid" style="min-width:${180+allYears.length*118}px">
      <div class="grid-head"><div class="grid-label" style="width:180px"><span class="gl-name">Pounds per row foot</span></div>
        <div class="grid-months">${allYears.map(y=>`<div class="gm" style="flex:none;width:118px">${y}${y===YEAR?' \u00b7 now':''}</div>`).join('')}</div></div>
      ${cropIds.map(cid=>{
        const nm = (cropById(cid)||{}).name||cid;
        const b = best(cid);
        return `<div class="grid-row" style="height:auto" data-crop="${cid}">
          <div class="grid-label" style="width:180px"><span class="gl-name">${esc(nm)}</span></div>
          <div class="grid-months">${allYears.map(y=>{
            const e = cell(cid,y);
            if (!e) return `<div class="yc empty-yc">\u2014</div>`;
            const isBest = b>0 && e.perFt>=b;
            return `<div class="yc ${isBest?'best':''}">
              <b>${e.perFt?e.perFt.toFixed(2):'\u2014'}</b>
              <span>${e.lb?e.lb.toFixed(0)+' lb / '+ (e.ft||0)+' ft':'not recorded'}</span>
              ${e.rating?`<i class="stars">${'\u2605'.repeat(e.rating)}${'\u2606'.repeat(5-e.rating)}</i>`:''}
            </div>`;}).join('')}</div>
        </div>`;}).join('')}
    </div></div>
    <div class="legend"><span><i class="sw" style="background:var(--tag)"></i>Best year for that crop</span></div>

    <div class="eyebrow">This season, ${YEAR}</div>
    <div class="card">${cur.length?cur.map(r=>{
      const rate = state.ratings[r.cropId]||0;
      return `<div class="row">
        <div style="flex:1;min-width:0">
          <div class="row-name">${esc(r.variety||r.name)}</div>
          <div class="row-note">${r.variety?esc(r.name)+' \u00b7 ':''}${r.ft?r.ft+' ft':'no beds'} \u00b7 ${r.lb.toFixed(1)} lb \u00b7 ${r.perFt?r.perFt.toFixed(2)+' lb per ft':'no yield logged'}</div>
        </div>
        <div class="row-right"><div class="rater">${[1,2,3,4,5].map(n=>
          `<button class="star ${n<=rate?'on':''}" data-rate="${r.cropId}|${n}">\u2605</button>`).join('')}</div></div>
      </div>`;}).join('')
      :`<div class="empty">Nothing growing and nothing harvested yet this year.</div>`}</div>

    <div class="drafter" style="margin-top:20px">
      <div class="drafter-head">Close out ${YEAR}</div>
      <div class="hint" style="margin:0 0 12px">Locks this year's footage, yield, and ratings into the log so next year has something to beat. Your beds stay as they are.</div>
      <div class="drafter-actions">
        <button class="btn" data-act="closeseason" ${cur.length?'':'disabled'}>Save ${YEAR} to the log</button>
      </div>
    </div>
    <div class="hint">Pounds per row foot is the number that actually compares across years, because it corrects for how much you planted. A crop that made 40 lb off 40 feet did worse than one that made 30 off 20.</div>
  </div>`;
}

// SHARING MODEL
// Six scopes, three levels each. Enough to express everything a person
// actually wants to hide, without a combinatorial mess.
// Enforcement is server side. The UI here only reflects it.
// ===========================================================================
const SCOPES = [
{k:'garden', n:'Garden', lv:[
  ['hidden','Hidden','Nobody sees you have a garden at all.'],
  ['summary','Crops only','A list of what you are growing. No footage, no bed layout, no counts.'],
  ['detail','Full layout','Beds, footage, spacing, varieties, and where everything sits.']]},
{k:'harvest', n:'Harvest', lv:[
  ['hidden','Hidden','No harvest numbers of any kind.'],
  ['summary','Totals only','Total pounds for the season. Not broken out by crop.'],
  ['detail','Per crop','Pounds per crop and pounds per row foot.']]},
{k:'animals', n:'Animals', lv:[
  ['hidden','Hidden','Nobody sees you keep animals. Recommended if you are remote.'],
  ['summary','Species only','That you keep chickens or goats. No counts, no breeds.'],
  ['detail','Breeds and counts','How many, what breed, and production numbers.']]},
{k:'seasons', n:'Season log', lv:[
  ['hidden','Hidden','Your year over year record stays private.'],
  ['summary','Ratings only','Which crops did well or badly for you, as stars. No yield numbers.'],
  ['detail','Full yields','Pounds per row foot across every year on file.']]},
{k:'pantry', n:'Pantry', lv:[
  ['hidden','Hidden','No jar counts. Recommended.'],
  ['summary','Percent stocked','How far along you are toward a year, as a percentage.'],
  ['detail','Jar counts','Exactly what is on your shelves and how much.']]},
{k:'location', n:'Location', lv:[
  ['hidden','Zone only','Just the growing zone. Nothing about where you are.'],
  ['summary','Region','Zone plus the nearest reference city. Never your town or address.'],
  ['detail','Nearest town','Zone plus the town you entered. Still never an address.']]},
];
if (!ANIMALS) {
  for (let i = SCOPES.length - 1; i >= 0; i--) if (SCOPES[i].k === 'animals') SCOPES.splice(i, 1);
}
function scopeLevel(k){ return (state.share.scopes||{})[k] || 'hidden'; }
function levelInfo(k, lv){ const s=SCOPES.find(x=>x.k===k); return s?s.lv.find(l=>l[0]===lv):null; }
// what a scope at a given level exposes, used for both my preview and neighbors
function visible(k, need){
  const order = {hidden:0, summary:1, detail:2};
  return order[scopeLevel(k)] >= order[need];
}

// ===========================================================================
// PLANS AND AI QUOTA
// The meter stays quiet while usage is normal. A prominent counter on the
// feature you want people using will stop them using it.
// ===========================================================================
const PLANS = {
  free:      {n:'Free',      price:'Free',        per:'',        ai:0,   sync:false, social:false, photos:0,
              d:'The whole almanac, garden builder, library, and canning reference. One device.'},
  homestead: {n:'Homestead', price:'$39',         per:'a year',  ai:150, sync:true,  social:true,  photos:500,
              d:'Everything, on every device, with your season history and the advisor.'},
  lifetime:  {n:'Lifetime',  price:'$179',        per:'once',    ai:100, sync:true,  social:true,  photos:1000,
              d:'Buy it once. Works forever, offline, with no server needed. Advisor questions sold as packs.'},
};
function plan(){ return PLANS[state.plan] || PLANS.free; }
function aiLimit(){ return plan().ai + (state.ai.credits||0); }
function aiLeft(){ return Math.max(0, aiLimit() - state.ai.used); }
function aiPeriodEnd(){ return shift(new Date(state.ai.periodStart), 365); }
function aiDaysLeft(){ return Math.max(0, dayDiff(aiPeriodEnd(), TODAY)); }
// pace: what they should have used by now if spread evenly
function aiPace() {
  const elapsed = 365 - aiDaysLeft();
  const expected = aiLimit() * (elapsed/365);
  const used = state.ai.used;
  if (expected < 3) return { state:'early', expected:Math.round(expected) };
  const ratio = used / Math.max(1, expected);
  return { state: ratio > 1.35 ? 'ahead' : ratio < 0.65 ? 'behind' : 'ontrack',
           expected: Math.round(expected), ratio };
}
function aiTier() {
  const lim = aiLimit(); if (!lim) return 'none';
  const pct = state.ai.used / lim;
  return pct >= 1 ? 'out' : pct >= 0.85 ? 'low' : pct >= 0.6 ? 'half' : 'fine';
}


// ---- thermometer ---------------------------------------------------------
// Vertical glass, mercury rising out of the bulb, graduated on the right.
// Mercury runs chartreuse and turns to orange as it climbs into the top.
function thermo(pct, tier, lim, small) {
  const p = Math.max(0, Math.min(1, pct));
  const TOP = 18, BOT = 130, H = BOT - TOP;
  const y = BOT - p * H;
  const hot = tier==='low' || tier==='out';
  const col = hot ? 'var(--twine)' : 'var(--tag)';

  if (small) {
    const sy = 26 - p * 18;
    return `<svg class="th small" viewBox="0 0 14 34" aria-hidden="true">
      <rect x="4" y="2" width="6" height="26" rx="3" fill="var(--steel)" stroke="var(--rule)"/>
      <circle cx="7" cy="28" r="5" fill="${col}"/>
      <rect x="5.2" y="${sy.toFixed(1)}" width="3.6" height="${(28-sy).toFixed(1)}" fill="${col}"/>
    </svg>`;
  }

  // graduation marks, every 25 percent, labelled in questions
  let ticks = '';
  for (let i = 0; i <= 4; i++) {
    const ty = BOT - (i/4) * H;
    const long = i % 2 === 0;
    ticks += `<line x1="26" y1="${ty}" x2="${long?34:31}" y2="${ty}" stroke="var(--rule)" stroke-width="1"/>`;
    if (long) ticks += `<text x="37" y="${ty+3.4}" class="th-lab">${Math.round(lim*i/4)}</text>`;
  }

  return `<svg class="th" viewBox="0 0 74 150" aria-hidden="true">
    <!-- glass -->
    <rect x="8" y="${TOP-8}" width="16" height="${H+16}" rx="8" fill="var(--steel)" stroke="var(--rule)" stroke-width="1"/>
    <circle cx="16" cy="132" r="12.5" fill="var(--steel)" stroke="var(--rule)" stroke-width="1"/>
    <!-- mercury -->
    <circle cx="16" cy="132" r="9.5" fill="${col}"/>
    <rect x="11.5" y="${y.toFixed(1)}" width="9" height="${(132-y).toFixed(1)}" rx="4.5" fill="${col}"/>
    <!-- highlight down the glass -->
    <rect x="11" y="${TOP-5}" width="2.5" height="${H+8}" rx="1.25" fill="rgba(234,232,225,.14)"/>
    ${ticks}
  </svg>`;
}

// ---- the meter -----------------------------------------------------------
function aiMeter() {
  const tier = aiTier();
  if (tier === 'none') return `<div class="aiup">
    <div class="aiup-h">The advisor needs a plan</div>
    <div class="aiup-d">Everything else in SteadN works without one. This is the only part that costs money to run, because each question goes out to a live model and pulls your forecast.</div>
    <button class="btn" data-tab="plan">See plans</button>
  </div>`;

  const lim = aiLimit(), used = state.ai.used, left = aiLeft();
  const pct = used / lim;
  const pace = aiPace();

  // quiet: a small thermometer and one line, nothing more
  if (tier === 'fine') return `<div class="aiquiet">
    ${thermo(pct, tier, lim, true)}
    <span>${left} of ${lim} questions left \u00b7 resets ${fmtU(aiPeriodEnd())}${
      pace.state==='ahead'?' \u00b7 running warm for this time of year':''}</span>
  </div>`;

  const head = tier==='out' ? 'Out of questions for now'
             : tier==='low' ? `${left} question${left===1?'':'s'} left`
             : `${left} of ${lim} questions left`;

  const sub = tier==='out'
    ? `Everything else keeps working exactly as it did. The almanac, your beds, the stage tracker, the canning times, the whole library. None of that needs a connection or a question.`
    : pace.state==='ahead'
      ? `Running hot. Even pace for day ${365-aiDaysLeft()} would be about ${pace.expected}, and you are at ${used}. At this rate you run dry before ${fmtU(aiPeriodEnd())}.`
      : pace.state==='behind'
        ? `Well under pace. Even pace by now would be about ${pace.expected}. Plenty of room until ${fmtU(aiPeriodEnd())}.`
        : `About right for the time of year. Even pace by now would be ${pace.expected}. Resets ${fmtU(aiPeriodEnd())}.`;

  return `<div class="aimeter ${tier}">
    <div class="am-glass">${thermo(pct, tier, lim, false)}</div>
    <div class="am-text">
      <div class="am-top">
        <div class="am-h">${head}</div>
        <div class="am-c">${used} / ${lim}</div>
      </div>
      <div class="am-sub">${sub}</div>
      ${tier==='low'||tier==='out'?`<div class="am-acts">
        <button class="btn" data-credits="50">Add 50 for $6</button>
        <button class="btn-ghost" data-credits="150">Add 150 for $15</button>
      </div>`:''}
    </div>
  </div>`;
}

// ===========================================================================
// THINKING INDICATOR
// A question with a web search behind it can take ten seconds or more. A
// single static line reads as broken, so this moves, changes what it says,
// and admits how long it has been once the wait gets long.
// Driven by its own timer rather than the render loop, so a full re-render
// never resets it mid-question.
// ===========================================================================
const THINK_LINES = [
  'Let me dig that up',
  'Getting to the root of that',
  'Walking out to have a look',
  'Checking the sky',
  'Tending to that',
  'Reading your beds',
  'Consulting the almanac',
  'Turning that over',
  'Having a look at your rows',
  'Pulling your forecast',
];
let thinkTimer = null, thinkAt = 0, thinkIdx = 0;

function thinkingBlock() {
  return `<div class="thinking" id="thinker" role="status" aria-live="polite">
    <svg class="sprout" viewBox="0 0 24 30" aria-hidden="true">
      <path class="sp-soil" d="M2 27h20" />
      <path class="sp-stem" d="M12 27V11" />
      <path class="sp-leafL" d="M12 17c-4 0-6-3-6-6 4-1 6 2 6 6z" />
      <path class="sp-leafR" d="M12 14c4 0 6-3 6-6-4-1-6 2-6 6z" />
    </svg>
    <span class="th-line" id="thinkline">${esc(THINK_LINES[0])}</span>
    <span class="th-el" id="thinkel"></span>
  </div>`;
}

function startThinking() {
  stopThinking();
  thinkAt = Date.now();
  thinkIdx = Math.floor(Math.random() * THINK_LINES.length);
  const paint = () => {
    const line = document.getElementById('thinkline');
    const el = document.getElementById('thinkel');
    if (!line) return;                        // the answer landed, nothing to do
    line.textContent = THINK_LINES[thinkIdx % THINK_LINES.length];
    thinkIdx++;
    const secs = Math.round((Date.now() - thinkAt) / 1000);
    if (el) {
      // only own up to the wait once it is actually a wait
      el.textContent = secs >= 6
        ? (secs >= 14 ? `${secs}s, still searching the web` : `${secs}s`)
        : '';
    }
  };
  paint();
  thinkTimer = setInterval(paint, 2300);
}
function stopThinking() {
  if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
}

const PERSIST = ['signedIn','onboarded','tab','putup','place','keeps','chickens','goats','people',
  'planItems','plot','rowOpt','beds','gardenSeason','harvests','pantry',
  'seasons','ratings','trays','starts','done','chores','issues','offPlan',
  'share','plan','ai','theme','fs','tagSub','printQr','printNotes','vendor','pinned'];

let saveTimer = null, saveGen = 0;
const hasStore = () => typeof window !== 'undefined' && window.storage
  && typeof window.storage.set === 'function';

function snapshot() {
  const o = { _v: 1, _at: new Date().toISOString() };
  PERSIST.forEach(k => { o[k] = state[k]; });
  return o;
}

async function saveNow() {
  if (!hasStore()) { state.saveState = 'nostore'; return; }
  const gen = ++saveGen;
  state.saveState = 'saving'; paintSaveChip();
  try {
    await window.storage.set(SAVE_KEY, JSON.stringify(snapshot()));
    if (gen === saveGen) { state.saveState = 'saved'; state.savedAt = new Date(); }
  } catch (e) {
    if (gen === saveGen) { state.saveState = 'error'; state.saveErr = String(e && e.message || e); }
  }
  paintSaveChip();
}

// called after every mutation, coalesced so typing does not hammer storage
function queueSave() {
  if (!hasStore()) { state.saveState = 'nostore'; return; }
  state.saveState = 'dirty'; paintSaveChip();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}

async function loadSaved() {
  if (!hasStore()) { state.saveState = 'nostore'; return false; }
  try {
    const res = await window.storage.get(SAVE_KEY);
    if (!res || !res.value) { state.saveState = 'saved'; return false; }
    const data = JSON.parse(res.value);
    if (!data || data._v !== 1) { state.saveState = 'saved'; return false; }
    PERSIST.forEach(k => { if (data[k] !== undefined) state[k] = data[k]; });
    // dates come back as strings, which is fine everywhere because every
    // reader wraps them in new Date() already
    state.saveState = 'saved';
    state.savedAt = data._at ? new Date(data._at) : null;
    return true;
  } catch (e) {
    state.saveState = 'error'; state.saveErr = String(e && e.message || e);
    return false;
  }
}

async function wipeSaved() {
  try { if (hasStore()) await window.storage.delete(SAVE_KEY); } catch (e) {}
}

// the chip is repainted on its own so a save never triggers a full re-render
function paintSaveChip() {
  const el = document.getElementById('savechip');
  if (!el) return;
  const s = state.saveState;
  const label = s === 'saving' ? 'Saving' : s === 'dirty' ? 'Unsaved'
    : s === 'error' ? 'Save failed' : s === 'nostore' ? 'Not saving'
    : state.savedAt ? 'Saved' : 'Saved';
  el.className = 'savechip ' + (s || 'saved');
  el.textContent = label;
  el.title = s === 'nostore'
    ? 'No storage available here, so this session will not persist.'
    : s === 'error' ? ('Save failed: ' + (state.saveErr||'')) 
    : state.savedAt ? ('Last saved ' + state.savedAt.toLocaleTimeString()) : '';
}

function segDtm(s) { const c = cropById(s.cropId); return s.dtm || (c ? c.dtm : 60); }
function segName(s) { const c = cropById(s.cropId); return s.variety ? s.variety : (c ? c.name : '?'); }
function segCount(s) { const sp = +s.sp || 12; return Math.max(0, Math.floor((s.ft * 12) / sp)); }
function segYield(s) { const c = cropById(s.cropId); return c ? segCount(s) * c.yld : 0; }
function bedSegs(b) {
  return b.segments.filter(s => !s.season || s.season === state.gardenSeason);
}
function bedUsed(b) { return bedSegs(b).reduce((a,s) => a + (+s.ft||0), 0); }
function bedFree(b) { return Math.max(0, b.len - bedUsed(b)); }
function allSegs() {
  const out = [];
  state.beds.forEach(b => b.segments.forEach(s => out.push({ bed:b, seg:s })));
  return out;
}
function gardenTotals() {
  let plants = 0, lb = 0, ft = 0;
  allSegs().forEach(({seg}) => { plants += segCount(seg); lb += segYield(seg); ft += +seg.ft||0; });
  // ft is crop feet grown across the year, which exceeds the ground available
  // whenever a stretch carries a spring crop and then a fall one
  return { plants, lb, ft, beds:state.beds.length,
           capacity: state.beds.reduce((a,b)=>a+b.len,0) };
}
function seedOrder() {
  const m = {};
  allSegs().forEach(({seg}) => {
    const c = cropById(seg.cropId); if (!c) return;
    const k = c.id + (seg.variety?'|'+seg.variety:'');
    m[k] = m[k] || { crop:c, variety:seg.variety||null, plants:0 };
    m[k].plants += segCount(seg);
  });
  return Object.values(m).map(r => ({ ...r, seeds: Math.ceil(r.plants * 1.3) }))
    .sort((a,b) => b.plants - a.plants);
}
// color per family so the bed bars read at a glance
const FAM_HUE = { Nightshade:352, Cucurbit:44, Legume:96, Brassica:186, Umbel:268,
  Amaranth:320, Aster:20, Allium:210, Grass:64, Mallow:14, Mint:140,
  'Morning glory':300, Rose:330 };
// Hue alone collapses for the eight percent of men with red-green colour
// blindness, so each family also carries its own lightness step. That way the
// bands still separate when the hues do not.
const FAM_LIGHT = { Nightshade:0, Cucurbit:10, Legume:-6, Brassica:6, Umbel:-10,
  Amaranth:4, Aster:-4, Allium:8, Grass:-8, Mallow:2, Mint:12,
  'Morning glory':-2, Rose:14 };
function famColor(fam, alpha) {
  const h = FAM_HUE[fam] != null ? FAM_HUE[fam] : 200;
  const base = (state.theme === 'daylight') ? 36 : 52;
  const l = Math.max(20, Math.min(70, base + (FAM_LIGHT[fam] || 0)));
  return `hsla(${h},52%,${l}%,${alpha||1})`;
}

function windowsFor(c) { return cropWindows(c, state.place.zone, YEAR); }
const KIND_LABEL = { indoor:'Start indoors', sow:'Direct sow', set:'Set out', harvest:'Harvest' };

function nowBoard() {
  const open = [], soon = [], closing = [];
  CROPS.forEach(c => windowsFor(c).forEach(w => {
    const dO = dayDiff(w.from,TODAY), dC = dayDiff(w.to,TODAY);
    if (dO<=0 && dC>=0) { open.push({crop:c,w,left:dC});
      if (dC<=10 && w.kind!=='harvest') closing.push({crop:c,w,left:dC}); }
    else if (dO>0 && dO<=21 && w.kind!=='harvest') soon.push({crop:c,w,inDays:dO});
  }));
  open.sort((a,b)=>a.left-b.left); soon.sort((a,b)=>a.inDays-b.inDays);
  closing.sort((a,b)=>a.left-b.left);
  return { open, soon, closing };
}

// every task now comes out of the actual garden, not a separate log
function gardenTasks() {
  const out = [];
  allSegs().forEach(({bed,seg}) => {
    const c = cropById(seg.cropId); if (!c || !seg.planted) return;
    const planted = new Date(seg.planted);
    (c.feed||[]).forEach(f => {
      const when = shift(planted,f.d), away = dayDiff(when,TODAY);
      if (away>=-10 && away<=45) out.push({date:when,away,type:'feed',crop:c,bed,seg,text:f.do});
    });
    if (c.succ) {
      let n = shift(planted,c.succ), guard=0;
      while (dayDiff(n,TODAY)<-3 && guard++<40) n = shift(n,c.succ);
      const away = dayDiff(n,TODAY);
      if (away>=-3 && away<=40) out.push({date:n,away,type:'succession',crop:c,bed,seg,
        text:`Sow the next round, ${c.succ} days behind this one`});
    }
    const h = shift(planted,segDtm(seg)), hA = dayDiff(h,TODAY);
    if (hA>=-14 && hA<=45 && segDtm(seg)<300) out.push({date:h,away:hA,type:'harvest',crop:c,bed,seg,
      text:`About ${segYield(seg).toFixed(1)} lb off ${seg.ft} ft`});
  });
  out.sort((a,b)=>a.date-b.date);
  return out;
}

function buildSupplies() {
  if (!ANIMALS) { state.supplies=[]; return; }
  const out=[], c=state.chickens, g=state.goats;
  if (state.keeps.chickens && c.count>0) {
    const hens=Math.max(0,c.count-(+c.pullets||0));
    const br=chickenBreed(c.breed), rate=br?henFeedRate(br.lb):RATES.layer;
    out.push({name:'Chicken feed',unit:'lb',bag:BAG.feed,
      burn:+(hens*rate+(+c.pullets||0)*rate*0.7).toFixed(2),onHand:BAG.feed,
      note:`${hens} ${br?br.name:'layers'}${+c.pullets?` + ${c.pullets} pullets`:''} at ${rate} lb/day`});
    out.push({name:'Coop bedding',unit:'bale',bag:1,
      burn:+(.055*Math.max(1,c.count/8)).toFixed(3),onHand:3,note:'deep litter'});
  }
  if (state.keeps.goats && g.count>0) {
    const mk=Math.min(+g.milking||0,g.count), dry=g.count-mk;
    const gb=goatBreed(g.breed);
    const milkRate=gb&&gb.milk?0.5+gb.milk*0.5:RATES.goatMilking;
    out.push({name:'Goat grain',unit:'lb',bag:BAG.goatGrain,
      burn:+(mk*milkRate+dry*RATES.goatGrain).toFixed(2),onHand:34,
      note:mk?`${mk} in milk at ${milkRate.toFixed(2)} lb/day, ${dry} dry`:`${g.count} ${gb?gb.name:'goats'} maintenance`});
    out.push({name:'Loose mineral',unit:'lb',bag:BAG.mineral,
      burn:+(g.count*RATES.goatMineral).toFixed(3),onHand:12,note:'free choice'});
  }
  state.supplies = out;
}

function profile() {
  const f = frostDates(state.place.zone,YEAR);
  const p=[`Location: ${state.place.near||'unspecified'} \u00b7 ZIP ${state.place.zip||'?'} \u00b7 zone ${state.place.zone}`,
           `Today: ${TODAY.toDateString()}`];
  if (f.lf) p.push(`Last spring frost ${fmt(f.lf)}, first fall frost ${fmt(f.ff)}, ${dayDiff(f.ff,f.lf)} day season`);
  if (state.beds.length) {
    p.push('Garden beds:');
    state.beds.forEach(b => {
      p.push(`  ${b.name}, ${b.len} ft, ${bedFree(b).toFixed(1)} ft free`);
      b.segments.forEach(s => {
        const c=cropById(s.cropId); if(!c) return;
        const st = s.planted ? stageOf(c,s.planted,segDtm(s)) : null;
        p.push(`    - ${s.ft} ft ${segName(s)}${s.variety?` (${c.name})`:''} at ${s.sp} in spacing, ${segCount(s)} plants, about ${segYield(s).toFixed(1)} lb` +
          (st?`, planted ${fmt(new Date(s.planted))}, day ${st.days} of ${st.dtm}, should be ${st.stage.n.toLowerCase()}`:', not planted yet'));
      });
    });
  }
  if (state.keeps.chickens){const c=state.chickens;
    p.push(`Chickens: ${c.count} ${c.breed}, about ${c.ageMonths} months${+c.pullets?`, ${c.pullets} pullets`:''}`);}
  if (state.keeps.goats){const g=state.goats;
    p.push(`Goats: ${g.count} ${g.breed}, ${g.milking} in milk`);}
  if (state.harvests.length){
    const h=harvestTotals();
    p.push('Harvested so far this season:');
    Object.keys(h).forEach(k=>{const c=cropById(k); if(c) p.push(`  - ${c.name}: ${h[k].toFixed(1)} lb`);});
  }
  const shelved=Object.keys(state.pantry).filter(k=>state.pantry[k]>0);
  if (shelved.length){
    p.push(`Pantry, against a year for ${state.people} people:`);
    yearPlanFor(state.people).filter(r=>r.qt>0).forEach(r=>{
      const have=state.pantry[r.cid]||0;
      if(have>0||r.qt>0) p.push(`  - ${r.label}: ${have} of ${r.qt} qt`);
    });
  }
  const od = allTodos().filter(t=>t.away<0);
  if (od.length) p.push(`Overdue tasks: ${od.slice(0,6).map(t=>t.title).join('; ')}`);
  if (state.seasons.length) {
    p.push('Past season yields, pounds per row foot:');
    state.seasons.forEach(s=>s.entries.filter(e=>e.perFt).forEach(e=>
      p.push(`  - ${s.year} ${e.name}: ${e.perFt} lb/ft${e.rating?`, rated ${e.rating} of 5`:''}`)));
  }
  p.push(`Elevation ${elevation()} ft, so water bath adds ${bathAdd(elevation())} min and dial gauge runs ${dialPsi(elevation())} psi.`);
  if (state.supplies.length){p.push('Modeled supply:');
    state.supplies.forEach(s=>p.push(`  - ${s.name}: ${s.onHand.toFixed(1)} ${s.unit}, ${s.burn}/day, out ${fmt(shift(TODAY,Math.floor(s.onHand/s.burn)))}`));}
  return p.join('\n');
}
const VOICE = `You are the advisor inside a homestead almanac. The app already computed this user's planting windows, plant counts, yields, and growth stages from their zone and bed layout. Do not repeat that back to them. Add what the app cannot compute: weather, soil, diagnosis, judgment.
Rules:
- Short and specific. No preamble.
- Use their real bed footage, plant counts, and dates.
- Plain language, no em dashes.
- If asked about animal health, say you are not covering animals yet and that anything urgent goes to a vet.
- If you need to know something to answer well, say what.`;

async function callClaude(prompt) {
  const r = await fetch('/api/ask',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
      messages:[{role:'user',content:prompt}],
      tools:[{type:'web_search_20250305',name:'web_search'}]})});
  const d = await r.json();
  if (!d.content) throw new Error(d.error?d.error.message:'no response');
  return d.content.map(b=>b.type==='text'?b.text:'').filter(Boolean).join('\n').trim();
}
async function ask(q) {
  if (!q.trim()) return;
  if (aiTier()==='out' || aiTier()==='none') { state.tab='ask'; return render(); }
  state.ai.used += 1;
  state.answerLoading=true; state.answer={q,a:null}; state.tab='ask';
  state.openSeg=null; state.openCrop=null; render();
  startThinking();
  try { state.answer={q,a:await callClaude(
`${VOICE}\n\nHOMESTEAD PROFILE\n${profile()}\n\nQuestion: "${q}"\n\nIf weather or forecast changes the answer, look up the real numbers for their area and cite them. Under 160 words unless steps are needed.`)}; }
  catch(e){ state.answer={q,a:'Could not reach the advisor. '+e.message}; }
  state.answerLoading=false; stopThinking(); render();
}

                  <div><span class="fl">Season</span><b>${dayDiff(f.ff,f.lf)} DAYS</b></div>`

  let b='';
  if (state.keeps.chickens) b+=`<div class="detail-block"><h4>Chickens</h4>

      <div><label>How many</label><input type="number" min="0" data-f="chickens.count" value="${state.chickens.count}"></div>
      <div style="flex:2"><label>Breed</label>${combo('chickens.breed',state.chickens.breed,'Type a breed, or search "blue eggs"',['chicken'])}</div>
    </div>${breedCard(chickenBreed(state.chickens.breed))}<div class="field-row">
      <div><label>Age in months</label><input type="number" min="0" data-f="chickens.ageMonths" value="${state.chickens.ageMonths}"></div>
      <div><label>Not laying yet</label><input type="number" min="0" data-f="chickens.pullets" value="${state.chickens.pullets}"></div>

  if (state.keeps.goats) b+=`<div class="detail-block"><h4>Goats</h4><div class="field-row">
    <div><label>How many</label><input type="number" min="0" data-f="goats.count" value="${state.goats.count}"></div>

    <div><label>In milk</label><input type="number" min="0" data-f="goats.milking" value="${state.goats.milking}"></div>

// ---------- GARDEN: the builder -------------------------------------------
function bedBar(b) {
  const segs = bedSegs(b).map(s => {
    const c = cropById(s.cropId);
    const st = (c && s.planted) ? stageOf(c,s.planted,segDtm(s)) : null;
    const ready = st && st.pct >= 1;
    return `<button class="seg" data-seg="${b.id}:${s.id}" style="flex:${s.ft};
        background:${famColor(c?c.fam:'',ready?.95:.62)}"
        title="${esc(c?c.name:'')} \u00b7 ${s.ft} ft">
      <span class="seg-name">${esc(segName(s))}</span>
      <span class="seg-meta">${s.ft}ft \u00b7 ${segCount(s)}</span>
      ${st?`<span class="seg-prog"><i style="width:${Math.min(100,st.pct*100).toFixed(0)}%"></i></span>`:''}
    </button>`;
  }).join('');
  const free = bedFree(b);
  const freeCell = free > 0
    ? `<button class="seg seg-free" data-add="${b.id}" style="flex:${free}">
         <span class="seg-name">+ ${free % 1 ? free.toFixed(1) : free} ft free</span></button>`
    : '';
  const ticks = Array.from({length:Math.min(b.len,60)},(_,i)=>
    `<i class="rtick ${(i+1)%5===0?'five':''}"></i>`).join('');
  return `<div class="bed">
    <div class="bed-head">
      <div><span class="bed-name">${esc(b.name)}</span>
        <span class="bed-sub">${b.len} ft \u00b7 ${bedUsed(b)%1?bedUsed(b).toFixed(1):bedUsed(b)} planted \u00b7 ${free%1?free.toFixed(1):free} free</span></div>
      <button class="x" data-delbed="${b.id}">Remove bed</button>
    </div>
    <div class="bed-bar">${segs}${freeCell}</div>
    <div class="ruler">${ticks}</div>
  </div>`;
}

function draftForm() {
  const d = state.draft; if (!d) return '';
  const bed = state.beds.find(x=>x.id===d.bedId); if (!bed) return '';
  const free = bedFree(bed);
  const c = cropById(d.cropId);
  const ft = Math.min(+d.ft||0, free);
  const sp = +d.sp || (c?c.sp:12);
  const n = Math.max(0, Math.floor((ft*12)/sp));
  const lb = c ? n*c.yld : 0;
  const ws = c ? windowsFor(c).filter(w=>w.kind!=='harvest') : [];
  const nowOpen = ws.find(w=>dayDiff(w.from,TODAY)<=0 && dayDiff(w.to,TODAY)>=0);
  const next = ws.filter(w=>dayDiff(w.from,TODAY)>0).sort((a,b)=>a.from-b.from)[0];

  const vars = varietiesFor(d.cropId);
  const known = vars.find(v=>v[0]===d.variety);
  const isCustom = !!d.custom;
  const varOpts = `<option value="">Default \u00b7 ${c?c.dtm:'\u2014'} days</option>`
    + vars.map(v=>`<option value="${esc(v[0])}" ${!isCustom&&d.variety===v[0]?'selected':''}>${esc(v[0])} \u00b7 ${v[1]?v[1]+'d':'\u2014'}</option>`).join('')
    + `<option value="__custom" ${isCustom?'selected':''}>Something else, or my own saved seed\u2026</option>`;
  const baseDtm = known ? known[1] : (c?c.dtm:60);
  const dtm = d.dtm || baseDtm;
  const adjusted = d.dtm && d.dtm !== baseDtm;

  return `<div class="drafter">
    <div class="drafter-head">Add a planting to ${esc(bed.name)} <span>${free%1?free.toFixed(1):free} ft free</span></div>
    <div class="field-row">
      <div style="flex:2"><label>Crop</label>${combo('draft.crop',c?c.name:'','Search 43 crops and 177 varieties',['crop','variety'])}</div>
      <div style="flex:2"><label>Variety</label><select data-d="variety">${varOpts}</select></div>
      <div><label>Feet of row</label>
        <div class="stepper">
          <button data-step="ft:-1">\u2212</button>
          <input type="number" step="0.5" min="0" max="${free}" data-d="ft" value="${ft}">
          <button data-step="ft:1">+</button>
        </div></div>
      <div><label>Spacing (in)</label>
        <div class="stepper">
          <button data-step="sp:-1">\u2212</button>
          <input type="number" min="1" data-d="sp" value="${sp}">
          <button data-step="sp:1">+</button>
        </div></div>
    </div>
    ${isCustom?`<div class="field-row">
      <div style="flex:2"><label>Variety name</label>
        <input data-d="customName" value="${esc(d.variety||'')}" placeholder="Granny Smith's pole bean, Mortgage Lifter, saved seed\u2026"></div>
    </div>`:''}
    <div class="field-row">
      <div style="max-width:230px"><label>Days to maturity</label>
        <div class="stepper">
          <button data-step="dtm:-1">\u2212</button>
          <input type="number" min="1" max="400" data-d="dtm" value="${dtm}">
          <button data-step="dtm:1">+</button>
        </div>
        <div class="dtmnote">${adjusted
          ? `Adjusted from ${baseDtm}. <button class="linkbtn" data-act="resetdtm">Back to ${baseDtm}</button>`
          : known ? `From the ${esc(known[0])} listing. Your seed packet wins if it differs.`
          : isCustom ? `Off the seed packet, or count back from when it finished for you last year.`
          : `Crop default. Varieties run anywhere from ${Math.round(baseDtm*0.7)} to ${Math.round(baseDtm*1.3)} days.`}</div>
      </div>
    </div>
    <div class="calc">
      <div><span class="cl">Plants</span><b>${n}</b></div>
      <div><span class="cl">Seeds to buy</span><b>${Math.ceil(n*1.3)}</b></div>
      <div><span class="cl">Est. yield</span><b>${lb<10?lb.toFixed(1):Math.round(lb)} lb</b></div>
      <div><span class="cl">Days to maturity</span><b>${dtm<300?dtm:'\u2014'}</b></div>
    </div>
    ${d.variety?`<div class="varnote">${esc((vars.find(v=>v[0]===d.variety)||[])[2]||'')}</div>`:''}
    ${nowOpen?`<div class="windowline ok">In window now. ${KIND_LABEL[nowOpen.kind]} through ${fmtU(nowOpen.to)}, ${plural(dayDiff(nowOpen.to,TODAY),'day')} left.</div>`
      :next?`<div class="windowline no">Outside the usual window. The next ${KIND_LABEL[next.kind].toLowerCase()} window opens ${fmtU(next.from)}.</div>`:''}
    ${c?checkPanel(c, dtm, !!d.ack):''}
    <div class="drafter-actions">
      ${(()=>{const lv=c?plantCheck(c,dtm,TODAY).level:'ok';
        const need = lv!=='ok', okToAdd = ft>0&&n>0&&(!need||d.ack);
        return `<button class="btn" data-act="addseg" ${okToAdd?'':'disabled'}>Add ${ft?ft:''} ft</button>
        <button class="btn-ghost" data-act="addseg-planted" ${okToAdd?'':'disabled'}>Add and mark planted today</button>
        ${need&&!d.ack?`<span class="ackhint">Acknowledge the timing above to continue</span>`:''}`;})()}
      <button class="btn-ghost" data-act="canceldraft">Cancel</button>
    </div>
  </div>`;
}

// ---------- segment sheet: the cycle tracker ------------------------------
function segSheet() {
  if (!state.openSeg) return '';
  const [bedId, segId] = state.openSeg.split(':');
  const bed = state.beds.find(b=>b.id===bedId); if (!bed) return '';
  const seg = bed.segments.find(s=>s.id===segId); if (!seg) return '';
  const c = cropById(seg.cropId); if (!c) return '';
  const n = segCount(seg), lb = segYield(seg);

  let cycle;
  if (!seg.planted) {
    const ws = windowsFor(c).filter(w=>w.kind!=='harvest');
    const open = ws.find(w=>dayDiff(w.from,TODAY)<=0 && dayDiff(w.to,TODAY)>=0);
    const next = ws.filter(w=>dayDiff(w.from,TODAY)>0).sort((a,b)=>a.from-b.from)[0];
    cycle = `<div class="sheet-eyebrow">Cycle</div>
      <div class="notplanted">Not planted yet. ${
        open?`Window is open now, ${KIND_LABEL[open.kind].toLowerCase()} through ${fmtU(open.to)}.`
        : next?`Next window opens ${fmtU(next.from)}.` : 'No window left this year.'}</div>
      <button class="btn" data-plantseg="${state.openSeg}">Mark planted today</button>`;
  } else {
    const st = stageOf(c, seg.planted, segDtm(seg));
    const band = STAGES[c.cat] || STAGES.leaf;
    const harvest = shift(new Date(seg.planted), segDtm(seg));
    const toGo = dayDiff(harvest, TODAY);
    const marks = band.map((x,i)=>{
      const done = i < st.idx, on = i === st.idx;
      return `<div class="stage ${done?'done':''} ${on?'on':''}">
        <span class="sn">${esc(x.n)}</span></div>`;
    }).join('');
    cycle = `<div class="sheet-eyebrow">Cycle \u00b7 day ${st.days} of ${st.dtm}</div>
      <div class="track"><i style="width:${Math.min(100,st.pct*100).toFixed(1)}%"></i></div>
      <div class="stages">${marks}</div>
      <div class="stagecard">
        <div class="sc-now">${esc(st.stage.n)}</div>
        <div class="sc-look"><span>Should look like</span>${esc(st.stage.look)}</div>
        <div class="sc-job"><span>Your job right now</span>${esc(st.stage.job)}</div>
      </div>
      <div class="kv"><span>Planted</span><b>${fmtU(new Date(seg.planted))}</b></div>
      <div class="kv"><span>${toGo>=0?'Harvest due':'Harvest was due'}</span><b>${fmtU(harvest)}${toGo>=0?` \u00b7 ${plural(toGo,'day')}`:` \u00b7 ${plural(-toGo,'day')} ago`}</b></div>
      ${c.succ?`<div class="kv"><span>Next succession sowing</span><b>${fmtU(shift(new Date(seg.planted),c.succ))}</b></div>`:''}
      ${(c.feed||[]).length?`<div class="sheet-eyebrow">Feeding schedule</div>${
        c.feed.map(f=>{const w=shift(new Date(seg.planted),f.d),a=dayDiff(w,TODAY);
          return `<div class="feedline ${a<0?'past':a<=7?'due':''}">
            <span class="fd">${fmtU(w)}${a===0?' \u00b7 today':a<0?` \u00b7 ${-a}d ago`:` \u00b7 in ${a}d`}</span>${esc(f.do)}</div>`;}).join('')}`:''}
      <button class="btn-ghost" data-unplantseg="${state.openSeg}">Clear planting date</button>`;
  }

  return `<div class="sheet-bg" data-close="1"></div><div class="sheet">
    <div class="sheet-head">
      <div><h3>${esc(segName(seg))}</h3>
        <div class="sheet-sub">${seg.variety?esc(c.name)+' \u00b7 ':''}${seg.ft} ft in ${esc(bed.name)} \u00b7 ${esc(c.fam)}${c.heavy?' \u00b7 heavy feeder':''}</div></div>
      <button class="x" data-close="1">Close</button>
    </div>
    <div class="sheet-body">
      <div class="calc">
        <div><span class="cl">Plants</span><b>${n}</b></div>
        <div><span class="cl">Spacing</span><b>${seg.sp} in</b></div>
        <div><span class="cl">Est. yield</span><b>${lb<10?lb.toFixed(1):Math.round(lb)} lb</b></div>
        <div><span class="cl">Maturity</span><b>${segDtm(seg)<300?segDtm(seg)+'d':'\u2014'}</b></div>
      </div>
      <div class="resize">
        <span>Resize this section</span>
        <div class="stepper"><button data-segstep="${state.openSeg}:-1">\u2212</button>
          <b>${seg.ft} ft</b>
        <button data-segstep="${state.openSeg}:1">+</button></div>
      </div>
      ${cycle}
      ${c.note?`<div class="cropnote">${esc(c.note)}</div>`:''}
      <div class="sheet-actions">
        <button class="btn-ghost" data-askcrop="${c.id}">Ask about this section</button>
        <button class="btn-ghost danger" data-delseg="${state.openSeg}">Remove section</button>
      </div>
    </div></div>`;
}

// ---------- ALMANAC -------------------------------------------------------
const SLOTS = 36;
function slotOf(d){const day=d.getDate();return d.getMonth()*3+(day<=10?0:day<=20?1:2);}
function almanacView() {
  const fams = ['all',...Array.from(new Set(CROPS.map(c=>c.fam))).sort()];
  const list = CROPS.filter(c=>state.famFilter==='all'||c.fam===state.famFilter);
  const nowSlot = slotOf(TODAY);
  const planted = new Set(allSegs().map(x=>x.seg.cropId));

  const rows = list.map(c=>{
    const cells = new Array(SLOTS).fill(null);
    windowsFor(c).forEach(w=>{
      let a=slotOf(w.from), b=slotOf(w.to);
      if (w.from.getFullYear()<YEAR) a=0;
      if (w.to.getFullYear()>YEAR) b=SLOTS-1;
      const rank={indoor:1,harvest:2,sow:3,set:3};
      for(let i=Math.max(0,a);i<=Math.min(SLOTS-1,b);i++)
        if(!cells[i]||rank[w.kind]>rank[cells[i]]) cells[i]=w.kind;
    });
    return `<div class="grid-row" data-crop="${c.id}">
      <div class="grid-label"><span class="gl-name ${planted.has(c.id)?'mine':''}">${esc(c.name)}</span>
        <span class="gl-dtm">${c.dtm<300?c.dtm+'d':'\u2014'}</span></div>
      <div class="grid-cells">${cells.map((k,i)=>
        `<div class="cell ${k?'k-'+k:''} ${i===nowSlot?'today':''}"></div>`).join('')}</div>
    </div>`;
  }).join('');

  return `<div class="wrap">
    <div class="eyebrow">Planting year \u00b7 zone ${esc(state.place.zone)}</div>
    <div class="legend">

// ---------- LIBRARY: the master search ------------------------------------
function libraryView() {
  const kinds = [['all','Everything',INDEX.length],
    ['crop','Crops',INDEX.filter(r=>r.kind==='crop').length],
    ['variety','Varieties',INDEX.filter(r=>r.kind==='variety').length],
    ...(ANIMALS?[['chicken','Poultry breeds',INDEX.filter(r=>r.kind==='chicken').length],
      ['goat','Goat breeds',INDEX.filter(r=>r.kind==='goat').length]]:[]),
    ['recipe','Canning recipes',INDEX.filter(r=>r.kind==='recipe').length],
    ['problem','Problems',INDEX.filter(r=>r.kind==='problem').length]];
  const filt = state.libKind==='all' ? null : [state.libKind];
  const res = state.libQ.trim()
    ? searchIndex(state.libQ, filt, 40)
    : INDEX.filter(r=>!filt||r.kind===filt[0]).slice(0,40);

  return `<div class="wrap">
    <div class="eyebrow">Library \u00b7 ${INDEX.length} entries</div>
    <input class="bigsearch" data-lib="1" autocomplete="off" spellcheck="false"
      value="${esc(state.libQ)}" placeholder="Describe a symptom, or search a crop, variety, or recipe\u2026">
    <div class="filters">${kinds.map(([k,l,n])=>
      `<button class="chip ${state.libKind===k?'on':''}" data-libkind="${k}">${l} <i>${n}</i></button>`).join('')}</div>
    <div class="card">${res.length?res.map(r=>`
      <div class="row" data-libopen="${esc(r.kind)}|${esc(r.name)}|${esc(r.id||'')}">
        <div><div class="row-name">${esc(r.name)}</div>
          <div class="row-note">${esc(r.sub)}</div></div>
        <div class="row-right"><span class="pillcount">${r.kind==='problem'?`<span class="sevdot ${r.obj.sev}"></span>${r.obj.g==='plant'?'plant':r.obj.g}`:r.kind==='variety'?'variety':r.kind==='chicken'?'poultry':r.kind}</span></div>
      </div>`).join('')
      :`<div class="empty">Nothing matching that. Try a breed name, a crop, a variety, or a trait like "broody", "dairy", or "paste".</div>`}</div>
    <div class="hint">Search runs across names and descriptions, so "dark eggs", "heat tolerant", or "paste" all work.</div>
  </div>`;
}

function libSheet() {
  if (!state.openLib) return '';
  const [kind, name, id] = state.openLib.split('|');
  const rec = INDEX.find(r=>r.kind===kind && r.name===name && (r.id||'')===(id||''));
  if (!rec) return '';
  let body = '';
  if (kind==='chicken' || kind==='goat') {
    body = breedCard(rec.obj);
    if (kind==='chicken' && rec.obj.eggs) {
      const n = state.keeps.chickens ? state.chickens.count : 6;
      const e = expectedEggs(rec.obj.name, n, 14);
      body += `<div class="sheet-eyebrow">What ${n} of these would give you</div>
        <div class="kv"><span>At peak, this month</span><b>${e.perDay} eggs a day</b></div>
        <div class="kv"><span>Over a year</span><b>about ${Math.round(rec.obj.eggs*n/12)} dozen</b></div>
        <div class="kv"><span>Feed for ${n} birds</span><b>${(henFeedRate(rec.obj.lb)*n).toFixed(1)} lb a day</b></div>
        <div class="kv"><span>A 50 lb bag lasts</span><b>${Math.floor(50/(henFeedRate(rec.obj.lb)*n))} days</b></div>`;
    }
    if (kind==='goat' && rec.obj.milk) {
      const n = state.keeps.goats ? Math.max(1,state.goats.milking) : 1;
      body += `<div class="sheet-eyebrow">What ${n} in milk would give you</div>
        <div class="kv"><span>Milk a day</span><b>${(rec.obj.milk*n).toFixed(1)} qt</b></div>
        <div class="kv"><span>Over a 10 month lactation</span><b>about ${Math.round(rec.obj.milk*n*300/4)} gal</b></div>
        <div class="kv"><span>Cheese yield, rough</span><b>${(rec.obj.milk*n*0.22).toFixed(1)} lb a day</b></div>`;
    }
    body += `<div class="sheet-actions">
      ${kind==='chicken'?`<button class="btn-ghost" data-usebreed="chickens|${esc(rec.obj.name)}">Use as my breed</button>`:''}
      ${kind==='goat'?`<button class="btn-ghost" data-usebreed="goats|${esc(rec.obj.name)}">Use as my breed</button>`:''}
      <button class="btn-ghost" data-askcrop2="${esc(rec.obj.name)}">Ask about this breed</button></div>`;
  } else {
    const c = kind==='variety' ? rec.obj.crop : rec.obj;
    const dtm = kind==='variety' ? (rec.obj.dtm||c.dtm) : c.dtm;
    const ws = windowsFor(c);
    body = `<div class="calc">
        <div><span class="cl">Spacing</span><b>${c.sp} in</b></div>
        <div><span class="cl">Per 10 ft</span><b>${Math.floor(120/c.sp)}</b></div>
        <div><span class="cl">Yield each</span><b>${c.yld<1?c.yld.toFixed(2):c.yld} lb</b></div>
        <div><span class="cl">Maturity</span><b>${dtm<300?dtm+'d':'1 yr+'}</b></div>
      </div>
      ${kind==='variety'?`<div class="cropnote">${esc(rec.obj.note)}</div>`:''}
      <div class="kv"><span>Family</span><b>${esc(c.fam)}</b></div>
      <div class="kv"><span>Planting depth</span><b>${esc(c.depth)}</b></div>
      ${c.succ?`<div class="kv"><span>Succession</span><b>every ${c.succ} days</b></div>`:''}
      <div class="sheet-eyebrow">Your dates, zone ${esc(state.place.zone)}</div>
      ${ws.map(w=>`<div class="kv"><span>${KIND_LABEL[w.kind]} \u00b7 ${w.season}</span><b>${fmtU(w.from)} \u2013 ${fmtU(w.to)}</b></div>`).join('')}
      ${(c.feed||[]).length?`<div class="sheet-eyebrow">Feeding</div>${c.feed.map(f=>
        `<div class="feedline"><span class="fd">${f.d===0?'At planting':'Day '+f.d}</span>${esc(f.do)}</div>`).join('')}`:''}
      ${c.note&&kind!=='variety'?`<div class="cropnote">${esc(c.note)}</div>`:''}
      <div class="sheet-actions">
        ${state.beds.length?`<button class="btn" data-toplant="${esc(c.id)}|${kind==='variety'?esc(rec.obj.name):''}">Add to a bed</button>`:''}

  }
  return `<div class="sheet-bg" data-close="1"></div><div class="sheet">
    <div class="sheet-head"><div><h3>${esc(rec.name)}</h3>
      <div class="sheet-sub">${esc(rec.sub)}</div></div>

}

// ---------- SUPPLY / ASK --------------------------------------------------
function gauge(s,i) {
  const days = Math.floor(s.burn>0?s.onHand/s.burn:999);
  const pct = Math.max(0,Math.min(1,s.onHand/(s.bag||1)));
  const warn = days<=10, SEG=20, on=Math.max(1,Math.round(pct*SEG));
  let bars=''; for(let n=0;n<SEG;n++) bars+=`<div class="bar ${n<on?'on':''} ${warn?'warn':''}"></div>`;
  return `<div class="gauge">
    <div class="gauge-top"><div><div class="gauge-name">${esc(s.name)}</div>
      <div class="burn">${esc(s.note)}</div></div>
      <div class="gauge-days"><b>${days}</b> days left</div></div>
    <div class="bars">${bars}</div>
    <div class="gauge-foot"><div class="runout ${warn?'warn':''}">Runs out <b>${fmtU(shift(TODAY,days))}</b> \u00b7 ${s.onHand.toFixed(1)} ${esc(s.unit)} left \u00b7 ${s.burn} ${esc(s.unit)}/day</div>
      <button class="btn-ghost" data-refill="${i}">Opened a new one</button></div></div>`;
}
function supplyView() {
  let eggCard = '';
  if (state.keeps.chickens) {
    const c = state.chickens, e = expectedEggs(c.breed, Math.max(0,c.count-(+c.pullets||0)), c.ageMonths);
    const br = chickenBreed(c.breed);
    if (e && br) {
      const why = [];
      if (e.factor < 1) why.push(`age, ${c.ageMonths} months puts them past peak`);
      if (e.daylight < 1) why.push(`short daylight this month`);
      if (+c.pullets) why.push(`${c.pullets} pullets not laying yet`);
      eggCard = `<div class="eyebrow">Expected laying</div><div class="card">
        <div class="gauge"><div class="gauge-top">
          <div><div class="gauge-name">${esc(br.name)}</div>
            <div class="burn">${br.eggs} eggs a year at peak \u00b7 ${esc(br.eggColor.toLowerCase())} eggs</div></div>
          <div class="gauge-days"><b>${e.perDay}</b> a day</div></div>
          <div class="gauge-foot"><div class="runout">About <b>${Math.round(e.perDay*7)}</b> a week, <b>${(e.perDay*7/12).toFixed(1)}</b> dozen${why.length?` \u00b7 adjusted for ${why.join(', ')}`:''}</div></div>
        </div></div>
        <div class="hint">If you are getting well under this, that gap is worth asking about. Molt, a hidden nest, mites, low protein, and a predator scare all read the same on the count.</div>`;
    }
  }
  return `<div class="wrap">${eggCard}<div class="eyebrow">Supply</div>
    <div class="card">${state.supplies.length?state.supplies.map(gauge).join('')
      :`<div class="empty">No animals on file. Nothing to project.</div>`}</div>
    <div class="hint">Modeled from headcount, never logged by hand. ${RATES.layer} lb per layer per day, ${RATES.goatGrain} lb goat maintenance, ${RATES.goatMilking} lb in milk. Confirming a new bag is the only input asked for.</div></div>`;
}
function askView() {
  const chips = ['Can I plant this weekend?','What should I be preserving right now?',
    'Is it too late for fall brassicas?','What is eating holes in my squash leaves?',
    'How is my garden doing overall?','My tomatoes are cracking, what changed?'];
  const tier = aiTier(), blocked = tier==='out'||tier==='none';
  return `<div class="wrap"><div class="eyebrow">Ask</div>
    ${aiMeter()}
    <div class="card">
    <div class="ask-row"><input id="askbox" ${blocked||state.answerLoading?'disabled':''}
        placeholder="${blocked?'Add questions to ask again':'Can I plant this weekend?'}" value="${esc(state.askText)}">
      <button class="btn" data-act="ask" ${blocked||state.answerLoading?'disabled':''}>${
        state.answerLoading?'Thinking':'Ask'}</button></div>
    <div class="suggest">${chips.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    ${state.answer?`<div class="answer"><div class="qline">${esc(state.answer.q)}</div>
      ${state.answerLoading?thinkingBlock():rich(state.answer.a)}</div>`:''}
  </div><div class="hint">It already knows your bed layout, plant counts, and stages. This is for what it cannot compute: weather, diagnosis, judgment. Not veterinary advice.</div></div>`;
}

// ===========================================================================
function render() {
  const y = window.scrollY;
  root.className = state.theme === 'daylight' ? 'daylight' : '';
  root.style.setProperty('--fs', state.fs);
  if (state.signedIn) queueSave();
  if (!state.signedIn) { root.innerHTML = authView(); window.scrollTo(0,0);
    const ab=root.querySelector('[data-auth]');
    if(ab&&state.auth.step==='email'){ ab.focus();
      try { const n=ab.value.length; ab.setSelectionRange(n,n); } catch(_) {} }
    return; }
  if (!state.onboarded) { root.innerHTML = mast()+onboarding(); window.scrollTo(0,y);
    const zb=document.getElementById('zipbox'); if(zb&&state.place.zip.length<5){zb.focus();zb.setSelectionRange(99,99);} return; }
  if (!ANIMALS && state.tab==='supply') state.tab='now';
  const body = {garden:gardenView,now:dashView,almanac:almanacView,putup:putupView,seasons:seasonsView,print:printPlanView,greenhouse:greenhouseView,timeline:timelineView,field:fieldView,neighbors:neighborsView,share:shareView,library:libraryView,supply:supplyView,ask:askView,plan:planView}[state.tab]();
  root.innerHTML = mast()+tabs()+body+
    `<div class="wrap"><div class="footnote">SteadN v0 \u00b7 ${CROPS.length} crops \u00b7 zone ${esc(state.place.zone)} dates computed from frost averages, not looked up. Frost dates are 30 year averages so your microclimate shifts them a week either way. Yield figures are planning estimates. Nothing saves between sessions yet.</div></div>`+
    segSheet()+(state.openCrop?cropSheet():'')+libSheet()+recipeSheet()+probSheet()+nborSheet()+tagSheet();
  window.scrollTo(0,y);
  paintSaveChip();
  // keep the caret in whichever search field is live
  const live = state.sb ? root.querySelector(`[data-sb="${state.sb.key}"]`)
             : (state.tab==='library' && state.libQ!=='') ? root.querySelector('[data-lib]')
             : (state.tab==='putup' && state.putup==='recipes' && state.recipeQ!=='') ? root.querySelector('[data-rq]')
             : null;
  if (live) { live.focus();
    try { const n=live.value.length; live.setSelectionRange(n,n); } catch(_) {} }
}

// ===========================================================================
root.addEventListener('click', e => {
  // every attribute the handler below reads must be listed here, or a click
  // on a non-button element silently does nothing.
  const t = e.target.closest('button,a,[data-ackplant],[data-act],[data-add],[data-addplan],[data-askcrop],[data-auth],[data-chatq],[data-close],[data-credits],[data-crop],[data-d],[data-delbed],[data-delhv],[data-delseg],[data-donekey],[data-fam],[data-field],[data-hv],[data-hvstep],[data-libkind],[data-libopen],[data-nbor],[data-nbstep],[data-opentag],[data-pantry],[data-people],[data-pi],[data-pick],[data-pin],[data-plancl],[data-planoff],[data-planon],[data-planqt],[data-plantgap],[data-plantseg],[data-plot],[data-plotstyle],[data-prob],[data-pt],[data-putup],[data-q],[data-rate],[data-rcat],[data-recipe],[data-refill],[data-scope],[data-seg],[data-segstep],[data-sendchat],[data-setplan],[data-step],[data-tab],[data-tagc],[data-tagmode],[data-tagprob],[data-tagsave],[data-tagsub],[data-tagw],[data-toplant],[data-unplantseg],[data-usebreed],[data-usecrop],[data-usefaster],[data-vendor],[data-zip]');
  if (!t) return;

  if (t.dataset.close){state.openSeg=null;state.openCrop=null;state.openLib=null;state.openRecipe=null;state.openProb=null;state.openNbor=null;state.openTag=null;return render();}
  if (t.dataset.libkind){state.libKind=t.dataset.libkind;return render();}
  if (t.dataset.libopen){
    const [k,n,i]=t.dataset.libopen.split('|');
    if (k==='recipe'){ state.openRecipe=i; state.pantryDraft=7; return render(); }
    if (k==='problem'){ state.openProb=i; return render(); }
    state.openLib=t.dataset.libopen; return render();
  }
  if (t.dataset.recipe){state.openRecipe=t.dataset.recipe;state.pantryDraft=7;return render();}
  if (t.dataset.prob){state.openProb=t.dataset.prob;state.openCrop=null;state.openLib=null;return render();}
  if (t.dataset.nbor){state.openNbor=t.dataset.nbor;state.chatDraft='';return render();}
  if (t.dataset.scope){
    const [k,lv]=t.dataset.scope.split('|');
    state.share.scopes[k]=lv; return render();
  }
  if (t.dataset.chatq){state.chatDraft=t.dataset.chatq;return render();}
  if (t.dataset.ackplant){ if(state.draft) state.draft.ack=!state.draft.ack; return render(); }
  if (t.dataset.planon){
    const it=state.planItems[t.dataset.planon]; if(it) it.on=!it.on; return render();
  }
  if (t.dataset.planoff){
    const it=state.planItems[t.dataset.planoff]; if(it) it.on=false; return render();
  }
  if (t.dataset.planqt){
    const [cid,d]=t.dataset.planqt.split('|');
    const it=state.planItems[cid]; if(it){ it.qt=Math.max(0,(it.qt||0)+ +d); it.on=true; }
    return render();
  }
  if (t.dataset.plancl){
    const [cid,d]=t.dataset.plancl.split('|');
    const it=state.planItems[cid]; if(it){ it.cellar=Math.max(0,(it.cellar||0)+ +d); it.on=true; }
    return render();
  }
  if (t.dataset.plot){
    const [k,d]=t.dataset.plot.split('|');
    state.plot[k]=Math.max(k==='edge'?0:4, Math.min(500,(state.plot[k]||0)+ +d));
    return render();
  }
  if (t.dataset.plotstyle){ state.plot.style=t.dataset.plotstyle; return render(); }
  if (t.dataset.walk){
    state.plot.walk = Math.max(0, Math.min(48, (state.plot.walk==null?24:state.plot.walk) + +t.dataset.walk));
    return render();
  }
  if (t.dataset.walkset){ state.plot.walk = +t.dataset.walkset; return render(); }
  if (t.dataset.theme){ state.theme = state.theme==='daylight'?'night':'daylight'; return render(); }
  if (t.dataset.fs){ state.fs = +t.dataset.fs; return render(); }
  if (t.dataset.gseason){ state.gardenSeason=t.dataset.gseason; return render(); }
  if (t.dataset.ghstat){
    const [k,s] = t.dataset.ghstat.split('|');
    if (k.indexOf('tray:') === 0) {          // started by hand, not from the plan
      const tr = state.trays.find(x => 'tray:'+x.id === k);
      if (tr) tr.status = s;
      return render();
    }
    const prev = state.starts[k] || {};
    state.starts[k] = { status:s,
      sownOn: s==='planned' ? null : (prev.sownOn || TODAY.toISOString()) };
    // moving a tray to the ground sets the planting date on that section
    const [bedId, segId] = k.split(':');
    const bed = state.beds.find(b=>b.id===bedId);
    const seg = bed && bed.segments.find(x=>x.id===segId);
    if (seg) seg.planted = (s==='transplanted') ? TODAY.toISOString() : null;
    return render();
  }
  if (t.dataset.btray){
    const b = allBatches().find(x=>x.key===t.dataset.btray);
    if (b) { state.ghFocus = b.key; state.ghOpen = true; }
    return render();
  }
  if (t.dataset.traystep){
    const d = state.trayDraft;
    d.cells = Math.max(1, Math.min(500, (+d.cells||24) + +t.dataset.traystep));
    return render();
  }
  if (t.dataset.theme){ state.theme = state.theme==='daylight'?'night':'daylight'; return render(); }
  if (t.dataset.fs){ state.fs = +t.dataset.fs; return render(); }
  if (t.dataset.field){ state.field=t.dataset.field; return render(); }
  if (t.dataset.tagsub){ state.tagSub=+t.dataset.tagsub; return render(); }
  if (t.dataset.opentag){ state.openTag=t.dataset.opentag; state.tagLb=0; state.tagMode='harvest'; return render(); }
  if (t.dataset.tagmode){ state.tagMode=t.dataset.tagmode; return render(); }
  if (t.dataset.tagw){
    if (t.dataset.tagw==='clear') state.tagLb=0;
    else state.tagLb=Math.max(0,(state.tagLb||0)+ +t.dataset.tagw);
    return render();
  }
  if (t.dataset.tagc){ state.tagLb=(state.tagLb||0)+ +t.dataset.tagc; return render(); }
  if (t.dataset.tagsave){
    const tg=findTag(t.dataset.tagsave);
    if (tg && state.tagLb>0){
      state.harvests.push({cropId:tg.seg.cropId, lb:+state.tagLb.toFixed(1),
        date:TODAY.toISOString(), tag:tg.payload});
    }
    state.tagLb=0; state.openTag=null; return render();
  }
  if (t.dataset.tagprob){
    const [pay,pid]=t.dataset.tagprob.split('|');
    state.issues.push({tag:pay, probId:pid, date:TODAY.toISOString()});
    state.openProb=pid; state.openTag=null; return render();
  }
  if (t.dataset.vendor){ state.vendor = state.vendor===t.dataset.vendor?null:t.dataset.vendor; return render(); }
  if (t.dataset.pin){
    state.pinned[t.dataset.pin]=!state.pinned[t.dataset.pin]; return render();
  }
  if (t.dataset.usefaster){
    const [cid,name,dtm]=t.dataset.usefaster.split('|');
    if (state.draft){ state.draft.cropId=cid; state.draft.variety=name;
      state.draft.dtm=+dtm; state.draft.sp=cropById(cid).sp; state.draft.ack=false; state.draft.custom=false; }
    return render();
  }
  if (t.dataset.usecrop){
    const cid=t.dataset.usecrop;
    if (state.draft){ state.draft.cropId=cid; state.draft.variety=null;
      state.draft.dtm=null; state.draft.sp=cropById(cid).sp; state.draft.ack=false; state.draft.custom=false; }
    return render();
  }
  if (t.dataset.credits){state.ai.credits=(state.ai.credits||0)+ +t.dataset.credits;return render();}
  if (t.dataset.setplan){
    state.plan=t.dataset.setplan;
    if (!state.ai.periodStart) state.ai.periodStart=shift(TODAY,-244).toISOString();
    return render();
  }
  if (t.dataset.sendchat){
    const h=t.dataset.sendchat, box=document.getElementById('chatbox');
    const txt=(box?box.value:state.chatDraft).trim();
    if (txt){
      state.chat[h]=(state.chat[h]||(SEED_CHAT[h]||[]).slice()).concat([{who:'me',t:txt,d:0}]);
      state.chatDraft='';
    }
    return render();
  }
  if (t.dataset.donekey){
    const k=t.dataset.donekey;
    state.done[k]=true;
    if (k.indexOf('c:')===0) state.chores[k.split(':')[1]]=TODAY.toISOString();
    return render();
  }
  if (t.dataset.rate){
    const [cid,n]=t.dataset.rate.split('|');
    state.ratings[cid] = state.ratings[cid]===+n ? 0 : +n;
    return render();
  }
  if (t.dataset.putup){state.putup=t.dataset.putup;return render();}
  if (t.dataset.people){state.people=Math.max(1,Math.min(20,state.people+ +t.dataset.people));return render();}
  if (t.dataset.hvstep){state.hv.lb=Math.max(0,(+state.hv.lb||0)+ +t.dataset.hvstep);return render();}
  if (t.dataset.delhv){state.harvests.splice(+t.dataset.delhv,1);return render();}
  if (t.dataset.rcat){state.recipeCat=t.dataset.rcat;return render();}
  if (t.dataset.pantry){
    const [id,d]=t.dataset.pantry.split('|');
    state.pantryDraft=Math.max(0,state.pantryDraft+ +d); return render();
  }
  if (t.dataset.pt){
    const [cid,d]=t.dataset.pt.split('|');
    state.pantry[cid]=Math.max(0,(state.pantry[cid]||0)+ +d); return render();
  }
  if (t.dataset.plantgap){
    const [cid,ft]=t.dataset.plantgap.split('|');
    let bed=state.beds.find(b=>bedFree(b)>0);
    if(!bed){ bed={id:uid(),name:`Bed ${state.beds.length+1}`,len:Math.max(10,Math.ceil(+ft)),segments:[]};
      state.beds.push(bed); }
    const c=cropById(cid);
    state.draft={bedId:bed.id,cropId:cid,ft:Math.min(+ft,bedFree(bed)),sp:c.sp,variety:null,dtm:null};
    state.tab='garden'; return render();
  }
  if (t.dataset.usebreed){
    const [k,n]=t.dataset.usebreed.split('|');
    state.keeps[k]=true; state[k].breed=n; buildSupplies(); state.openLib=null;
    return render();
  }
  if (t.dataset.askcrop2){
    state.openLib=null;
    return ask(`Tell me what to expect from ${t.dataset.askcrop2} on my place, and anything I should watch for with them.`);
  }
  if (t.dataset.toplant){
    const [cid,vname]=t.dataset.toplant.split('|');
    const bed=state.beds.find(b=>bedFree(b)>0)||state.beds[0];
    const c=cropById(cid);
    const v=vname?varietiesFor(cid).find(x=>x[0]===vname):null;
    state.draft={bedId:bed.id,cropId:cid,ft:Math.min(5,bedFree(bed)),sp:c.sp,
      variety:vname||null,dtm:v?v[1]:null};
    state.openLib=null; state.tab='garden'; return render();
  }
  if (t.dataset.pi){
    const [key,kind,name,id]=t.dataset.pi.split('|');
    if (key==='draft.crop'){
      if (kind==='variety'){
        const v=varietiesFor(id).find(x=>x[0]===name);
        state.draft.cropId=id; state.draft.variety=name; state.draft.dtm=v?v[1]:null;
        state.draft.sp=cropById(id).sp; state.draft.ack=false; state.draft.custom=false;
      } else {
        state.draft.cropId=id; state.draft.variety=null; state.draft.dtm=null;
        state.draft.sp=cropById(id).sp; state.draft.ack=false; state.draft.custom=false;
      }
    } else {
      const [grp,fld]=key.split('.');
      state[grp][fld]=name;
      if (state.onboarded) buildSupplies();
    }
    state.sb=null; return render();
  }
  if (t.dataset.tab){state.tab=t.dataset.tab;state.openSeg=null;state.openCrop=null;state.draft=null;return render();}
  if (t.dataset.fam){state.famFilter=t.dataset.fam;return render();}
  if (t.dataset.pick){state.keeps[t.dataset.pick]=!state.keeps[t.dataset.pick];return render();}
  if (t.dataset.q){state.askText=t.dataset.q;return ask(t.dataset.q);}

  // bed management
  if (t.dataset.add){
    const b=state.beds.find(x=>x.id===t.dataset.add);
    state.draft={bedId:b.id,cropId:CROPS[0].id,ft:Math.min(5,bedFree(b)),sp:CROPS[0].sp,ack:false};
    state.newBed.open=false; return render();
  }
  if (t.dataset.delbed){state.beds=state.beds.filter(b=>b.id!==t.dataset.delbed);
    state.draft=null;return render();}
  if (t.dataset.nbstep){state.newBed.len=Math.max(1,state.newBed.len+ +t.dataset.nbstep);return render();}
  if (t.dataset.step){
    const [k,v]=t.dataset.step.split(':');
    const bed=state.beds.find(x=>x.id===state.draft.bedId);
    if(k==='ft') state.draft.ft=Math.max(0,Math.min(bedFree(bed),(+state.draft.ft||0)+ +v));
    else if(k==='dtm'){
      const cc=cropById(state.draft.cropId);
      const kn=varietiesFor(state.draft.cropId).find(x=>x[0]===state.draft.variety);
      const cur=state.draft.dtm || (kn?kn[1]:(cc?cc.dtm:60));
      state.draft.dtm=Math.max(1,Math.min(400,cur+ +v));
      state.draft.ack=false;
    }
    else state.draft.sp=Math.max(1,(+state.draft.sp||12)+ +v);
    return render();
  }
  if (t.dataset.segstep){
    const p=t.dataset.segstep.split(':'), d=+p[2];
    const bed=state.beds.find(b=>b.id===p[0]); const seg=bed.segments.find(s=>s.id===p[1]);
    const room=bedFree(bed);
    seg.ft=Math.max(0.5,seg.ft+(d>0?Math.min(1,room):-1));
    return render();
  }
  if (t.dataset.delseg){
    const p=t.dataset.delseg.split(':');
    const bed=state.beds.find(b=>b.id===p[0]);
    bed.segments=bed.segments.filter(s=>s.id!==p[1]);
    state.openSeg=null; return render();
  }
  if (t.dataset.plantseg){
    const p=t.dataset.plantseg.split(':');
    const bed=state.beds.find(b=>b.id===p[0]);
    bed.segments.find(s=>s.id===p[1]).planted=TODAY.toISOString();
    return render();
  }
  if (t.dataset.unplantseg){
    const p=t.dataset.unplantseg.split(':');
    const bed=state.beds.find(b=>b.id===p[0]);
    bed.segments.find(s=>s.id===p[1]).planted=null;
    return render();
  }
  if (t.dataset.askcrop){
    const c=cropById(t.dataset.askcrop); state.openSeg=null; state.openCrop=null;
    return ask(`How should my ${c.name.toLowerCase()} be doing right now, and what should I watch for over the next two weeks?`);
  }
  if (t.dataset.refill!==undefined&&t.dataset.refill!==''){
    const s=state.supplies[+t.dataset.refill]; s.onHand+=s.bag; return render();
  }
  if (t.dataset.seg){state.openSeg=t.dataset.seg;state.openCrop=null;return render();}
  if (t.dataset.crop){state.openCrop=t.dataset.crop;state.openSeg=null;return render();}

  switch (t.dataset.act) {
    case 'next': state.step = ANIMALS ? state.step+1 : state.step; if(!ANIMALS){return render();} return render();
    case 'finish': {
      const hit=zipLookup(state.place.zip);
      if(hit){state.place.zone=hit.zone;state.place.near=hit.near;}
      state.onboarded=true; buildSupplies(); state.tab='garden';
      state.newBed={open:true,name:'North row',len:20};
      return render();
    }
    case 'newbed': state.newBed={open:true,name:`Bed ${state.beds.length+1}`,len:20};
      state.draft=null; return render();
    case 'cancelbed': state.newBed.open=false; return render();
    case 'savebed': {
      const b={id:uid(),name:state.newBed.name.trim()||`Bed ${state.beds.length+1}`,
               len:Math.max(1,+state.newBed.len||10),segments:[]};
      state.beds.push(b); state.newBed.open=false;
      state.draft={bedId:b.id,cropId:CROPS[0].id,ft:Math.min(5,b.len),sp:CROPS[0].sp,ack:false};
      return render();
    }
    case 'canceldraft': state.draft=null; return render();
    case 'addseg':
    case 'addseg-planted': {
      const d=state.draft, bed=state.beds.find(b=>b.id===d.bedId);
      const ft=Math.min(+d.ft||0,bedFree(bed));
      if(ft>0) bed.segments.push({id:uid(),cropId:d.cropId,ft,sp:+d.sp||12,
        variety:d.variety||null, dtm:d.dtm||null,
        planted:t.dataset.act==='addseg-planted'?TODAY.toISOString():null});
      state.draft=bedFree(bed)>0?{bedId:bed.id,cropId:d.cropId,ft:Math.min(5,bedFree(bed)),
        sp:+d.sp||12,variety:null,dtm:null,ack:false,custom:false}:null;
      return render();
    }
    case 'loghv': {
      if (+state.hv.lb>0) state.harvests.push({cropId:state.hv.cropId,lb:+state.hv.lb,date:TODAY.toISOString()});
      state.hv.lb=10; return render();
    }
    case 'minetoggle': state.recipeMine=!state.recipeMine; return render();
    case 'resetdone': state.done={}; return render();
    case 'wipe': {
      if (!state.confirmWipe) { state.confirmWipe = true; return render(); }
      wipeSaved().then(() => { location.reload(); });
      return;
    }
    case 'wipecancel': state.confirmWipe = false; return render();
    case 'ghtoggle': state.ghOpen=!state.ghOpen; return render();
    case 'optrun': {
      const o = optimiseRows();
      state.optPreview = { before:o.base.totalFt, after:o.best.ft, cfg:o.best.cfg,
        pairs:o.best.pairs, fits:o.fits, hogs:o.hogs, prev:state.rowOpt };
      state.rowOpt = o.best.cfg;              // shown live while previewing
      return render();
    }
    case 'optkeep': state.optPreview=null; return render();
    case 'optrevert': {
      state.rowOpt = state.optPreview ? (state.optPreview.prev || null) : null;
      state.optPreview = null;
      return render();
    }
    case 'trayopen': state.trayOpen=true; return render();
    case 'trayclose': state.trayOpen=false; return render();
    case 'traysave': {
      const d=state.trayDraft, c=cropById(d.cropId||'tomato');
      if (c) {
        const wk = c.indoor ? (c.indoor[0]+c.indoor[1])/2 : 5;
        state.trays.push({ id:uid(), cropId:c.id, variety:(d.variety||'').trim()||null,
          cells:+d.cells||24, sownOn:TODAY.toISOString(),
          targetOn: shift(TODAY, Math.round(wk*7)).toISOString(),
          status:'sown', season:state.gardenSeason });
        state.ghOpen = true;
      }
      state.trayOpen=false; state.trayDraft={cropId:d.cropId||'tomato',cells:24};
      return render();
    }
    case 'buildplot': applyPlot(); state.tab='garden'; state.draft=null;
      state.newBed.open=false; return render();
    case 'toggledims': state.plotDims=!state.plotDims; return render();
    case 'makegarden': state.tab='putup'; state.putup='build'; state.plotDims=false;
      state.builtOnce=true; return render();
    case 'widenplot': state.plot.w=plotNeededSize().widthNeeded; return render();
    case 'clearpins': state.pinned={}; return render();
    case 'toggleprintqr': state.printQr=!state.printQr; return render();
    case 'toggleprintnotes': state.printNotes=!state.printNotes; return render();
    case 'doprint': window.print(); return;
    case 'togglelist': state.showList=!state.showList; return render();
    case 'toggleoffplan': state.offPlan=!state.offPlan; return render();
    case 'resetdtm': {
      const kn=varietiesFor(state.draft.cropId).find(x=>x[0]===state.draft.variety);
      state.draft.dtm = kn ? kn[1] : null;
      state.draft.ack = false;
      return render();
    }
    case 'sendlink': state.auth.step='sent'; return render();
    case 'backemail': state.auth.step='email'; return render();
    case 'demoin':
      state.signedIn=true;
      if (!state.ai.periodStart) state.ai.periodStart = shift(TODAY,-244).toISOString();
      if (!state.planItems) state.planItems = initPlanItems();
      return render();
    case 'toggleshare': state.share.enabled=!state.share.enabled; return render();
    case 'closeseason': {
      const rows = currentSeasonRows().map(r=>({...r, rating:state.ratings[r.cropId]||0}));
      state.seasons = state.seasons.filter(s=>s.year!==YEAR);
      state.seasons.push({year:YEAR, entries:rows});
      return render();
    }
    case 'editelev': state.elevEdit=true; return render();
    case 'doneelev': state.elevEdit=false; return render();
    case 'savepantry': {
      const r=RECIPES.find(x=>x.id===state.openRecipe);
      if (r){ const k=r.crop||r.id;
        state.pantry[k]=(state.pantry[k]||0)+state.pantryDraft; }
      state.openRecipe=null; state.tab='putup'; state.putup='pantry'; return render();
    }
    case 'ask': {const b=document.getElementById('askbox'); return ask(b?b.value:'');}
  }
});

root.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.zip !== undefined) {
    state.place.zip = el.value.replace(/\D/g,'').slice(0,5);
    const hit = zipLookup(state.place.zip);
    if (hit) { state.place.zone=hit.zone; state.place.near=hit.near; }
    return render();
  }
  if (el.dataset.sb !== undefined) {
    state.sb = { key:el.dataset.sb, q:el.value }; return render();
  }
  if (el.dataset.lib !== undefined) { state.libQ = el.value; return render(); }
  if (el.dataset.rq !== undefined) { state.recipeQ = el.value; return render(); }
  if (el.dataset.auth) { state.auth[el.dataset.auth]=el.value; return render(); }
  if (el.dataset.tray) {
    const k = el.dataset.tray;
    state.trayDraft[k] = k==='cells' ? (el.value===''?0:+el.value) : el.value;
    if (k !== 'variety') return render();
    return;
  }
  if (el.dataset.plotv) {
    const k=el.dataset.plotv;
    state.plot[k]=el.value===''?0:Math.max(0,Math.min(500,+el.value));
    return render();
  }
  if (el.dataset.share) { state.share[el.dataset.share]=el.value.replace(/[^a-z0-9_]/gi,'').toLowerCase(); return render(); }
  if (el.id==='chatbox') { state.chatDraft=el.value; return; }
  if (el.dataset.elev !== undefined) { state.place.elev = el.value===''?null:+el.value; return render(); }
  if (el.dataset.hv) {
    state.hv[el.dataset.hv] = el.dataset.hv==='lb' ? (el.value===''?0:+el.value) : el.value;
    return render();
  }
  if (el.dataset.d) {
    const k = el.dataset.d;
    if (k==='variety') {
      if (el.value === '__custom') {
        state.draft.custom = true;
        state.draft.variety = '';
        state.draft.dtm = state.draft.dtm || (cropById(state.draft.cropId)||{}).dtm || 60;
      } else {
        const v = varietiesFor(state.draft.cropId).find(x=>x[0]===el.value);
        state.draft.custom = false;
        state.draft.variety = el.value || null;
        state.draft.dtm = v ? v[1] : null;
      }
      state.draft.ack = false;
      return render();
    }
    if (k==='customName') { state.draft.variety = el.value; return; }
    if (k==='dtm') {
      state.draft.dtm = el.value===''?null:Math.max(1,Math.min(400,+el.value));
      state.draft.ack = false;
      return render();
    }
    state.draft[k] = el.value===''?0:+el.value; return render();
  }
  if (el.dataset.nb) {
    state.newBed[el.dataset.nb] = el.dataset.nb==='len'?(+el.value||0):el.value;
    if (el.dataset.nb==='len') return render();
    return;
  }
  const f = el.dataset.f;
  if (f) { const [a,b]=f.split('.');
    state[a][b] = el.type==='number'?(el.value===''?0:+el.value):el.value; return; }
  if (el.id==='askbox') state.askText=el.value;
});
root.addEventListener('change', e => {
  if (e.target.dataset.tray === 'cropId') { state.trayDraft.cropId = e.target.value; return render(); }
  if (e.target.dataset.addplan !== undefined) {
    const cid=e.target.value;
    if (cid && !state.planItems[cid]) {
      const c=cropById(cid);
      state.planItems[cid]={on:true, qt:4, cellar:0, label:c?c.name:cid};
    }
    return render();
  }
  if (e.target.dataset.d==='variety'||e.target.dataset.hv) render();
});
root.addEventListener('keydown', e => {
  if (e.key==='Escape' && state.sb) { state.sb=null; return render(); }
  if (e.target.id==='chatbox' && e.key==='Enter') {
    const btn=root.querySelector('[data-sendchat]'); if(btn) btn.click(); return;
  }
  if (e.target.dataset.auth==='email' && e.key==='Enter' && /.+@.+\..+/.test(state.auth.email)) {
    state.auth.step='sent'; return render();
  }
  if (e.target.id==='askbox' && e.key==='Enter') ask(e.target.value);
  if (e.target.dataset.zip!==undefined && e.key==='Enter' && zipLookup(state.place.zip)) { state.step=2; render(); }
});

// ===========================================================================
// BOOT
// Load anything saved before the first paint, so a returning user never sees
// the empty state flash past.
// ===========================================================================
(async function boot() {
  try { await loadSaved(); } catch (e) {}
  if (state.signedIn && !state.ai.periodStart) state.ai.periodStart = shift(TODAY,-244).toISOString();
  if (state.signedIn && !state.planItems) state.planItems = initPlanItems();
  render();
})();

})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
