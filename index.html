<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242B31">
<meta name="description" content="A homestead almanac. Planting windows from your zone, a garden you lay out foot by foot, and a season log that remembers what worked.">
<title>SteadN</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;padding:0;background:#242B31;min-height:100%}</style>
</head>
<body>

<script>
// window.storage exists inside the Claude artifact sandbox. On the open web it
// does not, so provide the same shape backed by localStorage. The app code is
// unchanged; only the mechanism underneath differs.
(function () {
  if (window.storage && typeof window.storage.set === 'function') return;
  var mem = {};
  var ok = (function () {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; }
    catch (e) { return false; }   // private mode, or storage disabled
  })();
  var read  = function (k) { return ok ? localStorage.getItem('steadn.' + k) : (k in mem ? mem[k] : null); };
  var write = function (k, v) { if (ok) localStorage.setItem('steadn.' + k, v); else mem[k] = v; };
  var drop  = function (k) { if (ok) localStorage.removeItem('steadn.' + k); else delete mem[k]; };
  window.storage = {
    get: function (k) {
      return new Promise(function (res, rej) {
        var v = read(k);
        if (v === null) rej(new Error('not found')); else res({ key: k, value: v });
      });
    },
    set: function (k, v) {
      return new Promise(function (res, rej) {
        try { write(k, v); res({ key: k, value: v }); }
        catch (e) { rej(new Error('storage full')); }   // quota exceeded
      });
    },
    delete: function (k) { drop(k); return Promise.resolve({ key: k, deleted: true }); },
    list: function () {
      var out = [];
      if (ok) for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key.indexOf('steadn.') === 0) out.push(key.slice(7));
      } else out = Object.keys(mem);
      return Promise.resolve({ keys: out });
    }
  };
})();
</script>

<div id="root"></div>

<style>
  :root{
    --steel:#242B31; --steel-2:#2E363D; --steel-3:#39434B; --rule:#45505A;
    --paper:#EAE8E1; --muted:#8E9BA5; --tag:#D6DD2B; --tag-dim:#6E7420; --twine:#F0813C;
    --on-tag:#1B2126; --on-fam:#151A1E; --fs:1;
    --display:'Arial Narrow','Helvetica Neue',Helvetica,Arial,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --data:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }
  /* Daylight. Outdoors a dark screen loses: ambient light washes the black
     background to grey and the contrast collapses. A light page reflects that
     same light and gains contrast instead. */
  #root.daylight{
    --steel:#F4F3EE; --steel-2:#FFFFFF; --steel-3:#E6E4DC; --rule:#B9B5A9;
    --paper:#1A1D20; --muted:#4F5459; --tag:#46570B; --tag-dim:#7A8F2E;
    --twine:#9C3803; --on-tag:#FFFFFF; --on-fam:#FFFFFF;
  }
  #root.daylight .sheet-bg{background:rgba(110,108,100,.5)}
  #root.daylight .qr,#root.daylight .w-qr .qr{border-color:var(--rule)}
  #root.daylight .seg-prog{background:rgba(255,255,255,.3)}
  #root.daylight .seg-prog i{background:#fff}

  *{box-sizing:border-box}
  #root{background:var(--steel);color:var(--paper);font-family:var(--body);font-size:calc(15px * var(--fs, 1));line-height:1.5;min-height:100%;padding-bottom:40px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  .pad{padding-top:32px}

  .mast{border-bottom:1px solid var(--rule);padding:16px 18px 13px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:700;font-size:calc(29px * var(--fs, 1));letter-spacing:.14em;text-transform:uppercase;margin:0;line-height:1}
  .wordmark span{color:var(--tag)}
  .mast-meta{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.06em;color:var(--muted)}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;padding:0 18px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:calc(12.5px * var(--fs, 1));padding:13px 15px;white-space:nowrap}
  .tab:hover{color:var(--paper)}
  .tab.on{color:var(--tag);border-bottom-color:var(--tag)}

  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:calc(11.5px * var(--fs, 1));font-weight:700;color:var(--muted);display:flex;align-items:center;gap:12px;margin:28px 0 12px}
  .eyebrow::after{content:'';flex:1;height:1px;background:var(--rule)}
  .card{background:var(--steel-2);border:1px solid var(--rule)}
  .empty{color:var(--muted);font-size:calc(14px * var(--fs, 1));padding:16px 18px;line-height:1.6}
  .empty b{color:var(--tag);font-weight:400}
  .hint{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);line-height:1.7;margin-top:10px}
  .footnote{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);line-height:1.7;border-top:1px solid var(--rule);margin-top:32px;padding-top:13px}

  button{font-family:var(--body);font-size:calc(15px * var(--fs, 1));cursor:pointer}
  .btn{background:var(--tag);color:var(--on-tag);border:none;padding:12px 22px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:calc(13.5px * var(--fs, 1))}
  .btn:hover{background:#E4EB45}
  .btn:disabled{background:var(--steel-3);color:var(--muted);cursor:default}
  .btn-ghost{background:none;color:var(--paper);border:1px solid var(--rule);padding:7px 12px;font-size:calc(12.5px * var(--fs, 1));white-space:nowrap}
  .btn-ghost:hover{border-color:var(--tag);color:var(--tag)}
  input,select{background:var(--steel);border:1px solid var(--rule);color:var(--paper);font-family:var(--body);font-size:calc(15px * var(--fs, 1));padding:10px 12px;width:100%}
  input:focus,select:focus{outline:2px solid var(--tag);outline-offset:-1px;border-color:var(--tag)}
  label{display:block;font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

  .step-count{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--tag);letter-spacing:.1em;margin-bottom:8px}
  .q{font-family:var(--display);font-size:calc(27px * var(--fs, 1));font-weight:700;line-height:1.15;margin:0 0 6px}
  .q-sub{color:var(--muted);font-size:calc(14px * var(--fs, 1));margin:0 0 22px}
  .picks{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .pick{background:none;border:1px solid var(--rule);color:var(--paper);padding:14px 16px;text-align:left;min-width:150px;flex:1}
  .pick:hover{border-color:var(--muted)}
  .pick[aria-pressed="true"]{border-color:var(--tag);background:rgba(214,221,43,.09)}
  .pick-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:calc(15px * var(--fs, 1));display:block}
  .pick-note{font-size:calc(12px * var(--fs, 1));color:var(--muted)}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .field-row>div{flex:1;min-width:132px}
  .detail-block{border-left:2px solid var(--tag);padding-left:14px;margin-bottom:20px}
  .detail-block h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:calc(14px * var(--fs, 1));margin:0 0 12px}
  .frostcard{display:flex;gap:26px;flex-wrap:wrap;border:1px solid var(--rule);padding:14px 16px;margin:6px 0 22px}
  .frostcard .fl{display:block;font-family:var(--data);font-size:calc(10px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .frostcard b{font-family:var(--data);font-size:calc(17px * var(--fs, 1));color:var(--tag)}

  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--steel-3)}
  .row-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-weight:700;font-size:calc(14.5px * var(--fs, 1))}
  .row-note{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);margin-top:3px;line-height:1.5}
  .row-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .pillcount{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);white-space:nowrap}
  .pillcount.warn{color:var(--twine)}
  .ttype{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--tag-dim);color:var(--tag);padding:1px 5px;margin-right:6px;vertical-align:1px}
  .ttype.harvest{border-color:var(--twine);color:var(--twine)}
  .ttype.succession{border-color:var(--rule);color:var(--muted)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:11px;display:inline-block}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{background:none;border:1px dashed var(--rule);color:var(--muted);font-size:calc(12.5px * var(--fs, 1));padding:6px 11px}
  .chip:hover{color:var(--tag);border-color:var(--tag)}
  .chip.on{border-style:solid;border-color:var(--tag);color:var(--tag)}

  .grid-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--steel-2)}
  .grid{min-width:700px}
  .grid-head{display:flex;border-bottom:1px solid var(--rule)}
  .grid-months{display:flex;flex:1}
  .gm{flex:1;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.06em;color:var(--muted);text-align:center;padding:7px 0;border-left:1px solid var(--rule)}
  .grid-label{width:150px;flex-shrink:0;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .gl-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:calc(13px * var(--fs, 1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gl-dtm{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);flex-shrink:0}
  .grid-row{display:flex;border-bottom:1px solid rgba(69,80,90,.5);cursor:pointer;height:26px;align-items:center}
  .grid-row:last-child{border-bottom:none}
  .grid-row:hover{background:var(--steel-3)}
  .grid-cells{display:flex;flex:1;height:100%}
  .cell{flex:1;height:100%;border-right:1px solid rgba(36,43,49,.55)}
  .k-indoor{background:repeating-linear-gradient(45deg,var(--tag-dim),var(--tag-dim) 2px,transparent 2px,transparent 4px)}
  .k-sow,.k-set{background:var(--tag)}
  .k-harvest{background:var(--twine)}
  .cell.today{box-shadow:inset 1px 0 0 var(--paper),inset -1px 0 0 var(--paper)}
  .today-sw{box-shadow:inset 1px 0 0 var(--paper),inset -1px 0 0 var(--paper);background:var(--steel-3)}

  .sheet-bg{position:fixed;inset:0;background:rgba(20,25,29,.72);z-index:40}
  .sheet{position:fixed;z-index:41;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--steel-2);border:1px solid var(--rule)}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--steel-2)}
  .sheet-head h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:calc(20px * var(--fs, 1));margin:0}
  .sheet-sub{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);margin-top:3px}
  .x{background:none;border:1px solid var(--rule);color:var(--muted);padding:6px 11px;font-size:calc(12px * var(--fs, 1))}
  .sheet-body{padding:14px 18px 22px}
  .sheet-eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:calc(11px * var(--fs, 1));color:var(--tag);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:calc(13.5px * var(--fs, 1));border-bottom:1px solid rgba(69,80,90,.4)}
  .kv span{color:var(--muted)}
  .kv b{font-family:var(--data);font-size:calc(12.5px * var(--fs, 1));text-align:right;white-space:nowrap}
  .feedline{font-size:calc(13.5px * var(--fs, 1));padding:7px 0;border-bottom:1px solid rgba(69,80,90,.4);line-height:1.5}
  .fd{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.06em;text-transform:uppercase;color:var(--tag);display:block;margin-bottom:2px}
  .cropnote{border-left:2px solid var(--tag);padding:2px 0 2px 13px;margin-top:18px;font-size:calc(14px * var(--fs, 1));color:var(--paper);line-height:1.6}
  .sheet-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
  .logged{font-family:var(--data);font-size:calc(11.5px * var(--fs, 1));color:var(--tag)}

  .ask-row{display:flex;gap:10px;padding:16px 16px 0}
  .ask-row input{flex:1}
  .suggest{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px 16px}
  .answer{border-left:2px solid var(--tag);margin:0 16px 18px;padding:2px 0 2px 15px;white-space:pre-wrap;line-height:1.62}
  .qline{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:calc(13.5px * var(--fs, 1));font-weight:700;color:var(--muted);margin-bottom:9px}
  .thinking{font-family:var(--data);font-size:calc(12px * var(--fs, 1));color:var(--muted)}
  .plan-body strong,.answer strong{color:var(--tag)}

  @media(max-width:540px){
    .wordmark{font-size:calc(24px * var(--fs, 1))}.q{font-size:calc(23px * var(--fs, 1))}.pick{min-width:100%}
    .grid-label{width:112px}
    .row{flex-wrap:wrap}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- zip reveal ---------- */
  .zip-wait{font-family:var(--data);font-size:calc(11.5px * var(--fs, 1));color:var(--muted);margin-top:16px}
  .reveal{animation:rv .3s ease-out}
  @keyframes rv{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ---------- garden totals ---------- */
  .totals{display:flex;gap:0;border:1px solid var(--rule);background:var(--steel-2);margin-bottom:20px;flex-wrap:wrap}
  .totals>div{flex:1;min-width:88px;padding:12px 14px;border-right:1px solid var(--rule)}
  .totals>div:last-child{border-right:none}
  .tl{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .totals b{font-family:var(--data);font-size:calc(21px * var(--fs, 1));color:var(--tag);font-weight:400}
  .totals b i{font-size:calc(11px * var(--fs, 1));color:var(--muted);font-style:normal;margin-left:2px}

  /* ---------- the bed builder ---------- */
  .bed{margin-bottom:22px}
  .bed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:7px}
  .bed-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:calc(15px * var(--fs, 1))}
  .bed-sub{display:block;font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);margin-top:2px}
  .bed-bar{display:flex;height:60px;border:1px solid var(--rule);background:var(--steel-2);overflow:hidden}
  .seg{position:relative;border:none;border-right:1px solid rgba(20,25,29,.5);padding:6px 5px;
    display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;
    min-width:0;color:var(--on-fam);text-align:left}
  .seg:last-child{border-right:none}
  .seg:hover{filter:brightness(1.14)}
  .seg-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-weight:700;
    font-size:calc(11.5px * var(--fs, 1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .seg-meta{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));opacity:.72;white-space:nowrap}
  .seg-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(21,26,30,.28)}
  .seg-prog i{display:block;height:100%;background:var(--on-fam)}
  .seg-free{background:transparent!important;color:var(--muted);
    border:1px dashed var(--rule);align-items:center;justify-content:center}
  .seg-free:hover{color:var(--tag);border-color:var(--tag);filter:none}
  .seg-free .seg-name{font-family:var(--data);letter-spacing:.05em;font-weight:400;font-size:calc(11px * var(--fs, 1))}
  .ruler{display:flex;height:7px;margin-top:2px}
  .rtick{flex:1;border-right:1px solid var(--rule);height:3px}
  .rtick.five{height:7px;border-right-color:var(--muted)}
  .bed-add{margin:4px 0 8px}

  /* ---------- drafter ---------- */
  .drafter{border:1px solid var(--tag);background:rgba(214,221,43,.05);padding:15px 16px;margin-bottom:22px}
  .drafter-head{font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;font-weight:700;
    font-size:calc(13px * var(--fs, 1));margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .drafter-head span{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--tag);letter-spacing:.05em;font-weight:400;text-transform:none}
  .drafter-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .stepper{display:flex;border:1px solid var(--rule);align-items:stretch}
  .stepper button{background:var(--steel);border:none;color:var(--paper);width:34px;font-size:calc(17px * var(--fs, 1));line-height:1;flex-shrink:0}
  .stepper button:hover{background:var(--tag);color:var(--on-tag)}
  .stepper input{border:none;text-align:center;font-family:var(--data);-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper b{font-family:var(--data);padding:9px 14px;min-width:64px;text-align:center;background:var(--steel)}
  .calc{display:flex;gap:0;border:1px solid var(--rule);flex-wrap:wrap;margin-bottom:12px;background:var(--steel)}
  .calc>div{flex:1;min-width:76px;padding:9px 11px;border-right:1px solid var(--rule)}
  .calc>div:last-child{border-right:none}
  .cl{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .calc b{font-family:var(--data);font-size:calc(17px * var(--fs, 1));color:var(--tag);font-weight:400}
  .windowline{font-family:var(--data);font-size:calc(11px * var(--fs, 1));line-height:1.6;padding:8px 11px;border-left:2px solid}
  .windowline.ok{border-color:var(--tag);color:var(--tag);background:rgba(214,221,43,.07)}
  .windowline.no{border-color:var(--twine);color:var(--twine);background:rgba(226,102,28,.07)}

  /* ---------- cycle tracker ---------- */
  .track{height:9px;background:var(--steel);border:1px solid var(--rule);margin:4px 0 8px}
  .track i{display:block;height:100%;background:var(--tag)}
  .stages{display:flex;gap:3px;margin-bottom:14px}
  .stage{flex:1;border-top:2px solid var(--rule);padding-top:5px}
  .stage.done{border-top-color:var(--tag-dim)}
  .stage.on{border-top-color:var(--tag)}
  .sn{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1.3;display:block}
  .stage.on .sn{color:var(--tag)}
  .stagecard{border:1px solid var(--rule);background:var(--steel);padding:13px 14px;margin-bottom:14px}
  .sc-now{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:calc(17px * var(--fs, 1));color:var(--tag);margin-bottom:9px}
  .sc-look,.sc-job{font-size:calc(13.5px * var(--fs, 1));line-height:1.55;margin-bottom:8px}
  .sc-job{margin-bottom:0}
  .sc-look span,.sc-job span{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .notplanted{font-size:calc(13.5px * var(--fs, 1));color:var(--muted);line-height:1.6;margin-bottom:13px}
  .resize{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:4px}
  .resize>span{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .feedline.past{opacity:.45}
  .feedline.due .fd{color:var(--twine)}
  .btn-ghost.danger:hover{border-color:var(--twine);color:var(--twine)}
  .gl-name.mine{color:var(--tag)}
  .mine-sw{background:var(--tag);height:2px;align-self:center}

  /* ---------- combobox / master search ---------- */
  .combo{position:relative}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:30;
    background:var(--steel);border:1px solid var(--tag);max-height:274px;overflow-y:auto;
    box-shadow:0 12px 28px rgba(15,19,22,.6)}
  .combo-item{display:block;width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--rule);padding:8px 11px;color:var(--paper)}
  .combo-item:last-child{border-bottom:none}
  .combo-item:hover{background:var(--steel-3)}
  .ci-k{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;
    color:var(--tag);border:1px solid var(--tag-dim);padding:0 4px;margin-right:7px;vertical-align:1px}
  .ci-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:calc(13.5px * var(--fs, 1))}
  .ci-sub{display:block;font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);margin-top:2px;line-height:1.45}
  .combo-none{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);padding:11px}

  .bigsearch{font-family:var(--display);font-size:calc(19px * var(--fs, 1));letter-spacing:.03em;padding:14px 15px;margin-bottom:12px}
  .bigsearch::placeholder{color:var(--muted);font-size:calc(15px * var(--fs, 1));letter-spacing:0}
  .chip i{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));font-style:normal;opacity:.6;margin-left:3px}

  /* ---------- breed autofill card ---------- */
  .breedcard{border:1px solid var(--tag-dim);background:rgba(214,221,43,.05);margin:-4px 0 18px;animation:rv .25s ease-out}
  .bc-row{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
  .bc-row>div{flex:1;min-width:82px;padding:9px 11px;border-right:1px solid var(--rule)}
  .bc-row>div:last-child{border-right:none}
  .bc-row b{font-family:var(--data);font-size:calc(15px * var(--fs, 1));color:var(--tag);font-weight:400}
  .bc-note{padding:9px 11px;font-size:calc(13px * var(--fs, 1));color:var(--paper);line-height:1.5}
  .varnote{font-size:calc(13px * var(--fs, 1));color:var(--muted);line-height:1.5;margin-bottom:10px;padding-left:11px;border-left:2px solid var(--tag-dim)}

  /* ---------- put up ---------- */
  .subnav{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 4px}
  .subtab{background:none;border:1px solid var(--rule);color:var(--muted);
    font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;
    font-size:calc(11.5px * var(--fs, 1));padding:9px 13px}
  .subtab:hover{color:var(--paper);border-color:var(--muted)}
  .subtab.on{color:var(--on-tag);background:var(--tag);border-color:var(--tag)}

  .peoplepick{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:16px}
  .peoplepick>span{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .pp-note{opacity:.7}
  .stepper.small button{width:28px;font-size:calc(15px * var(--fs, 1))}
  .stepper.small b{padding:6px 11px;min-width:40px;font-size:calc(13px * var(--fs, 1))}

  .minitrack{height:3px;background:var(--steel-3);margin-top:7px;max-width:340px}
  .minitrack i{display:block;height:100%;background:var(--tag)}
  .pillcount.good{color:var(--tag)}

  .elevbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;border:1px solid var(--rule);
    background:var(--steel-2);margin-bottom:14px}
  .elevbar>div{flex:1;min-width:86px;padding:9px 12px;border-right:1px solid var(--rule)}
  .elevbar>div b{font-family:var(--data);font-size:calc(15px * var(--fs, 1));color:var(--tag);font-weight:400}
  .elevbar>button{margin:0 12px}

  .mtag{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;
    border:1px solid;padding:1px 5px;margin-right:7px;vertical-align:1px}
  .mtag.bath{border-color:var(--tag-dim);color:var(--tag)}
  .mtag.pressure{border-color:var(--twine);color:var(--twine)}

  /* ---------- recipe sheet ---------- */
  .safety{border:1px solid;padding:11px 13px;margin-bottom:16px;font-size:calc(13px * var(--fs, 1));line-height:1.55}
  .safety b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;
    font-size:calc(12.5px * var(--fs, 1));margin-bottom:4px}
  .safety.hard{border-color:var(--twine);background:rgba(226,102,28,.12)}
  .safety.hard b{color:var(--twine)}
  .safety.soft{border-color:var(--tag-dim);background:rgba(214,221,43,.06)}
  .safety.soft b{color:var(--tag)}

  .procbox{border:1px solid var(--tag);margin-bottom:18px}
  .pb-head{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:calc(11px * var(--fs, 1));
    color:var(--on-tag);background:var(--tag);padding:5px 12px;font-weight:700}
  .pb-row{display:flex;flex-wrap:wrap;background:var(--steel)}
  .pb-row>div{flex:1;min-width:80px;padding:11px 12px;border-right:1px solid var(--rule)}
  .pb-row>div:last-child{border-right:none}
  .pb-row b{font-family:var(--data);font-size:calc(25px * var(--fs, 1));color:var(--tag);font-weight:400;line-height:1}
  .pb-row b i{font-size:calc(10px * var(--fs, 1));color:var(--muted);font-style:normal;margin-left:3px}

  .ingline{font-size:calc(13.5px * var(--fs, 1));padding:6px 0 6px 13px;border-bottom:1px solid rgba(69,80,90,.4);
    position:relative;line-height:1.5}
  .ingline::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;background:var(--tag)}
  .stepline{font-size:calc(13.5px * var(--fs, 1));padding:9px 0 9px 30px;border-bottom:1px solid rgba(69,80,90,.4);
    position:relative;line-height:1.6}
  .sx{position:absolute;left:0;top:9px;font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--tag);
    border:1px solid var(--tag-dim);width:19px;height:19px;display:flex;align-items:center;justify-content:center}
  .cropnote.warn{border-left-color:var(--twine)}
  .pantryadd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .pantryadd>span{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .disclaimer{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);line-height:1.7;
    border-top:1px solid var(--rule);padding-top:11px}

  /* ---------- to do dashboard ---------- */
  .todo{display:flex;align-items:flex-start;gap:12px;padding:11px 15px;border-bottom:1px solid var(--rule)}
  .todo:last-child{border-bottom:none}
  .todo.over{background:rgba(226,102,28,.07)}
  .todo.now{background:rgba(214,221,43,.05)}
  .tick{flex:0 0 20px;width:20px;height:20px;border:1px solid var(--rule);background:var(--steel);
    margin-top:2px;padding:0}
  .tick:hover{border-color:var(--tag);background:rgba(214,221,43,.18)}
  .td-body{flex:1;min-width:0;cursor:pointer}
  .td-title{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:calc(14px * var(--fs, 1))}
  .td-detail{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);margin-top:3px;line-height:1.5}
  .td-when{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);flex-shrink:0;margin-top:2px}
  .td-when.warn{color:var(--twine)}
  .ttype.chore{border-color:var(--rule);color:var(--muted)}
  .ttype.window{border-color:var(--twine);color:var(--twine)}
  .eyebrow em{font-family:var(--data);font-style:normal;font-size:calc(11px * var(--fs, 1));color:var(--tag)}
  .totals b.bad{color:var(--twine)}
  .linkbtn{background:none;border:none;color:var(--tag);font-family:var(--data);font-size:calc(11px * var(--fs, 1));
    text-decoration:underline;padding:0}

  /* ---------- season log ---------- */
  .yc{flex:none;width:118px;border-left:1px solid var(--rule);padding:7px 9px;text-align:left}
  .yc b{font-family:var(--data);font-size:calc(17px * var(--fs, 1));color:var(--paper);font-weight:400;display:block;line-height:1.1}
  .yc span{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);display:block;margin-top:2px}
  .yc.best{background:rgba(214,221,43,.1)}
  .yc.best b{color:var(--tag)}
  .yc.empty-yc{color:var(--rule);font-family:var(--data);padding-top:14px}
  .stars{font-size:calc(9.5px * var(--fs, 1));color:var(--tag);font-style:normal;letter-spacing:1px;display:block;margin-top:2px}
  .rater{display:flex;gap:1px}
  .star{background:none;border:none;color:var(--steel-3);font-size:calc(16px * var(--fs, 1));padding:0 1px;line-height:1}
  .star.on{color:var(--tag)}
  .star:hover{color:var(--tag)}

  /* ---------- problems ---------- */
  .sevdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
  .sevdot.routine{background:var(--muted)}
  .sevdot.watch{background:var(--tag)}
  .sevdot.urgent{background:var(--twine)}
  .problink{display:block;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid rgba(69,80,90,.4);cursor:pointer}
  .problink:hover .pl-n{color:var(--tag)}
  .pl-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:calc(13px * var(--fs, 1))}
  .pl-s{display:block;font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);margin-top:2px;line-height:1.45}
  .probtext{font-size:calc(14px * var(--fs, 1));line-height:1.6;margin-bottom:4px}

  /* ---------- provenance and sources ---------- */
  .provenance{border:1px solid var(--rule);background:var(--steel);padding:12px 13px;margin-bottom:14px}
  .pv-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-weight:700;
    font-size:calc(12.5px * var(--fs, 1));color:var(--tag);line-height:1.35}
  .pv-note{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);line-height:1.6;margin:6px 0 10px}
  .pv-acts{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .pv-acts a{text-decoration:none;display:inline-block}
  .pv-off{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);line-height:1.5;flex:1;min-width:150px}
  .neveradapt{border-left:2px solid var(--twine);background:rgba(226,102,28,.07);
    padding:10px 13px;margin-bottom:14px;font-size:calc(13px * var(--fs, 1));line-height:1.55}
  .auth{padding:12px 15px;border-bottom:1px solid var(--rule)}
  .auth:last-child{border-bottom:none}
  .au-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:calc(14px * var(--fs, 1))}
  .au-d{font-size:calc(13px * var(--fs, 1));color:var(--paper);line-height:1.55;margin:5px 0 7px}
  .au-f{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
  .au-f a{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--tag)}
  .au-f span{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);flex:1;min-width:160px;line-height:1.5}

  /* ---------- auth ---------- */
  .authwrap{max-width:400px;margin:0 auto;padding:52px 20px}
  .wordmark.big{font-size:calc(40px * var(--fs, 1));margin-bottom:26px;text-align:center}
  .authcard{border:1px solid var(--rule);background:var(--steel-2);padding:24px 22px}
  .auth-h{font-family:var(--display);text-transform:uppercase;letter-spacing:.15em;font-weight:700;font-size:calc(19px * var(--fs, 1));margin-bottom:8px}
  .auth-p{font-size:calc(13.5px * var(--fs, 1));color:var(--muted);line-height:1.6;margin:0 0 18px}
  .auth-p b{color:var(--paper)}
  .btn.wide{width:100%;margin-top:14px}
  .auth-alt{text-align:center;margin-top:16px}
  .auth-foot{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);line-height:1.65;
    border-top:1px solid var(--rule);margin-top:20px;padding-top:12px}

  /* ---------- share ---------- */
  .sharetop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border:1px solid var(--rule);background:var(--steel-2);padding:15px 16px;margin-bottom:18px}
  .sharetop.on{border-color:var(--tag);background:rgba(214,221,43,.05)}
  .st-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:calc(15px * var(--fs, 1))}
  .st-d{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);margin-top:4px;line-height:1.55}
  .st-d b{color:var(--tag)}
  .scopes .scope{padding:13px 16px;border-bottom:1px solid var(--rule)}
  .scopes .scope:last-child{border-bottom:none}
  .sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .sc-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:calc(14px * var(--fs, 1))}
  .sc-cur{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--tag);letter-spacing:.05em}
  .sc-opts{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--rule)}
  .sc-opt{flex:1;min-width:88px;background:var(--steel);border:none;border-right:1px solid var(--rule);
    color:var(--muted);font-family:var(--data);font-size:calc(11px * var(--fs, 1));padding:8px 6px;letter-spacing:.03em}
  .sc-opt:last-child{border-right:none}
  .sc-opt:hover{color:var(--paper)}
  .sc-opt.on{background:var(--tag);color:var(--on-tag)}
  .sc-why{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);line-height:1.6;margin-top:7px}
  .preview{padding:4px 16px 12px}
  .pv-line{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(69,80,90,.4)}
  .pv-line:last-child{border-bottom:none}
  .pv-line.off{opacity:.42}
  .pv-k{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
    font-size:calc(12px * var(--fs, 1));width:96px;flex-shrink:0}
  .pv-v{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);line-height:1.55}

  /* ---------- neighbors ---------- */
  .handle{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);letter-spacing:0;font-weight:400;text-transform:none}
  .sheet.wide{max-width:620px}
  .nbrow{padding:7px 0;border-bottom:1px solid rgba(69,80,90,.4)}
  .nb-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:calc(13px * var(--fs, 1))}
  .nb-d{display:block;font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);margin-top:2px}
  .chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
  .gchip{font-family:var(--data);font-size:calc(11px * var(--fs, 1));border:1px solid var(--rule);padding:4px 9px;color:var(--paper)}
  .privateblk{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);border:1px dashed var(--rule);
    padding:11px 13px;margin:2px 0 4px}
  .privatenote{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);margin-top:5px;font-style:normal}
  .thread{border-left:2px solid var(--rule);padding-left:14px;margin-top:4px}
  .msg{margin-bottom:13px}
  .msg-who{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);letter-spacing:.05em;margin-bottom:3px}
  .msg.mine .msg-who{color:var(--tag)}
  .msg-t{font-size:calc(13.5px * var(--fs, 1));line-height:1.55}
  .kv b.stars{color:var(--tag);letter-spacing:1px}

  /* ---------- ai quota, thermometer ---------- */
  .aiquiet{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .aiquiet span{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);letter-spacing:.03em;line-height:1.5}
  .th{display:block}
  .th.small{width:14px;height:34px;flex-shrink:0}
  .th-lab{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));fill:var(--muted)}

  .aimeter{display:flex;gap:16px;align-items:flex-start;
    border:1px solid var(--rule);background:var(--steel-2);padding:15px 16px;margin-bottom:14px}
  .aimeter.low,.aimeter.out{border-color:var(--twine);background:rgba(226,102,28,.07)}
  .am-glass{flex-shrink:0;width:74px}
  .am-glass .th{width:74px;height:150px}
  .am-text{flex:1;min-width:0;padding-top:4px}
  .am-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .am-h{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:calc(16px * var(--fs, 1))}
  .aimeter.low .am-h,.aimeter.out .am-h{color:var(--twine)}
  .am-c{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted)}
  .am-sub{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--muted);line-height:1.65}
  .am-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .aiup{border:1px solid var(--tag);background:rgba(214,221,43,.05);padding:15px 16px;margin-bottom:14px}
  .aiup-h{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:calc(15px * var(--fs, 1));margin-bottom:6px}
  .aiup-d{font-size:calc(13px * var(--fs, 1));color:var(--muted);line-height:1.6;margin-bottom:13px}
  @media(max-width:460px){
    .aimeter{gap:12px}
    .am-glass,.am-glass .th{width:58px}
    .am-glass .th{height:122px}
  }

  /* ---------- plans ---------- */
  .plancards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .plancard{flex:1;min-width:210px;border:1px solid var(--rule);background:var(--steel-2);padding:17px 16px;position:relative}
  .plancard.feature{border-color:var(--tag)}
  .plancard.on{background:rgba(214,221,43,.06)}
  .pc-tag{position:absolute;top:-1px;right:-1px;background:var(--tag);color:var(--on-tag);
    font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;padding:3px 8px}
  .pc-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:calc(16px * var(--fs, 1))}
  .pc-p{font-family:var(--data);font-size:calc(29px * var(--fs, 1));color:var(--tag);margin:7px 0 9px;line-height:1}
  .pc-p i{font-size:calc(11px * var(--fs, 1));color:var(--muted);font-style:normal;margin-left:4px}
  .pc-d{font-size:calc(12.5px * var(--fs, 1));color:var(--muted);line-height:1.55;margin-bottom:15px;min-height:58px}
  .ptable{padding:2px 0}
  .pt-head,.pt-row{display:flex;align-items:center;border-bottom:1px solid rgba(69,80,90,.4)}
  .pt-head{border-bottom:1px solid var(--rule)}
  .pt-row:last-child{border-bottom:none}
  .pt-head>div,.pt-row>div{flex:1;padding:9px 8px;text-align:center;font-family:var(--data);font-size:calc(11px * var(--fs, 1))}
  .pt-head>div{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:calc(11px * var(--fs, 1));color:var(--muted)}
  .pt-head>div:first-child,.pt-l{flex:2.4!important;text-align:left!important;
    font-family:var(--body)!important;font-size:calc(13px * var(--fs, 1))!important;color:var(--paper)}
  .yes{color:var(--tag);font-size:calc(14px * var(--fs, 1))}
  .no{color:var(--rule)}
  .val{color:var(--paper)}
  .whymeter{padding:14px 16px}
  .whymeter p{font-size:calc(13.5px * var(--fs, 1));line-height:1.65;margin:0 0 11px;color:var(--paper)}
  .whymeter p:last-child{margin-bottom:0}

  /* ---------- planting timing check ---------- */
  .chk{border:1px solid var(--rule);background:var(--steel);padding:13px 14px;margin-bottom:12px}
  .chk.ok{border-left:2px solid var(--tag)}
  .chk.warn{border-left:2px solid var(--twine);background:rgba(226,102,28,.06)}
  .chk-h{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:calc(14.5px * var(--fs, 1));margin-bottom:6px}
  .chk.ok .chk-h{color:var(--tag)}
  .chk.warn .chk-h{color:var(--twine)}
  .chk-b{font-size:calc(13px * var(--fs, 1));line-height:1.6;color:var(--paper)}
  .chk-math{display:flex;flex-wrap:wrap;border:1px solid var(--rule);margin:12px 0 0;background:var(--steel-2)}
  .chk-math>div{flex:1;min-width:84px;padding:8px 10px;border-right:1px solid var(--rule)}
  .chk-math>div:last-child{border-right:none}
  .chk-math b{font-family:var(--data);font-size:calc(13px * var(--fs, 1));color:var(--paper);font-weight:400}
  .chk-fix{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);font-size:calc(12.5px * var(--fs, 1));line-height:1.6;color:var(--muted)}
  .chk-fix b{color:var(--tag);font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:calc(13px * var(--fs, 1))}
  .cf-l{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .chk-fix .btn-ghost{margin-top:9px}
  .altrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .altrow .gchip{cursor:pointer}
  .altrow .gchip:hover{border-color:var(--tag);color:var(--tag)}
  .altrow .gchip.inwin{border-color:var(--tag-dim)}
  .altrow .gchip.inwin::before{content:'';display:inline-block;width:5px;height:5px;
    background:var(--tag);margin-right:5px;vertical-align:1px}
  .altrow .gchip i{font-style:normal;color:var(--muted);font-size:calc(9.5px * var(--fs, 1));margin-left:3px}
  .ackline{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding-top:12px;
    border-top:1px solid var(--rule);cursor:pointer;text-transform:none;letter-spacing:0;
    font-family:var(--body);font-size:calc(13px * var(--fs, 1));color:var(--paper)}
  .ackline .tick{flex:0 0 19px;width:19px;height:19px;margin:0}
  .ackline .tick.on{background:var(--twine);border-color:var(--twine);position:relative}
  .ackline .tick.on::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--on-tag);font-size:calc(13px * var(--fs, 1));font-weight:700}
  .ackhint{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--twine);line-height:1.5}

  .dtmnote{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);line-height:1.6;margin-top:6px}
  .dtmnote .linkbtn{font-size:calc(9.5px * var(--fs, 1))}

  /* ---------- checklist ---------- */
  .clrow{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .clrow:last-child{border-bottom:none}
  .clrow.off{opacity:.45}
  .clrow .tick{flex:0 0 20px;margin:0}
  .clrow .tick.on{background:var(--tag);border-color:var(--tag);position:relative}
  .clrow .tick.on::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--on-tag);font-size:calc(13px * var(--fs, 1));font-weight:700}
  .cl-body{flex:1;min-width:130px}
  .cl-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-weight:700;font-size:calc(14.5px * var(--fs, 1))}
  .cl-d{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);margin-top:3px;line-height:1.5}
  .cl-nums{display:flex;gap:10px;flex-shrink:0}
  .cl-nums label{font-size:calc(9.5px * var(--fs, 1));margin-bottom:3px}

  /* ---------- plot ---------- */
  .stylerow{display:flex;gap:9px;flex-wrap:wrap}
  .styleopt{flex:1;min-width:170px;background:var(--steel);border:1px solid var(--rule);
    color:var(--paper);text-align:left;padding:11px 12px}
  .styleopt:hover{border-color:var(--muted)}
  .styleopt.on{border-color:var(--tag);background:rgba(214,221,43,.08)}
  .so-n{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
    font-weight:700;font-size:calc(13px * var(--fs, 1))}
  .so-d{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);margin-top:4px;line-height:1.55}
  .plot{display:block;width:100%;height:auto}
  .pl-lab{font-family:var(--display);font-size:calc(9.5px * var(--fs, 1));fill:var(--on-fam);letter-spacing:.05em;
    text-transform:uppercase;font-weight:700}
  .pl-dim{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));fill:var(--muted)}
  .cutline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;
    border-bottom:1px solid rgba(69,80,90,.4)}
  .cutline:last-of-type{border-bottom:none}
  .cu-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:calc(13px * var(--fs, 1));flex-shrink:0}
  .cu-d{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);flex:1;min-width:150px;line-height:1.5}

  /* ---------- master bar ---------- */
  .masterbar{border:1px solid var(--tag);background:rgba(214,221,43,.045);margin:22px 0 14px}
  .mb-main{display:flex;align-items:stretch;flex-wrap:wrap}
  .mb-dims,.mb-need{flex:1;min-width:158px;padding:12px 14px;border-right:1px solid var(--rule);
    background:none;border-top:none;border-bottom:none;border-left:none;text-align:left;display:block}
  .mb-dims:hover{background:rgba(214,221,43,.08)}
  .mb-l{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .mb-v{display:block;font-family:var(--data);font-size:calc(20px * var(--fs, 1));color:var(--tag);line-height:1.1}
  .mb-v.short{color:var(--twine)}
  .mb-s{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);margin-top:4px;line-height:1.45}
  .mb-go{margin:0;border-radius:0;flex-shrink:0;align-self:stretch;padding:12px 20px}
  .mb-panel{border-top:1px solid var(--rule);padding:14px 14px 10px;background:var(--steel-2)}
  .mb-close{text-align:right;margin-top:4px}
  .buyqty{font-family:var(--data);font-size:calc(16px * var(--fs, 1));color:var(--tag);white-space:nowrap}
  .buyqty i{font-size:calc(9.5px * var(--fs, 1));color:var(--muted);font-style:normal;margin-left:3px}
  .pinnote{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:var(--tag);border-left:2px solid var(--tag);
    padding:8px 0 8px 12px;margin:14px 0 0}
  .cutline .btn-ghost{flex-shrink:0}

  /* ---------- vendors ---------- */
  .vendorpick{border:1px solid var(--rule);background:var(--steel-2);padding:12px 13px;margin-bottom:12px}
  .vp-l{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px}
  .vp-row{display:flex;flex-wrap:wrap;gap:8px}
  .vopt{flex:1;min-width:196px;background:var(--steel);border:1px solid var(--rule);
    color:var(--paper);text-align:left;padding:10px 11px;position:relative}
  .vopt:hover{border-color:var(--muted)}
  .vopt.on{border-color:var(--tag);background:rgba(214,221,43,.08)}
  .vo-n{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
    font-weight:700;font-size:calc(12.5px * var(--fs, 1));line-height:1.3}
  .vo-d{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);margin-top:4px;line-height:1.55}
  .vo-fit{display:inline-block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.09em;
    text-transform:uppercase;color:var(--tag);border:1px solid var(--tag-dim);padding:1px 5px;margin-top:6px}
  .vp-off{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--tag);line-height:1.6;
    border-left:2px solid var(--tag);padding-left:11px;margin-top:11px}
  .buybtn{text-decoration:none;display:inline-block;flex-shrink:0}
  .listacts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .la-n{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);line-height:1.5}
  .plainlist{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--paper);line-height:1.75;
    background:var(--steel);border:1px solid var(--rule);padding:14px;margin:11px 0 0;
    white-space:pre-wrap;overflow-x:auto}
  .affnote{border-left:2px solid var(--muted);padding:2px 0 2px 13px;margin-top:16px;
    font-size:calc(12.5px * var(--fs, 1));line-height:1.65;color:var(--muted)}
  .affnote b{display:inline;color:var(--paper)}
  .affnote b:first-child{display:block;font-family:var(--display);text-transform:uppercase;
    letter-spacing:.11em;font-size:calc(11.5px * var(--fs, 1));color:var(--muted);margin-bottom:5px}

  /* ---------- tags ---------- */
  .tagsheet{display:flex;flex-wrap:wrap;gap:10px}
  .tag{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);
    background:var(--steel-2);padding:10px;flex:1;min-width:262px;max-width:330px}
  .tag-qr{flex-shrink:0;line-height:0}
  .qr{display:block;border:2px solid #fff}
  .tag-txt{min-width:0;flex:1}
  .tag-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
    font-size:calc(14px * var(--fs, 1));line-height:1.2}
  .tag-sub{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--tag);margin-top:3px;line-height:1.45}
  .tag-meta{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);line-height:1.5}
  .tag-url{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--rule);margin-top:5px;
    word-break:break-all;line-height:1.4}
  .printnote{border-left:2px solid var(--tag);padding:2px 0 2px 13px;margin-top:18px;
    font-size:calc(12.5px * var(--fs, 1));line-height:1.65;color:var(--muted)}
  .printnote b{display:block;font-family:var(--display);text-transform:uppercase;
    letter-spacing:.11em;font-size:calc(11.5px * var(--fs, 1));color:var(--paper);margin-bottom:5px}

  .scanbox{margin-bottom:16px}
  .scan-frame{position:relative;border:1px dashed var(--rule);background:var(--steel-2);
    min-height:150px;display:flex;align-items:center;justify-content:center;padding:24px}
  .scan-note{font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:var(--muted);text-align:center;line-height:1.7}
  .scan-corners{position:absolute;inset:14px;pointer-events:none;
    background:
      linear-gradient(var(--tag),var(--tag)) left top/22px 2px no-repeat,
      linear-gradient(var(--tag),var(--tag)) left top/2px 22px no-repeat,
      linear-gradient(var(--tag),var(--tag)) right top/22px 2px no-repeat,
      linear-gradient(var(--tag),var(--tag)) right top/2px 22px no-repeat,
      linear-gradient(var(--tag),var(--tag)) left bottom/22px 2px no-repeat,
      linear-gradient(var(--tag),var(--tag)) left bottom/2px 22px no-repeat,
      linear-gradient(var(--tag),var(--tag)) right bottom/22px 2px no-repeat,
      linear-gradient(var(--tag),var(--tag)) right bottom/2px 22px no-repeat}

  .modeswitch{display:flex;gap:0;border:1px solid var(--rule);margin:16px 0 14px}
  .mode{flex:1;background:var(--steel);border:none;border-right:1px solid var(--rule);
    color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;
    font-weight:700;font-size:calc(12px * var(--fs, 1));padding:10px 8px}
  .mode:last-child{border-right:none}
  .mode.on{background:var(--tag);color:var(--on-tag)}
  .qty{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .qty .cl{margin:0}
  .qty .stepper b{min-width:84px;font-size:calc(17px * var(--fs, 1))}
  .controw{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .cont{flex:1;min-width:98px;background:var(--steel);border:1px solid var(--rule);
    color:var(--paper);padding:9px 8px;text-align:left}
  .cont:hover{border-color:var(--tag)}
  .co-n{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
    font-weight:700;font-size:calc(11.5px * var(--fs, 1))}
  .co-l{display:block;font-family:var(--data);font-size:calc(13px * var(--fs, 1));color:var(--tag);margin-top:2px}

  /* ---------- printable planting plan ---------- */
  .sheetpage{background:#fff;color:#111;padding:26px 28px;margin:16px auto 0;max-width:820px;
    font-family:var(--body)}
  .pp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:16px;flex-wrap:wrap}
  .pp-title{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;
    font-weight:700;font-size:calc(21px * var(--fs, 1))}
  .pp-sub{font-family:var(--data);font-size:calc(10.5px * var(--fs, 1));color:#555;margin-top:3px}
  .pp-meta{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:#555;text-align:right;line-height:1.6}
  .pp-bed{margin-bottom:20px;break-inside:avoid}
  .pp-bedhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:6px;flex-wrap:wrap}
  .pp-bn{font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:calc(15px * var(--fs, 1))}
  .pp-bd{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:#555}
  .pp-tbl{width:100%;border-collapse:collapse}
  .pp-tbl th{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.09em;text-transform:uppercase;
    color:#555;text-align:left;padding:4px 6px;border-bottom:1px solid #bbb;vertical-align:bottom;font-weight:400}
  .pp-tbl th i{font-style:normal;opacity:.65}
  .pp-tbl td{padding:6px;border-bottom:1px solid #e2e2e2;font-size:calc(12.5px * var(--fs, 1));vertical-align:top}
  .pp-tbl .num{text-align:center;white-space:nowrap}
  .pp-tbl th.num{text-align:center}
  .pp-tbl td b{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:calc(13px * var(--fs, 1))}
  .pp-tbl .num b{font-family:var(--data);letter-spacing:0;font-size:calc(14px * var(--fs, 1));text-transform:none}
  .pp-c{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:#666;font-style:normal;margin-top:2px}
  .pp-tbl .bad b{color:#000;background:#ffe08a;padding:0 3px}
  .pp-feed{font-size:calc(11px * var(--fs, 1));color:#333;max-width:190px}
  .w-run{white-space:nowrap;font-family:var(--data);font-size:calc(11px * var(--fs, 1));color:#444;width:74px}
  .w-qr{width:56px}
  .w-qr .qr{border:none}
  .pp-foot{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:#666;line-height:1.7;
    border-top:1px solid #111;padding-top:9px;margin-top:6px}

  @media print {
    @page { margin: 12mm; }
    body, #root { background:#fff !important; }
    .mast, .tabs, .noprint, .wrap > .eyebrow, .footnote { display:none !important; }
    .sheetpage { margin:0; padding:0; max-width:none; box-shadow:none; }
    .pp-bed { page-break-inside:avoid; }
  }

  /* ---------- season toggle and timeline ---------- */
  .seasonbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .sb-l{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .sbtn{background:var(--steel);border:1px solid var(--rule);color:var(--muted);
    font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
    font-size:calc(11.5px * var(--fs, 1));padding:8px 12px}
  .sbtn:hover{color:var(--paper)}
  .sbtn.on{background:var(--tag);color:var(--on-tag);border-color:var(--tag)}
  .sbtn i{font-family:var(--data);font-style:normal;font-size:calc(9.5px * var(--fs, 1));opacity:.7;margin-left:4px}
  .sb-n{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);line-height:1.5;flex:1;min-width:170px}
  .tl2{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tl-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--steel-2);padding:8px}
  .tl-inner{min-width:700px}
  .tl{display:block;width:100%;height:auto}
  .tl-m{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));fill:var(--muted)}
  .tl-lab{font-family:var(--display);font-size:calc(10.5px * var(--fs, 1));fill:var(--paper);letter-spacing:.07em;
    text-transform:uppercase;font-weight:700}
  .tl-ft{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));fill:var(--muted);letter-spacing:0;font-weight:400}
  .tl-n{font-family:var(--display);font-size:calc(9.5px * var(--fs, 1));fill:var(--on-fam);letter-spacing:.05em;
    text-transform:uppercase;font-weight:700}

  /* ---------- greenhouse ---------- */
  .gh{border:1px solid var(--rule);background:var(--steel-2);padding:13px 15px;margin-bottom:10px}
  .gh.transplanted{opacity:.5}
  .gh.sown,.gh.potted{border-left:2px solid var(--tag)}
  .gh.hardening{border-left:2px solid var(--twine)}
  .gh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:11px}
  .gh-n{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-weight:700;font-size:calc(15px * var(--fs, 1))}
  .gh-s{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--muted);margin-top:3px}
  .gh-badge{font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));letter-spacing:.09em;text-transform:uppercase;
    border:1px solid var(--rule);color:var(--muted);padding:2px 7px;white-space:nowrap}
  .gh-badge.sown,.gh-badge.potted{border-color:var(--tag);color:var(--tag)}
  .gh-badge.hardening{border-color:var(--twine);color:var(--twine)}
  .gh-badge.transplanted{border-color:var(--tag-dim);color:var(--tag-dim)}
  .gh-nums{display:flex;flex-wrap:wrap;border:1px solid var(--rule);background:var(--steel)}
  .gh-nums>div{flex:1;min-width:96px;padding:8px 10px;border-right:1px solid var(--rule)}
  .gh-nums>div:last-child{border-right:none}
  .gh-nums b{display:block;font-family:var(--data);font-size:calc(14px * var(--fs, 1));color:var(--tag);font-weight:400}
  .gh-nums i{display:block;font-family:var(--data);font-size:calc(9.5px * var(--fs, 1));color:var(--muted);font-style:normal;margin-top:2px}
  .gh-note{font-family:var(--data);font-size:calc(10px * var(--fs, 1));color:var(--tag);margin-top:9px;line-height:1.55}
  .gh-acts{display:flex;flex-wrap:wrap;gap:0;margin-top:11px;border:1px solid var(--rule)}

// ===========================================================================
// ENGINE
// ===========================================================================
const MS = 86400000;
function mkDate(y, md) { return new Date(y, md[0] - 1, md[1]); }
function shift(d, days) { const x = new Date(d); x.setDate(x.getDate() + days); return x; }
function wk(n) { return Math.round(n * 7); }
function dayDiff(a, b) { return Math.round((a - b) / MS); }

function frostDates(zone, year) {
  const z = ZONES[zone];
  if (!z || !z[0]) return { lf: null, ff: null, frostFree: true };
  return { lf: mkDate(year, z[0]), ff: mkDate(year, z[1]), frostFree: false };
}

// Returns every dated window for one crop in one year
function cropWindows(crop, zone, year) {
  const { lf, ff, frostFree } = frostDates(zone, year);
  const out = [];
  const LF = frostFree ? mkDate(year, [2, 1]) : lf;
  const FF = frostFree ? mkDate(year, [12, 31]) : ff;

  if (crop.fallOnly) {
    const w = crop.fallWeeksBeforeFrost;
    out.push({ kind: 'sow', season: 'fall',
      from: shift(FF, -wk(w[0])), to: shift(FF, -wk(w[1])) });
    return out;
  }

  // spring set out / direct sow
  const springPlant = crop.set
    ? { kind: 'set', from: shift(LF, wk(crop.set[0])), to: shift(LF, wk(crop.set[1])) }
    : crop.sow
      ? { kind: 'sow', from: shift(LF, wk(crop.sow[0])), to: shift(LF, wk(crop.sow[1])) }
      : null;

  // indoor start counts backward from the TRANSPLANT date, not from frost.
  // Brassicas go out before last frost, so their seedlings start in winter.
  if (crop.indoor && springPlant) {
    out.push({ kind: 'indoor', season: 'spring',
      from: shift(springPlant.from, -wk(crop.indoor[0])),
      to:   shift(springPlant.from, -wk(crop.indoor[1])) });
  }

  if (springPlant) {
    out.push(Object.assign({ season: 'spring' }, springPlant));
    if (crop.dtm < 400) {
      // tender crops stop at frost; hardy ones run past it by their tolerance
      const hardStop = shift(FF, crop.tol || 0);
      const tail = crop.hlen || (crop.succ ? 45 : 30);
      let hEnd = shift(springPlant.to, crop.dtm + tail);
      if (hEnd > hardStop) hEnd = hardStop;
      const hStart = shift(springPlant.from, crop.dtm);
      if (hEnd > hStart) {
        out.push({ kind: 'harvest', season: 'spring', from: hStart, to: hEnd });
      }
    }
  }

  // fall planting, computed backward from first frost
  if (crop.fall) {
    const usable = crop.dtm + 14 - (crop.tol || 0);   // tolerant crops can go later
    const close = shift(FF, -Math.max(7, usable));
    const open = shift(close, -21);
    if (dayDiff(close, springPlant ? springPlant.to : LF) > 30) {
      if (crop.indoor) {
        out.push({ kind: 'indoor', season: 'fall',
          from: shift(open, -wk(crop.indoor[0])), to: shift(open, -wk(crop.indoor[1])) });
      }
      out.push({ kind: crop.indoor ? 'set' : 'sow', season: 'fall', from: open, to: close });
      out.push({ kind: 'harvest', season: 'fall',
        from: shift(open, crop.dtm), to: shift(FF, crop.tol || 0) });
    }
  }
  return out;
}

    {to:1.0,n:'Finishing',     look:'Shoulders showing at the soil line',                            job:'Pull one and check. Size varies more than the seed packet says.'},
    {to:9,  n:'Ready',         look:'At full size',                                                  job:'Harvest, or leave in cold ground for storage if it is a keeper.'}],
  bulb:[
    {to:.15,n:'Rooting',       look:'Green shoots emerging',                                        job:'Keep weed free. Alliums lose badly to weed competition.'},
    {to:.50,n:'Leaf growth',   look:'Adding leaves, no bulb yet',                                    job:'Nitrogen every two to three weeks. Each leaf becomes a ring.'},
    {to:.80,n:'Bulbing',       look:'Base swelling, leaves stop adding',                             job:'Stop all nitrogen now. Keep water even.'},
    {to:1.0,n:'Curing down',   look:'Tops yellowing and falling over',                               job:'Stop watering. Lift when about half the tops are down.'},
    {to:9,  n:'Harvest',       look:'Tops down',                                                     job:'Lift and cure two weeks in shade with airflow before storing.'}],
};
function stageOf(crop, plantedISO, dtmOverride) {
  const dtm = dtmOverride || crop.dtm || 60;
  const days = dayDiff(TODAY, new Date(plantedISO));
  const pct = days / dtm;
  const band = STAGES[crop.cat] || STAGES.leaf;
  const s = band.find(x => pct <= x.to) || band[band.length-1];
  return { days, dtm, pct, stage:s, idx:band.indexOf(s), total:band.length };
}

function zipLookup(zip) {
  const z = String(zip).replace(/\D/g,'').slice(0,5);
  if (z.length < 5) return null;
  const p = parseInt(z.slice(0,3), 10);
  const hit = ZIP3.find(r => p >= r[0] && p <= r[1]);
  return hit ? { zone:hit[2], near:hit[3] } : null;
}

const CH = CHICKENS.map(a=>({kind:'chicken',name:a[0],eggs:a[1],eggColor:a[2],lb:a[3],
  cls:a[4],traits:a[5],lay:a[6]}));
const GT = GOATS.map(a=>({kind:'goat',name:a[0],type:a[1],lb:a[2],milk:a[3],bf:a[4],traits:a[5]}));

const INDEX = [];
CROPS.forEach(c => INDEX.push({kind:'crop',id:c.id,name:c.name,sub:`${c.fam} \u00b7 ${c.dtm<300?c.dtm+' days':'perennial'} \u00b7 ${c.sp} in spacing`,obj:c}));
Object.keys(VARIETIES).forEach(cid => {
  const c = CROPS.find(x=>x.id===cid); if(!c) return;
  VARIETIES[cid].forEach(v => INDEX.push({kind:'variety',id:cid,name:v[0],
    sub:`${c.name} \u00b7 ${v[1]?v[1]+' days':'\u2014'} \u00b7 ${v[2]}`,obj:{crop:c,name:v[0],dtm:v[1],note:v[2]}}));
});
CH.forEach(b => INDEX.push({kind:'chicken',name:b.name,
  sub:`${b.cls} \u00b7 ${b.eggs?b.eggs+' eggs/yr \u00b7 '+b.eggColor.toLowerCase():'meat bird'} \u00b7 ${b.lb} lb`,obj:b}));
GT.forEach(b => INDEX.push({kind:'goat',name:b.name,
  sub:`${b.type} \u00b7 ${b.lb} lb${b.milk?' \u00b7 '+b.milk+' qt/day \u00b7 '+b.bf+'% butterfat':''}`,obj:b}));

function searchIndex(q, kinds, limit) {
  const s = String(q||'').trim().toLowerCase();
  if (!s) return [];
  const pool = kinds ? INDEX.filter(r=>kinds.indexOf(r.kind)>=0) : INDEX;
  return pool.map(r => {
    const n = r.name.toLowerCase();
    let score = -1;
    if (n === s) score = 0;
    else if (n.indexOf(s) === 0) score = 1;
    else if (n.split(/\s+/).some(w=>w.indexOf(s)===0)) score = 2;
    else if (n.indexOf(s) > 0) score = 3;
    else if (r.sub.toLowerCase().indexOf(s) >= 0) score = 5;
    return score < 0 ? null : { ...r, score };
  }).filter(Boolean)
    .sort((a,b)=>a.score-b.score || a.name.localeCompare(b.name))
    .slice(0, limit||12);
}
function chickenBreed(n){ return CH.find(b=>b.name===n) || null; }
function goatBreed(n){ return GT.find(b=>b.name===n) || null; }
function varietiesFor(id){ return VARIETIES[id] || []; }

// breed aware feed and production models
function henFeedRate(lb){ return +(0.17 + (lb||6.5)*0.012).toFixed(3); }
function expectedEggs(breedName, count, ageMonths) {
  const b = chickenBreed(breedName);
  if (!b || !b.eggs) return null;
  let f = 1;
  if (ageMonths < (b.lay/4.33)) f = 0;                 // not old enough
  else if (ageMonths <= 18) f = 1;                     // first laying year
  else if (ageMonths <= 30) f = .82;
  else if (ageMonths <= 42) f = .68;
  else f = .55;
  const m = TODAY.getMonth();                          // rough daylight effect
  const day = (m<=1||m===11) ? .62 : (m===2||m===10) ? .8 : 1;
  return { perDay:+(b.eggs/365*count*f*day).toFixed(1), baseline:b.eggs, factor:f, daylight:day };
}

const ELEV = [
  [247,268,1500],[287,289,2200],[370,379,900],[590,599,3500],[570,577,2000],
  [578,579,3200],[800,816,5280],[820,831,6100],[832,838,2700],[840,847,4300],
  [850,853,1100],[855,857,2400],[859,865,7000],[870,884,5300],[889,891,2000],
  [893,898,4500],[930,935,400],[936,938,300],[975,979,3600],[988,994,2000],
  [790,795,3200],[796,799,3700],[430,439,900],[500,528,1000],[660,679,1300],
  [680,693,1600],[560,567,1200],
];
function elevFor(zip) {
  const z = String(zip||'').replace(/\D/g,'');
  if (z.length < 3) return 500;
  const p = parseInt(z.slice(0,3),10);
  const hit = ELEV.find(r => p>=r[0] && p<=r[1]);
  return hit ? hit[2] : 500;
}
// water bath: add minutes.  pressure: raise psi.
function bathAdd(ft){ return ft<=1000?0 : ft<=3000?5 : ft<=6000?10 : ft<=8000?15 : 20; }
function dialPsi(ft){ return ft<=2000?11 : ft<=4000?12 : ft<=6000?13 : ft<=8000?14 : 15; }
function weightPsi(ft){ return ft<=1000?10 : 15; }

  {cid:'cabbage',  label:'Cabbage and kraut',  qt:6,  cellar:15},
];
// how many row feet to grow a given poundage of a crop
function feetFor(cropId, lbNeeded) {
  const c = CROPS.find(x=>x.id===cropId);
  if (!c || !c.yld) return 0;
  const plants = lbNeeded / c.yld;
  return Math.ceil(plants * c.sp / 12);
}
function yearPlanFor(people) {
  return YEAR_PLAN.map(r => {
    const lbPerQt = YIELD_LB[r.cid] || 3;
    const qt = r.qt * people;
    const cellarLb = r.cellar * people;
    const lb = qt * lbPerQt + cellarLb;
    return { ...r, qt, cellarLb, lb:Math.round(lb), feet:feetFor(r.cid, lb),
             crop:CROPS.find(x=>x.id===r.cid) };
  });
}

  obj:r}));

{id:'g-cae',g:'goat',n:'CAE, CL, and Johnes',sev:'watch',
