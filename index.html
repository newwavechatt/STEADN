// ---- symptom search across the library ----------------------------------
const STOP = ['the','a','an','my','is','are','in','on','of','and','to','with','have','has','it','be','not','no','why','what'];
function problemSearch(q, group) {
  const raw = String(q||'').trim().toLowerCase();
  let pool = PROBLEMS.filter(p => !group || group==='all' || p.g===group);
  if (!raw) return pool;
  const words = raw.split(/[^a-z]+/).filter(w => w.length>2 && STOP.indexOf(w)<0);
  if (!words.length) return pool;
  return pool.map(p => {
    const name = p.n.toLowerCase(), sym = p.sym.toLowerCase();
    const rest = (p.cause+' '+p.fix.join(' ')).toLowerCase();
    let sc = 0, hits = 0;
    words.forEach(w => {
      if (name.includes(w))      { sc += 6; hits++; }
      else if (sym.includes(w))  { sc += 4; hits++; }
      else if (rest.includes(w)) { sc += 1; hits++; }
    });
    if (!hits) return null;
    sc += hits === words.length ? 5 : 0;        // reward matching every word
    return { ...p, sc };
  }).filter(Boolean).sort((a,b)=> b.sc-a.sc || a.n.localeCompare(b.n));
}
function problemsForCrop(c) {
  return PROBLEMS.filter(p => p.g==='plant'
    && (p.fam.length===0 || p.fam.includes(c.fam))
    && (!p.only || p.only.indexOf(c.id)>=0));
}
PROBLEMS.forEach(p => INDEX.push({kind:'problem', id:p.id, name:p.n,
  sub:`${p.g==='plant'?'Plant':p.g==='chicken'?'Poultry':'Goat'} \u00b7 ${p.sev==='urgent'?'urgent':p.sev==='watch'?'watch closely':'routine'} \u00b7 ${p.sym.slice(0,70)}`,
  obj:p}));

// ---- feature flag pruning ------------------------------------------------
if (!ANIMALS) {
  for (let i = PROBLEMS.length - 1; i >= 0; i--)
    if (PROBLEMS[i].g !== 'plant') PROBLEMS.splice(i, 1);
  for (let i = INDEX.length - 1; i >= 0; i--) {
    const r = INDEX[i];
    if (r.kind === 'chicken' || r.kind === 'goat') INDEX.splice(i, 1);
    else if (r.kind === 'problem' && r.obj.g !== 'plant') INDEX.splice(i, 1);
  }
}

// ===========================================================================
// PLANTING VALIDATION
// Works the real arithmetic: planted on this date, with this maturity, does
// the harvest land far enough ahead of frost to be worth the ground?
// Never blocks. Explains, offers a shorter variety, then lets them proceed.
// ===========================================================================
function plantCheck(crop, dtm, when) {
  const w = when || TODAY;
  const { lf, ff, frostFree } = frostDates(state.place.zone, YEAR);
  if (frostFree || !ff) return { level:'ok', frostFree:true };
  if (dtm >= 300) return { level:'ok', perennial:true };
  // garlic and cover crops are planted in fall on purpose and cross the year
  if (crop.fallOnly || dtm >= 200) return { level:'ok', overwinter:true };

  const harvest   = shift(w, dtm);
  const tol       = crop.tol || 0;
  const hardStop  = shift(ff, tol);           // hardy crops keep going past frost
  const pickDays  = dayDiff(hardStop, harvest);
  const tender    = crop.hardy === 'tender';
  const untilLF   = dayDiff(lf, w);           // positive means last frost is still ahead

  const base = { harvest, ff, lf, tol, pickDays, dtm, tender };

  // too early: a tender crop going out before the last frost
  if (tender && untilLF > 0) return { ...base, level:'early', untilLF };

  if (pickDays < 0)   return { ...base, level:'wont',   short:-pickDays };
  if (pickDays <= 14) return { ...base, level:'barely' };
  if (pickDays <= 30) return { ...base, level:'tight'  };
  return { ...base, level:'ok' };
}

// a shorter variety of the same crop that would actually finish
function fasterVariety(crop, when) {
  const vs = varietiesFor(crop.id).filter(v => v[1] > 0 && v[1] < 300);
  const scored = vs.map(v => ({ name:v[0], dtm:v[1], note:v[2],
      chk: plantCheck(crop, v[1], when) }))
    .filter(x => x.chk.level==='ok' || x.chk.level==='tight')
    .sort((a,b) => a.dtm - b.dtm);
  return scored[0] || null;
}

// what else could go in this ground right now instead
function insteadNow(limit) {
  const out = [];
  CROPS.forEach(c => {
    if (c.dtm >= 200) return;                     // skip overwinterers here
    const chk = plantCheck(c, c.dtm, TODAY);
    if (chk.level !== 'ok') return;
    // prefer crops whose window is genuinely open right now
    const openNow = windowsFor(c).some(w => w.kind!=='harvest'
      && dayDiff(w.from,TODAY) <= 0 && dayDiff(w.to,TODAY) >= 0);
    out.push({ crop:c, openNow, pick:chk.pickDays });
  });
  return out.sort((a,b) => (b.openNow?1:0)-(a.openNow?1:0) || a.crop.dtm-b.crop.dtm)
            .slice(0, limit||5);
}

// ---- the panel -----------------------------------------------------------
function checkPanel(crop, dtm, ack) {
  const c = plantCheck(crop, dtm, TODAY);
  if (c.level === 'ok') {
    return `<div class="chk ok">
      <div class="chk-h">Timing works</div>
      <div class="chk-b">${c.frostFree ? 'No frost in your zone, so this can go in whenever.'
        : c.overwinter ? `${esc(crop.name)} is meant to go in now and overwinter. It sits through the cold and finishes next season, so first frost is not the deadline.`
        : c.perennial ? 'A perennial, so first frost is not the deadline.'
        : `Planted today, first harvest lands about ${fmtU(c.harvest)}. That leaves roughly ${c.pickDays} days of picking before ${c.tol?`the ground gets too cold around ${fmtU(shift(c.ff,c.tol))}`:`your average first frost on ${fmtU(c.ff)}`}.`}</div>
    </div>`;
  }

  const faster = fasterVariety(crop, TODAY);
  const alts = insteadNow(4);

  let head, body;
  if (c.level === 'early') {
    head = `Too early by ${plural(c.untilLF,'day')}`;
    body = `${esc(crop.name)} is frost tender. Your average last spring frost is ${fmtU(c.lf)}, which is ${plural(c.untilLF,'day')} out. Set out now and a cold night can kill it outright, or check its growth so badly it never catches up.`;
  } else if (c.level === 'wont') {
    head = `It will not finish`;
    body = `${esc(crop.name)} needs ${c.dtm} days. Planted today, first harvest would not come until about ${fmtU(c.harvest)}, which is ${plural(c.short,'day')} past ${c.tol?`the point cold shuts it down around ${fmtU(shift(c.ff,c.tol))}`:`your average first frost on ${fmtU(c.ff)}`}. You would grow the plant and lose the crop.`;
  } else if (c.level === 'barely') {
    head = `Only about ${plural(c.pickDays,'day')} of picking`;
    body = `${esc(crop.name)} needs ${c.dtm} days, so first harvest lands around ${fmtU(c.harvest)} and cold ends it near ${fmtU(shift(c.ff,c.tol))}. That is one small picking if the weather cooperates and nothing if it turns early.`;
  } else {
    head = `Tight but possible`;
    body = `First harvest about ${fmtU(c.harvest)}, with roughly ${plural(c.pickDays,'day')} before cold ends it. You will get some, not a full run. An early frost takes it.`;
  }

  return `<div class="chk warn">
    <div class="chk-h">${head}</div>
    <div class="chk-b">${body}</div>

    <div class="chk-math">
      <div><span class="cl">Planted</span><b>${fmtU(TODAY)}</b></div>
      <div><span class="cl">Days to maturity</span><b>${c.dtm}</b></div>
      <div><span class="cl">First harvest</span><b>${fmtU(c.harvest)}</b></div>
      <div><span class="cl">${c.level==='early'?'Last spring frost':'Cold ends it'}</span><b>${
        c.level==='early'?fmtU(c.lf):fmtU(shift(c.ff,c.tol))}</b></div>
    </div>

    ${faster && faster.dtm < dtm ? `<div class="chk-fix">
      <span class="cf-l">A faster variety would make it</span>
      <b>${esc(faster.name)}</b> at ${faster.dtm} days finishes around ${fmtU(shift(TODAY,faster.dtm))}, giving you about ${plural(faster.chk.pickDays,'day')} of picking. ${esc(faster.note)}
      <button class="btn-ghost" data-usefaster="${esc(crop.id)}|${esc(faster.name)}|${faster.dtm}">Switch to ${esc(faster.name)}</button>
    </div>`:''}

    ${c.level!=='early'?`<div class="chk-fix">
      <span class="cf-l">Or buy yourself time</span>
      Row cover or a low tunnel is worth about two weeks on the back end, and a cold frame more. That is often the difference on a tight one.
    </div>`:''}

    ${alts.length?`<div class="chk-fix">
      <span class="cf-l">What does have time right now</span>
      <div class="altrow">${alts.map(a=>
        `<button class="gchip ${a.openNow?'inwin':''}" data-usecrop="${a.crop.id}">${esc(a.crop.name)} <i>${a.crop.dtm}d</i></button>`).join('')}</div>
    </div>`:''}

    <label class="ackline">
      <button class="tick ${ack?'on':''}" data-ackplant="1" aria-pressed="${ack?'true':'false'}"></button>
      <span>I know the timing is short. Plant it anyway.</span>
    </label>
  </div>`;
}

// ===========================================================================
// YEAR PLAN AS A CHECKLIST
// planItems is the source of truth. Seeded from the traditional targets,
// then anything can be switched off, retuned, or added.
// ===========================================================================
function initPlanItems() {
  const m = {};
  YEAR_PLAN.forEach(r => { m[r.cid] = { on:true, qt:r.qt, cellar:r.cellar, label:r.label }; });
  return m;
}
function planRows() {
  const p = state.people;
  return Object.keys(state.planItems).map(cid => {
    const it = state.planItems[cid];
    const crop = cropById(cid);
    const lbPerQt = YIELD_LB[cid] || 3;
    const qt = (it.qt||0) * p;
    const cellarLb = (it.cellar||0) * p;
    const lb = qt * lbPerQt + cellarLb;
    return { cid, on:it.on, crop,
      label: it.label || (crop?crop.name:cid),
      qtEach: it.qt||0, cellarEach: it.cellar||0,
      qt, cellarLb, lb: Math.round(lb),
      feet: crop ? feetFor(cid, lb) : 0,
      lbPerFt: crop ? crop.yld * 12 / crop.sp : 0 };
  }).sort((a,b) => (b.on?1:0)-(a.on?1:0) || b.feet-a.feet);
}
function planNeeds() {
  const on = planRows().filter(r=>r.on && r.feet>0);
  return { rows:on,
    feet: on.reduce((a,r)=>a+r.feet,0),
    qt:   on.reduce((a,r)=>a+r.qt,0),
    lb:   on.reduce((a,r)=>a+r.lb,0) };
}

// ===========================================================================
// PLOT GEOMETRY
// Two honest layouts. Rows on a pitch, or raised beds with paths where each
// bed carries several rows across its width.
// ===========================================================================
// inches between rows that each layout actually delivers
function layoutRowSpacing() {
  const st = PLOT_STYLES[state.plot.style] || PLOT_STYLES.rows;
  if (st.rowsPer <= 1) return st.pitchFt * 12;          // whole pitch is the row gap
  return Math.round((4 * 12) / st.rowsPer);             // rows across a 4 ft bed
}
const PLOT_STYLES = {
  rows: { n:'Traditional rows', pitchFt:3, rowsPer:1,
    d:'Single rows on a three foot pitch. Room to walk and get a tiller down the middle.' },
  beds: { n:'Raised beds', pitchFt:6, rowsPer:3,
    d:'Four foot beds with two foot paths. Each bed carries three rows across it.' },
  intensive: { n:'Intensive beds', pitchFt:5, rowsPer:4,
    d:'Four foot beds on tighter one foot paths, four rows across. Most row feet per square foot, hardest to work.' },
};
function plotCapacity() {
  const pl = state.plot;
  const st = PLOT_STYLES[pl.style] || PLOT_STYLES.rows;
  const usableW = Math.max(0, pl.w - pl.edge*2);
  const usableL = Math.max(0, pl.l - pl.edge*2);
  const units = Math.floor(usableW / st.pitchFt);           // rows or beds across
  const rows = units * st.rowsPer;
  const rowLen = Math.floor(usableL);
  return { st, units, rows, rowLen, totalFt: rows*rowLen,
    sqft: pl.l*pl.w, usableW, usableL };
}

// allocate the checklist into the available rows
function plotAllocate() {
  const cap = plotCapacity();
  const need = planNeeds();
  // pinned crops first, then most productive per foot
  const pin = state.pinned || {};
  const queue = need.rows.slice().sort((a,b)=>
    (pin[b.cid]?1:0)-(pin[a.cid]?1:0) || b.lbPerFt - a.lbPerFt);
  const beds = [];
  for (let i=0;i<cap.rows;i++) beds.push({ i, name:`${cap.st.rowsPer>1?'Bed':'Row'} ${i+1}`, len:cap.rowLen, segs:[], free:cap.rowLen });
  const placed = [], cut = [];

  queue.forEach(r => {
    let remaining = r.feet;
    for (const b of beds) {
      if (remaining <= 0) break;
      if (b.free < 2) continue;
      const take = Math.min(b.free, remaining);
      b.segs.push({ cid:r.cid, ft:take, label:r.label });
      b.free -= take; remaining -= take;
    }
    const got = r.feet - remaining;
    if (got > 0) placed.push({ ...r, got });
    if (remaining > 0) cut.push({ ...r, short:remaining, got });
  });

  return { cap, need, beds, placed, cut,
    usedFt: beds.reduce((a,b)=>a+(b.len-b.free),0),
    freeFt: beds.reduce((a,b)=>a+b.free,0) };
}

// dimensions that would fit the whole checklist at the current style
function plotNeededSize() {
  const need = planNeeds();
  const pl = state.plot;
  const st = PLOT_STYLES[pl.style] || PLOT_STYLES.rows;
  const usableL = Math.max(1, pl.l - pl.edge*2);
  const rowsNeeded = Math.ceil(need.feet / usableL);
  const unitsNeeded = Math.ceil(rowsNeeded / st.rowsPer);
  const widthNeeded = Math.ceil(unitsNeeded * st.pitchFt + pl.edge*2);
  return { widthNeeded, unitsNeeded, rowsNeeded, keepLength: pl.l };
}

function applyPlot() {
  const { beds } = successionAllocate();
  const out = [];
  beds.filter(b => b.placed.length).forEach(b => {
    const bed = { id:uid(), name:b.name, len:b.len, segments:[] };
    b.placed.forEach(p => {
      const c = cropById(p.cid); if (!c) return;
      bed.segments.push({ id:uid(), cropId:p.cid, ft:Math.round(p.ft*2)/2,
        sp:c.sp, variety:null, dtm:null, planted:null,
        season:p.season, plantOn:p.slot.from.toISOString(),
        clearBy:p.slot.clear.toISOString(), fromFt:p.fromFt });
    });
    out.push(bed);
  });
  state.beds = out;
}

// ---- plot drawing --------------------------------------------------------
function plotSvg() {
  const { cap, beds } = plotAllocate();
  const pl = state.plot;
  const W = 640, PADL = 34, PADT = 22, PADB = 26, PADR = 14;
  const innerW = W - PADL - PADR;
  const scale = innerW / Math.max(1, pl.l);          // length runs left to right
  const H = Math.min(430, Math.max(150, pl.w * scale)) ;
  const vScale = H / Math.max(1, pl.w);
  const total = W, totalH = H + PADT + PADB;

  let rowsSvg = '';
  const st = cap.st;
  const bandH = st.pitchFt * vScale;
  const bedH = (st.rowsPer>1 ? 4 : 1) * vScale;      // drawn bed thickness

  beds.forEach((b,i) => {
    const unit = Math.floor(i / st.rowsPer);
    const withinUnit = i % st.rowsPer;
    const yTop = PADT + pl.edge*vScale + unit*bandH + (withinUnit * (bedH/st.rowsPer));
    const h = Math.max(2.5, (bedH/st.rowsPer) - 1.2);
    let x = PADL + pl.edge*scale;
    if (!b.segs.length) {
      rowsSvg += `<rect x="${x}" y="${yTop}" width="${b.len*scale}" height="${h}"
        fill="none" stroke="var(--rule)" stroke-dasharray="3 3" stroke-width="1"/>`;
      return;
    }
    b.segs.forEach(s => {
      const c = cropById(s.cid);
      const w = s.ft * scale;
      rowsSvg += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${h.toFixed(1)}"
        fill="${famColor(c?c.fam:'',.72)}"/>`;
      if (w > 44 && h > 8) rowsSvg += `<text x="${(x+3).toFixed(1)}" y="${(yTop+h/2+3).toFixed(1)}"
        class="pl-lab">${esc((s.label||'').slice(0,Math.floor(w/6)))}</text>`;
      x += w;
    });
    if (b.free > 0.4) rowsSvg += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}"
      width="${(b.free*scale).toFixed(1)}" height="${h.toFixed(1)}"
      fill="none" stroke="var(--rule)" stroke-dasharray="3 3" stroke-width="1"/>`;
  });

  return `<svg class="plot" viewBox="0 0 ${total} ${totalH}" preserveAspectRatio="xMidYMid meet">
    <rect x="${PADL}" y="${PADT}" width="${pl.l*scale}" height="${pl.w*vScale}"
      fill="none" stroke="var(--muted)" stroke-width="1"/>
    ${rowsSvg}
    <text x="${PADL + pl.l*scale/2}" y="${totalH-8}" class="pl-dim" text-anchor="middle">${pl.l} ft</text>
    <text x="14" y="${PADT + pl.w*vScale/2}" class="pl-dim" text-anchor="middle"
      transform="rotate(-90 14 ${PADT + pl.w*vScale/2})">${pl.w} ft</text>
    <text x="${PADL}" y="${PADT-7}" class="pl-dim">${cap.units} ${st.rowsPer>1?'beds':'rows'} \u00b7 ${cap.rows} rows of ${cap.rowLen} ft \u00b7 ${cap.totalFt} row ft</text>
  </svg>`;
}

// "3 packets", "16 lb of seed potatoes", "5 bundles of slips"
function unitLabel(u, n) {
  if (n === 1) return u;
  if (u === 'packet') return 'packets';
  if (u === 'bulb') return 'bulbs';
  return u.replace(/^bundle of/, 'bundles of');
}

// build the order list from whatever actually got placed in the plot
function seedList(placed) {
  return placed.map(r => {
    const c = r.crop; if (!c) return null;
    const ft = r.got != null ? r.got : r.feet;
    const plants = Math.floor(ft * 12 / c.sp);
    const pk = SEED_PACK[c.id] || {per:100, u:'packet'};
    // seed gets a margin for germination and thinning. Sets, slips, seed
    // potatoes, cloves, and crowns each become one plant, so no margin.
    const veg = /sets|slips|seed potatoes|bulb|crowns|plants/.test(pk.u);
    const seeds = veg ? plants : Math.ceil(plants * 1.3);
    const units = Math.max(1, Math.ceil(seeds / pk.per));
    return { crop:c, label:r.label, ft:Math.round(ft*10)/10, plants, seeds, veg,
             units, unit:unitLabel(pk.u, units), note:pk.note||null, start:!!pk.start };
  }).filter(Boolean).sort((a,b) => a.crop.name.localeCompare(b.crop.name));
}

// SEED VENDORS
// Links attach to an already computed list. Nothing here ever influences
// what the plan recommends. The agronomy runs first and alone.
//
// zones: which growing zones this vendor's stock is actually bred for.
// q: search URL. Search pages outlast product SKUs, which break constantly.
// aff: where an affiliate tag goes once a program is approved.
// ===========================================================================
// region from ZIP prefix. Zone alone is not enough: 8b in Georgia and 8b in
// Oregon share a number and almost nothing else.
function regionOf(zip) {
  const z = String(zip||'').replace(/\D/g,'');
  if (z.length < 3) return null;
  const p = parseInt(z.slice(0,3),10);
  if (p <= 199) return 'NE';
  if (p <= 269) return 'MA';          // mid Atlantic
  if (p <= 399) return 'SE';
  if (p <= 499) return 'MW';
  if (p <= 599) return 'UMW';         // upper midwest
  if (p <= 699) return 'MW';
  if (p <= 799) return 'SC';          // south central
  if (p <= 899) return 'MTN';
  if (p <= 969) return 'CA';
  return 'NW';
}

function zoneNum(z){ return parseInt(String(z||'7'),10) || 7; }
function vendorFit(v) {
  const z = zoneNum(state.place.zone);
  const reg = regionOf(state.place.zip);
  if (!v.zones) return 0;
  const [lo,hi] = v.zones;
  const zoneOk = z >= lo && z <= hi;
  if (!zoneOk) return 0;
  const regOk = !reg || !v.reg || v.reg.indexOf(reg) >= 0;
  if (!regOk) return 0;                       // wrong climate, do not offer it
  const span = hi - lo;
  const tightRegion = v.reg && v.reg.length <= 3;
  return (tightRegion && regOk ? 3 : 0) + (span <= 5 ? 1 : 0) || 1;
}
function vendorsRanked() {
  return VENDORS.map(v=>({...v, fit:vendorFit(v)}))
    .filter(v=>v.fit>0 || v.id==='local')
    .sort((a,b)=> (a.id==='local'?-1:0)-(b.id==='local'?-1:0) || b.fit-a.fit);
}
function unitKind(unit) {
  if (/seed potatoes/.test(unit)) return 'potatoes';
  if (/slips/.test(unit)) return 'slips';
  if (/sets/.test(unit)) return 'sets';
  if (/bulb/.test(unit)) return 'bulb';
  if (/broadcast/.test(unit)) return 'cover';
  return 'packet';
}
function buyUrl(v, item) {
  if (!v || !v.q) return null;
  const term = encodeURIComponent(item.crop.name);
  return v.q + term + (v.aff ? v.aff : '');
}

// ===========================================================================
// SUCCESSION PLANNING
// A bed foot is not occupied for a year. It is occupied for a date range.
// Spring peas clear in June and that same ground carries fall brassicas.
// Allocation therefore packs in two dimensions: feet and time.
// ===========================================================================

// every stretch of the year a crop would actually hold ground
function cropSlots(crop) {
  const ws = cropWindows(crop, state.place.zone, YEAR);
  const out = [];
  ['spring','fall'].forEach(season => {
    const plant = ws.find(w => w.season===season && w.kind!=='harvest' && w.kind!=='indoor');
    if (!plant) return;
    const harv = ws.find(w => w.season===season && w.kind==='harvest');
    let end = harv ? harv.to : shift(plant.to, crop.dtm);
    let carries = false;
    if (end.getFullYear() > YEAR) { end = new Date(YEAR,11,31); carries = true; }
    out.push({ season, kind:plant.kind,
      from: plant.from, plantBy: plant.to,
      clear: shift(end, 7),                 // a week to pull and turn the ground
      carries, dtm: crop.dtm });
  });
  // garlic and cover crops go in during fall and hold through winter
  if (!out.length && crop.fallOnly) {
    const w = ws[0];
    if (w) out.push({ season:'fall', kind:w.kind, from:w.from, plantBy:w.to,
      clear:new Date(YEAR,11,31), carries:true, dtm:crop.dtm });
  }
  return out;
}
const overlaps = (a1,a2,b1,b2) => a1 < b2 && b1 < a2;

// ---------------------------------------------------------------------------
// 2D allocator. Each bed is a strip of one foot cells; each cell holds a list
// of time intervals already spoken for.
// ---------------------------------------------------------------------------
function successionAllocate() {
  const cap = plotCapacity();
  const need = planNeeds();
  const pin = state.pinned || {};

  const beds = [];
  for (let i=0;i<cap.rows;i++) beds.push({
    i, name:`${cap.st.rowsPer>1?'Bed':'Row'} ${i+1}`, len:cap.rowLen,
    cells: Array.from({length:cap.rowLen}, () => []),
    placed: [],
  });

  // one job per crop per usable season, so a crop can take spring and fall
  const jobs = [];
  need.rows.forEach(r => {
    const c = r.crop; if (!c) return;
    const slots = cropSlots(c);
    if (!slots.length) return;
    // split the requirement across the seasons it can use
    const share = Math.ceil(r.feet / slots.length);
    slots.forEach((s,i) => {
      const ft = (i===slots.length-1) ? r.feet - share*(slots.length-1) : share;
      if (ft > 0) jobs.push({ ...r, crop:c, slot:s, ft, pinned:!!pin[r.cid] });
    });
  });
  // pinned first, then most productive, then earliest to go in
  jobs.sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || b.lbPerFt-a.lbPerFt || a.slot.from-b.slot.from);

  const free = (bed, at, len, from, to) => {
    if (at+len > bed.len) return false;
    for (let k=at;k<at+len;k++)
      for (const iv of bed.cells[k])
        if (overlaps(from, to, iv.from, iv.to)) return false;
    return true;
  };

  const placed = [], cut = [];
  jobs.forEach(j => {
    let remaining = j.ft;
    const { from, clear } = j.slot;
    for (const bed of beds) {
      if (remaining <= 0) break;
      let at = 0;
      while (at < bed.len && remaining > 0) {
        if (!free(bed, at, 1, from, clear)) { at++; continue; }
        let run = 0;
        while (at+run < bed.len && run < remaining && free(bed, at+run, 1, from, clear)) run++;
        if (run >= 1) {
          const take = Math.min(run, remaining);
          for (let k=at;k<at+take;k++) bed.cells[k].push({from, to:clear, cid:j.cid});
          bed.placed.push({ cid:j.cid, crop:j.crop, label:j.label, season:j.slot.season,
            fromFt:at, toFt:at+take, ft:take, slot:j.slot });
          remaining -= take; at += take;
        } else at++;
      }
    }
    const got = j.ft - remaining;
    if (got > 0) placed.push({ ...j, got });
    if (remaining > 0.5) cut.push({ ...j, short:remaining, got });
  });

  // how much the succession buys you
  const singleUse = beds.reduce((a,b) => a + b.placed.reduce((s,p)=>s+p.ft,0), 0);
  const distinctFt = beds.reduce((a,b) => {
    let used=0; for (let k=0;k<b.len;k++) if (b.cells[k].length) used++;
    return a+used;
  }, 0);

  return { cap, need, beds, placed, cut, jobs,
    usedFt: singleUse, groundFt: distinctFt,
    reuse: distinctFt ? singleUse/distinctFt : 1,
    freeFt: cap.totalFt - distinctFt };
}

// ---------------------------------------------------------------------------
// TIMELINE  bed by bed, foot band by foot band, across the year
// ---------------------------------------------------------------------------
const MONW = ['J','F','M','A','M','J','J','A','S','O','N','D'];
function timelineSvg() {
  const al = successionAllocate();
  const rows = [];
  al.beds.forEach(b => {
    if (!b.placed.length) return;
    // group placements that share the same foot band
    const bands = {};
    b.placed.forEach(p => {
      const k = p.fromFt + '-' + p.toFt;
      (bands[k] = bands[k] || []).push(p);
    });
    Object.keys(bands)
      .sort((x,y)=>parseFloat(x)-parseFloat(y))
      .forEach(k => rows.push({ bed:b, band:k, items:bands[k] }));
  });
  if (!rows.length) return '<div class="empty">Nothing allocated yet.</div>';

  const LAB = 128, W = 700, PADT = 26, RH = 20, PADB = 8;
  const plotW = W - LAB - 8;
  const H = PADT + rows.length*RH + PADB;
  const y0 = new Date(YEAR,0,1).getTime(), y1 = new Date(YEAR,11,31).getTime();
  const x = d => LAB + ((d.getTime()-y0)/(y1-y0)) * plotW;

  let grid = '';
  for (let m=0;m<12;m++){
    const gx = x(new Date(YEAR,m,1));
    grid += `<line x1="${gx.toFixed(1)}" y1="${PADT-6}" x2="${gx.toFixed(1)}" y2="${H-PADB}"
      stroke="var(--rule)" stroke-width="1" opacity=".5"/>`;
    grid += `<text x="${(gx+3).toFixed(1)}" y="${PADT-11}" class="tl-m">${MONW[m]}</text>`;
  }
  const today = x(TODAY);
  grid += `<line x1="${today.toFixed(1)}" y1="${PADT-6}" x2="${today.toFixed(1)}" y2="${H-PADB}"
    stroke="var(--paper)" stroke-width="1"/>`;

  // greenhouse lead-in, drawn hatched so it reads as under cover not in ground
  let bars = '';
  rows.forEach((r,i) => {
    const yTop = PADT + i*RH;
    bars += `<text x="4" y="${yTop+13}" class="tl-lab">${esc(r.bed.name)} <tspan class="tl-ft">${r.band.replace('-','\u2013')} ft</tspan></text>`;
    bars += `<rect x="${LAB}" y="${yTop+3}" width="${plotW}" height="${RH-7}" fill="var(--steel)"/>`;
    r.items.sort((a,b)=>a.slot.from-b.slot.from).forEach(p => {
      const bx = x(p.slot.from), bw = Math.max(3, x(p.slot.clear)-bx);
      const c = p.crop;
      // the planting window itself, then the growing stretch
      const px = x(p.slot.from), pw = Math.max(2, x(p.slot.plantBy)-px);
      bars += `<rect x="${bx.toFixed(1)}" y="${yTop+3}" width="${bw.toFixed(1)}" height="${RH-7}"
        fill="${famColor(c.fam,.72)}"/>`;
      bars += `<rect x="${px.toFixed(1)}" y="${yTop+3}" width="${pw.toFixed(1)}" height="${RH-7}"
        fill="#151A1E" opacity=".28"/>`;
      // weeks under cover before it ever reaches this ground
      if (c.indoor) {
        const ix = x(shift(p.slot.from, -Math.round(c.indoor[0]*7)));
        const iw = Math.max(2, px - ix);
        bars += `<rect x="${ix.toFixed(1)}" y="${(yTop+6).toFixed(1)}" width="${iw.toFixed(1)}" height="${RH-13}"
          fill="none" stroke="${famColor(c.fam,.85)}" stroke-width="1" stroke-dasharray="2 2"/>`;
      }
      if (bw > 42) bars += `<text x="${(bx+4).toFixed(1)}" y="${yTop+14}" class="tl-n">${
        esc((p.label||c.name).slice(0, Math.floor(bw/6)))}</text>`;
    });
  });

  return `<svg class="tl" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">
    ${grid}${bars}</svg>`;
}

function timelineView() {
  const al = successionAllocate();
  const gain = al.reuse;
  const singleNeed = al.need.feet;

  return `<div class="wrap">
    <div class="eyebrow">Season timeline</div>
    <div class="totals">
      <div><span class="tl2">Ground used</span><b>${al.groundFt}<i>ft</i></b></div>
      <div><span class="tl2">Crop feet grown</span><b>${al.usedFt}<i>ft</i></b></div>
      <div><span class="tl2">Ground worked</span><b>${gain.toFixed(2)}<i>x over</i></b></div>
      <div><span class="tl2">Still short</span><b class="${al.cut.length?'bad':''}">${al.cut.length}</b></div>
    </div>
    <div class="hint" style="margin:0 0 14px">Each band is a stretch of one bed. A bar is one crop holding that ground, from the day it can go in to the day it comes out. Where two bars sit on one band, the same ground is carrying two crops in a year. The dark edge on the left of a bar is the planting window; the rest is growing time.</div>
    <div class="tl-scroll"><div class="tl-inner">${timelineSvg()}</div></div>
    <div class="legend" style="margin-top:10px">
      ${Array.from(new Set(al.placed.map(p=>p.crop.fam))).map(f=>
        `<span><i class="sw" style="background:${famColor(f,.72)}"></i>${esc(f)}</span>`).join('')}
      <span><i class="sw" style="border:1px dashed var(--muted);background:none"></i>Under cover</span>
      <span><i class="sw" style="background:var(--paper);width:2px"></i>Today</span>
    </div>

    <div class="chk ${gain>1.15?'ok':'warn'}" style="margin-top:16px">
      <div class="chk-h">${gain>1.15
        ? `Succession is doing real work here`
        : `Little succession in this plan`}</div>
      <div class="chk-b">${gain>1.15
        ? `You are growing ${al.usedFt} crop feet on ${al.groundFt} feet of actual ground, so the same dirt works ${gain.toFixed(2)} times over. Without replanting you would need ${singleNeed} feet outright.`
        : `Almost every crop here holds its ground the whole season, so there is little chance to follow one with another. Adding short season crops like radish, spinach, arugula, or bush beans opens up second plantings.`}</div>
    </div>

    ${al.cut.length?`<div class="eyebrow">Still does not fit</div><div class="card">${al.cut.map(c=>`
      <div class="row"><div>
        <div class="row-name">${esc(c.label)} <span class="handle">${c.slot.season}</span></div>
        <div class="row-note">${Math.round(c.short)} ft short${c.got?`, ${Math.round(c.got)} ft placed`:''} \u00b7 wants the ground ${fmtU(c.slot.from)} to ${fmtU(c.slot.clear)}</div>
      </div><div class="row-right"><button class="btn-ghost" data-planoff="${c.cid}">Drop it</button></div></div>`).join('')}</div>`:''}
  </div>`;
}

// ===========================================================================
// GREENHOUSE
// Anything started under cover before it goes in the ground. Indoor time does
// not occupy bed space, so it never competes with the field allocator. What it
// does occupy is tray space, and it sets the clock for every transplant date.
// ===========================================================================

// cell size by seed, which decides trays and potting up
const CELL = {
  small:  {n:'72 cell tray',  per:72, mix:0.35, pot:false},
  medium: {n:'50 cell tray',  per:50, mix:0.45, pot:true},
  large:  {n:'4 inch pots',   per:18, mix:0.80, pot:false},
};
function cellKind(c) {
  if (['tomato','pepper','eggplant'].indexOf(c.id) >= 0) return 'medium';
  if (['cucumber','sqsummer','sqwinter','pumpkin','melon'].indexOf(c.id) >= 0) return 'large';
  return 'small';
}
const startKey = (bedId, segId) => bedId + ':' + segId;

// every batch that wants starting under cover
function startBatches() {
  const out = [];
  allSegs().forEach(({bed, seg}) => {
    const c = cropById(seg.cropId);
    if (!c || !c.indoor) return;                       // direct sown, nothing to do
    const target = seg.plantOn ? new Date(seg.plantOn) : null;
    if (!target) return;
    const weeks = c.indoor;                            // [earliest, latest] weeks before setting out
    const sowFrom = shift(target, -Math.round(weeks[0]*7));
    const sowTo   = shift(target, -Math.round(weeks[1]*7));
    const harden  = shift(target, -10);
    const plants  = segCount(seg);
    const kind    = cellKind(c);
    const cell    = CELL[kind];
    const cells   = Math.ceil(plants * 1.25);          // spares for weak seedlings
    const trays   = Math.max(1, Math.ceil(cells / cell.per));
    const k = startKey(bed.id, seg.id);
    const st = state.starts[k] || {};
    out.push({ key:k, bed, seg, crop:c, label:seg.variety || c.name,
      season: seg.season, target, sowFrom, sowTo, harden,
      plants, cells, trays, cell, kind, pot:cell.pot,
      status: st.status || 'planned', sownOn: st.sownOn || null,
      weeks });
  });
  return out.sort((a,b) => a.sowFrom - b.sowFrom);
}

const STATUS = [
  ['planned',     'Not started'],
  ['sown',        'Sown'],
  ['potted',      'Potted up'],
  ['hardening',   'Hardening off'],
  ['transplanted','In the ground'],
];
function statusLabel(s){ const f=STATUS.find(x=>x[0]===s); return f?f[1]:s; }

function greenhouseTotals(batches) {
  const live = batches.filter(b => b.status!=='transplanted');
  const byKind = {};
  live.forEach(b => {
    byKind[b.kind] = byKind[b.kind] || { kind:b.kind, cell:b.cell, cells:0, trays:0 };
    byKind[b.kind].cells += b.cells;
  });
  Object.values(byKind).forEach(k => k.trays = Math.max(1, Math.ceil(k.cells / k.cell.per)));
  const trays = Object.values(byKind).reduce((a,k)=>a+k.trays,0);
  const mix = Object.values(byKind).reduce((a,k)=>a+k.trays*k.cell.mix,0);
  return { live, byKind:Object.values(byKind), trays, mix,
    cells: live.reduce((a,b)=>a+b.cells,0) };
}

// ---------------------------------------------------------------------------
function greenhouseView() {
  const all = allBatches();
  const batches = all.filter(b => !b.season || b.season === state.gardenSeason);
  if (!batches.length) return `<div class="wrap">
    <div class="eyebrow">Greenhouse</div>
    <div class="card"><div class="empty">Nothing in this plan needs starting under cover, or no garden has been generated yet. Tomatoes, peppers, and the brassicas are the usual ones.</div></div></div>`;

  if (!batches.length) return `<div class="wrap">
    <div class="eyebrow">Greenhouse</div>
    ${greenhouseSvg()}
    ${ghAddForm()}
    <div class="seasonbar">
      <span class="sb-l">Showing</span>
      ${['spring','fall'].map(s=>`<button class="sbtn ${state.gardenSeason===s?'on':''}" data-gseason="${s}">
        ${s==='spring'?'Spring into summer':'Late summer into fall'} <i>${all.filter(b=>b.season===s).length}</i></button>`).join('')}
    </div>
    <div class="card"><div class="empty">Nothing to start under cover for this season. Everything planted now goes straight in the ground.</div></div></div>`;
  const t = greenhouseTotals(batches);
  const due = batches.filter(b => b.status==='planned' && dayDiff(b.sowTo, TODAY) >= 0 && dayDiff(b.sowFrom, TODAY) <= 0);
  const soon = batches.filter(b => b.status==='planned' && dayDiff(b.sowFrom, TODAY) > 0 && dayDiff(b.sowFrom, TODAY) <= 21);
  const late = batches.filter(b => b.status==='planned' && dayDiff(b.sowTo, TODAY) < 0);

  const card = b => {
    const away = dayDiff(b.sowFrom, TODAY);
    const shut = dayDiff(b.sowTo, TODAY);
    const toSet = dayDiff(b.target, TODAY);
    return `<div class="gh ${b.status}">
      <div class="gh-top">
        <div>
          <div class="gh-n">${esc(b.label)}</div>
          <div class="gh-s">${esc(b.bed.name)} &middot; ${b.seg.ft} ft &middot; ${esc(b.season||'')}</div>
        </div>
        <div class="gh-badge ${b.status}">${esc(statusLabel(b.status))}</div>
      </div>
      <div class="gh-nums">
        <div><span class="cl">Sow indoors</span><b>${fmtU(b.sowFrom)}</b><i>to ${fmtU(b.sowTo)}</i></div>
        <div><span class="cl">Cells</span><b>${b.cells}</b><i>${b.plants} to set out</i></div>
        <div><span class="cl">Trays</span><b>${b.trays}</b><i>${esc(b.cell.n)}</i></div>
        <div><span class="cl">Harden off</span><b>${fmtU(b.harden)}</b><i>${Math.min(b.weeks[0],b.weeks[1])} to ${Math.max(b.weeks[0],b.weeks[1])} wk under cover</i></div>
        <div><span class="cl">Set out</span><b>${fmtU(b.target)}</b><i>${toSet>=0?`in ${plural(toSet,'day')}`:`${-toSet}d ago`}</i></div>
      </div>
      ${b.sownOn?`<div class="gh-note">Sown ${fmtU(new Date(b.sownOn))} &middot; day ${dayDiff(TODAY,new Date(b.sownOn))} under cover${b.pot?'. Pot up once the first true leaves are out.':''}</div>`:''}
      <div class="gh-acts">
        ${STATUS.map(([s,l])=>`<button class="ghb ${b.status===s?'on':''}" data-ghstat="${b.key}|${s}">${esc(l)}</button>`).join('')}
      </div>
      ${b.status==='hardening'?`<div class="gh-tip">Seven to ten days outside in increasing sun and wind before it goes in. Skipping this checks the plant for weeks.</div>`:''}
      ${b.status==='transplanted'?'':`<div class="gh-tip">${
        shut<0 ? `Sowing window shut ${-shut} days ago. Start now and it goes out late, or buy starts.`
        : away>0 ? `Opens in ${plural(away,'day')}.`
        : `In window now, ${plural(shut,'day')} left to sow.`}</div>`}
    </div>`;
  };

  const counts = s => all.filter(b => b.season===s).length;
  return `<div class="wrap">
    <div class="eyebrow">Greenhouse</div>
    ${greenhouseSvg()}
    ${ghAddForm()}
    ${counts('spring')||counts('fall')?`<div class="seasonbar">
      <span class="sb-l">Showing</span>
      ${['spring','fall'].map(s=>`<button class="sbtn ${state.gardenSeason===s?'on':''}" data-gseason="${s}">
        ${s==='spring'?'Spring into summer':'Late summer into fall'} <i>${counts(s)}</i></button>`).join('')}
      <span class="sb-n">Starts are counted back from each transplant date, so the two seasons run on different clocks.</span>
    </div>`:''}
    <div class="totals">
      <div><span class="tl2">Batches under cover</span><b>${t.live.length}</b></div>
      <div><span class="tl2">Cells needed</span><b>${t.cells}</b></div>
      <div><span class="tl2">Trays</span><b>${t.trays}</b></div>
      <div><span class="tl2">Starting mix</span><b>${t.mix.toFixed(1)}<i>cu ft</i></b></div>
    </div>
    <div class="hint" style="margin:0 0 16px">Cell counts include a quarter over for weak seedlings. Indoor time never competes for bed space, but it sets the clock: every transplant date in the plan is counted back from here.</div>

    ${late.length?`<div class="chk warn">
      <div class="chk-h">${plural(late.length,'batch')} past the sowing window</div>
      <div class="chk-b">${late.map(b=>esc(b.label)).join(', ')}. Start now and they set out late, which eats into the harvest. Buying starts is usually the better call this far along.</div>
    </div>`:''}

    ${due.length?`<div class="eyebrow">Sow now <em>${due.length}</em></div>${due.map(card).join('')}`:''}
    ${soon.length?`<div class="eyebrow">Coming up <em>${soon.length}</em></div>${soon.map(card).join('')}`:''}

    ${(() => {
      const rest = batches.filter(b => due.indexOf(b)<0 && soon.indexOf(b)<0);
      return rest.length?`<div class="eyebrow">Everything else <em>${rest.length}</em></div>${rest.map(card).join('')}`:'';
    })()}

    <div class="eyebrow">What to buy for the greenhouse</div>
    <div class="card">${t.byKind.map(k=>`
      <div class="row"><div>
        <div class="row-name">${esc(k.cell.n)}</div>
        <div class="row-note">${k.cells} cells needed${k.cell.pot?' &middot; these want potting up into 4 in pots partway through':''}</div>
      </div><div class="row-right"><span class="buyqty">${k.trays} <i>${k.trays===1?'tray':'trays'}</i></span></div></div>`).join('')}
      <div class="row"><div>
        <div class="row-name">Seed starting mix</div>
        <div class="row-note">Sterile fine mix, not garden soil and not potting soil. Damping off starts with the wrong medium.</div>
      </div><div class="row-right"><span class="buyqty">${t.mix.toFixed(1)} <i>cu ft</i></span></div></div>
    </div>
    <div class="hint">A fan on the seedlings is worth more than a heat mat once they are up. Moving air is the single best thing against damping off and it stiffens the stems.</div>
  </div>`;
}

// ---- start a tray by hand ------------------------------------------------
function ghAddForm() {
  const d = state.trayDraft || {};
  const c = cropById(d.cropId || 'tomato');
  const cell = CELL[c ? cellKind(c) : 'small'];
  const cells = +d.cells || 24;
  const wk = (c && c.indoor) ? (c.indoor[0]+c.indoor[1])/2 : 5;
  const out = shift(TODAY, Math.round(wk*7));

  if (!state.trayOpen) return `<div class="ghadd-bar">
    <button class="btn" data-act="trayopen">Start a tray</button>
    <span class="ghadd-n">For anything not in the plan: extras to give away, a variety you want to try, or a replacement for a batch that failed.</span>
  </div>`;

  return `<div class="drafter">
    <div class="drafter-head">Start a tray <span>${esc(cell.n)}</span></div>
    <div class="field-row">
      <div style="flex:2"><label>Crop</label>
        <select data-tray="cropId">${CROPS.filter(x=>x.dtm<400).map(x=>
          `<option value="${x.id}" ${(d.cropId||'tomato')===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div style="flex:2"><label>Variety, if you like</label>
        <input data-tray="variety" value="${esc(d.variety||'')}" placeholder="${esc(c?c.name:'')}"></div>
      <div><label>Cells</label>
        <div class="stepper"><button data-traystep="-6">&minus;</button>
          <input type="number" min="1" max="500" data-tray="cells" value="${cells}">
          <button data-traystep="6">+</button></div></div>
    </div>
    <div class="calc">
      <div><span class="cl">Trays</span><b>${Math.max(1,Math.ceil(cells/cell.per))}</b></div>
      <div><span class="cl">Plants after culls</span><b>${Math.floor(cells/1.25)}</b></div>
      <div><span class="cl">Ready to set out</span><b>${fmtU(out)}</b></div>
      <div><span class="cl">Weeks under cover</span><b>${wk}</b></div>
    </div>
    <div class="drafter-actions">
      <button class="btn" data-act="traysave">Sow it today</button>
      <button class="btn-ghost" data-act="trayclose">Cancel</button>
    </div>
  </div>`;
}

// ===========================================================================
// THE GREENHOUSE AS A PLACE
// Trays sit on benches by stage. Open the door and you see what is in there.
// Batches come from two sources: the garden plan works them out for you, and
// you can start a tray by hand for anything else.
// ===========================================================================

// a tray started by hand, not derived from the plan
function manualBatches() {
  return (state.trays || []).map(t => {
    const c = cropById(t.cropId);
    if (!c) return null;
    const sown = t.sownOn ? new Date(t.sownOn) : TODAY;
    const wk = c.indoor ? (c.indoor[0] + c.indoor[1]) / 2 : 5;
    const target = t.targetOn ? new Date(t.targetOn) : shift(sown, Math.round(wk * 7));
    const kind = cellKind(c), cell = CELL[kind];
    const cells = t.cells || 24;
    return { key: 'tray:' + t.id, manual: true, id: t.id,
      bed: { id: null, name: t.dest || 'No bed chosen' }, seg: { ft: 0 },
      crop: c, label: t.variety || c.name, season: t.season || state.gardenSeason,
      target, sowFrom: sown, sowTo: shift(sown, 14), harden: shift(target, -10),
      plants: Math.floor(cells / 1.25), cells, trays: Math.max(1, Math.ceil(cells / cell.per)),
      cell, kind, pot: cell.pot, status: t.status || 'sown', sownOn: t.sownOn || TODAY.toISOString(),
      weeks: c.indoor || [6, 4] };
  }).filter(Boolean);
}
function allBatches() {
  return startBatches().concat(manualBatches())
    .sort((a, b) => a.sowFrom - b.sowFrom);
}

// which bench a batch is standing on
function benchOf(b) {
  if (b.status === 'transplanted') return 'out';
  if (b.status === 'hardening') return 'harden';
  if (b.status === 'potted') return 'growing';
  if (b.status === 'sown') return 'germ';
  return 'waiting';
}
const BENCHES = [
  { k:'waiting',  n:'Not started',    d:'Empty cells waiting on a sowing date' },
  { k:'germ',     n:'Sown',           d:'Under cover, coming up' },
  { k:'growing',  n:'Growing on',     d:'True leaves out, potted up where needed' },
  { k:'harden',   n:'Hardening off',  d:'Outside the door, toughening up' },
];

// ---- one tray, drawn ----------------------------------------------------
function trayGlyph(b, w, h) {
  const cols = Math.min(8, Math.max(3, Math.round(Math.sqrt(b.cells * 1.6))));
  const rows = Math.max(2, Math.ceil(Math.min(b.cells, 40) / cols));
  const pad = 2.2, cw = (w - pad*2) / cols, ch = (h - pad*2) / rows;
  const col = famColor(b.crop.fam, 1);
  let cells = '';
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    const x = pad + c*cw, y = pad + r*ch;
    cells += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(cw-0.7).toFixed(1)}"
      height="${(ch-0.7).toFixed(1)}" fill="var(--steel)" stroke="var(--rule)" stroke-width=".4"/>`;
    if (b.status !== 'waiting') {
      const s = b.status === 'sown' ? 0.9 : b.status === 'potted' ? 1.6 : 2.1;
      cells += `<circle cx="${(x+cw/2-0.35).toFixed(1)}" cy="${(y+ch/2-0.35).toFixed(1)}"
        r="${s}" fill="${col}"/>`;
      if (b.status === 'hardening' || b.status === 'potted')
        cells += `<path d="M${(x+cw/2-0.35).toFixed(1)} ${(y+ch/2-0.35).toFixed(1)} l-2 -2 M${(x+cw/2-0.35).toFixed(1)} ${(y+ch/2-0.35).toFixed(1)} l2 -2"
          stroke="${col}" stroke-width=".7" fill="none"/>`;
    }
  }
  return `<rect width="${w}" height="${h}" rx="1.5" fill="var(--steel-3)" stroke="var(--rule)"/>${cells}`;
}

// ---- the house ----------------------------------------------------------
function greenhouseSvg() {
  const batches = allBatches().filter(b => b.status !== 'transplanted');
  const W = 720, H = 330;
  const open = !!state.ghOpen;
  const groups = {};
  BENCHES.forEach(x => groups[x.k] = []);
  batches.forEach(b => { const g = benchOf(b); if (groups[g]) groups[g].push(b); });

  // frame
  const L = 90, R = 560, EAVE = 150, RIDGE = 74, FLOOR = 274;
  let s = '';
  s += `<path d="M${L} ${FLOOR} V${EAVE} L${(L+R)/2} ${RIDGE} L${R} ${EAVE} V${FLOOR} Z"
    fill="var(--steel-2)" stroke="var(--rule)" stroke-width="1.6"/>`;
  // glazing bars
  for (let x=L+52; x<R; x+=52)
    s += `<line x1="${x}" y1="${FLOOR}" x2="${x}" y2="${EAVE}" stroke="var(--rule)" stroke-width=".7" opacity=".65"/>`;
  s += `<line x1="${L}" y1="${EAVE}" x2="${R}" y2="${EAVE}" stroke="var(--rule)" stroke-width=".9"/>`;
  for (let i=1;i<4;i++){
    const t=i/4, mx=(L+R)/2;
    s += `<line x1="${(L+(mx-L)*t).toFixed(0)}" y1="${(EAVE-(EAVE-RIDGE)*t).toFixed(0)}"
      x2="${(L+(mx-L)*t).toFixed(0)}" y2="${EAVE}" stroke="var(--rule)" stroke-width=".6" opacity=".5"/>`;
    s += `<line x1="${(R-(R-mx)*t).toFixed(0)}" y1="${(EAVE-(EAVE-RIDGE)*t).toFixed(0)}"
      x2="${(R-(R-mx)*t).toFixed(0)}" y2="${EAVE}" stroke="var(--rule)" stroke-width=".6" opacity=".5"/>`;
  }
  // ground line
  s += `<line x1="${L-40}" y1="${FLOOR}" x2="${R+140}" y2="${FLOOR}" stroke="var(--muted)" stroke-width="1.2"/>`;

  // benches inside
  if (open) {
    const zones = [
      { k:'waiting', x:L+16,  y:FLOOR-92, w:142 },
      { k:'germ',    x:L+172, y:FLOOR-92, w:142 },
      { k:'growing', x:L+328, y:FLOOR-92, w:142 },
    ];
    zones.forEach(z => {
      const list = groups[z.k];
      s += `<line x1="${z.x}" y1="${FLOOR-26}" x2="${z.x+z.w}" y2="${FLOOR-26}"
        stroke="var(--rule)" stroke-width="2"/>`;
      s += `<line x1="${z.x+8}" y1="${FLOOR-26}" x2="${z.x+8}" y2="${FLOOR}" stroke="var(--rule)" stroke-width="1"/>`;
      s += `<line x1="${z.x+z.w-8}" y1="${FLOOR-26}" x2="${z.x+z.w-8}" y2="${FLOOR}" stroke="var(--rule)" stroke-width="1"/>`;
      s += `<text x="${z.x+z.w/2}" y="${FLOOR-100}" class="gh-zone" text-anchor="middle">${
        esc(BENCHES.find(b=>b.k===z.k).n)}${list.length?` (${list.length})`:''}</text>`;
      if (!list.length) {
        s += `<text x="${z.x+z.w/2}" y="${FLOOR-44}" class="gh-empty-l" text-anchor="middle">empty</text>`;
      } else {
        const per = Math.min(list.length, 4);
        const tw = Math.min(40, (z.w-20)/per - 4), th = 30;
        list.slice(0,4).forEach((b,i) => {
          const tx = z.x + 10 + i*(tw+5), ty = FLOOR-26-th;
          s += `<g class="tray" data-btray="${esc(b.key)}" transform="translate(${tx.toFixed(1)},${ty})">
            ${trayGlyph(b, tw, th)}
            <title>${esc(b.label)} - ${b.cells} cells - ${esc(statusLabel(b.status))}</title></g>`;
        });
        if (list.length>4) s += `<text x="${z.x+z.w-6}" y="${FLOOR-34}" class="gh-empty-l" text-anchor="end">+${list.length-4}</text>`;
      }
    });
  }

  // doors
  const DW = 46, DX = (L+R)/2 - DW/2, DTOP = FLOOR-96;
  const swing = open ? 'gh-door-open' : '';
  s += `<g class="ghdoors ${swing}" data-act="ghtoggle" style="cursor:pointer">
    <g class="ghdoor ghdoor-l">
      <rect x="${DX}" y="${DTOP}" width="${DW/2}" height="${FLOOR-DTOP}"
        fill="var(--steel-3)" stroke="var(--rule)" stroke-width="1.2"/>
      <circle cx="${DX+DW/2-5}" cy="${FLOOR-50}" r="1.8" fill="var(--tag)"/>
    </g>
    <g class="ghdoor ghdoor-r">
      <rect x="${DX+DW/2}" y="${DTOP}" width="${DW/2}" height="${FLOOR-DTOP}"
        fill="var(--steel-3)" stroke="var(--rule)" stroke-width="1.2"/>
      <circle cx="${DX+DW/2+5}" cy="${FLOOR-50}" r="1.8" fill="var(--tag)"/>
    </g>
  </g>`;
  if (!open) s += `<text x="${(L+R)/2}" y="${FLOOR+20}" class="gh-hint" text-anchor="middle">tap the door</text>`;

  // hardening off, outside to the right
  const hz = groups.harden;
  s += `<text x="${R+70}" y="${FLOOR-96}" class="gh-zone" text-anchor="middle">Hardening off${hz.length?` (${hz.length})`:''}</text>`;
  s += `<rect x="${R+22}" y="${FLOOR-40}" width="96" height="40" fill="none"
    stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/>`;
  if (!hz.length) s += `<text x="${R+70}" y="${FLOOR-16}" class="gh-empty-l" text-anchor="middle">nothing outside</text>`;
  else hz.slice(0,3).forEach((b,i) => {
    s += `<g class="tray" data-btray="${esc(b.key)}" transform="translate(${R+28+i*30},${FLOOR-36})">
      ${trayGlyph(b, 26, 30)}<title>${esc(b.label)}</title></g>`;
  });

  return `<svg class="ghsvg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

// ===========================================================================
// ROW GEOMETRY
// A crop's row spacing is the gap between two rows OF THAT CROP. Between two
// different crops neither number applies on its own. Each row claims half its
// requirement either side of its centreline, so the gap between a 30 in crop
// and a 12 in crop is 15 + 6 = 21 in.
//
// From those half widths we can lay out real centreline positions across the
// plot, which is what you actually need when pulling a string line.
// ===========================================================================

function inFt(inches) {
  const ft = Math.floor(inches/12), i = Math.round(inches - ft*12);
  if (i === 12) return `${ft+1}'0"`;
  return ft ? `${ft}'${i}"` : `${i}"`;
}

// widest requirement in a row decides that row's claim
function rowNeedIn(bed) {
  let need = 0;
  bedSegs(bed).forEach(s => {
    const c = cropById(s.cropId); if (!c) return;
    need = Math.max(need, c.rsp || 18);
  });
  return need || 18;
}

// centrelines measured from the edge of the plot
// gap = half of this row + walkway + half of the next
function walkIn() { return state.plot.walk == null ? 24 : state.plot.walk; }

// A row you can reach across without standing in it. Beyond this a row needs
// its own path on both sides.
const REACH_IN = 30;

function rowPlan(optOverride) {
  const opt = optOverride !== undefined ? optOverride : state.rowOpt;
  const edgeIn = (state.plot.edge || 0) * 12;
  const walk = opt && opt.walk != null ? opt.walk : walkIn();
  const every = opt && opt.pathEvery ? opt.pathEvery : 1;

  let rows = state.beds.filter(b => bedSegs(b).length).map(b => ({
    bed: b, needIn: rowNeedIn(b), halfIn: rowNeedIn(b)/2,
  }));
  if (opt && opt.order) {
    const pos = {};
    opt.order.forEach((id, i) => pos[id] = i);
    rows = rows.slice().sort((a,b) =>
      (pos[a.bed.id] == null ? 999 : pos[a.bed.id]) - (pos[b.bed.id] == null ? 999 : pos[b.bed.id]));
  }

  // Pair adjacent rows greedily where both are shallow enough to reach across.
  // A pair shares the paths on either side of it, so it needs no path between.
  // Greedy beats a fixed every-nth rule because it takes every pair available.
  const paired = new Array(rows.length).fill(false);
  if (every > 1) {
    let run = 0;
    for (let i = 0; i < rows.length-1; i++) {
      if (paired[i]) continue;
      if (run >= every-1) { run = 0; continue; }
      if (rows[i].needIn <= REACH_IN && rows[i+1].needIn <= REACH_IN) {
        paired[i] = true; run++; i++;      // skip the partner
      } else run = 0;
    }
  }
  const pathAfter = i => (i >= rows.length-1) ? null : (paired[i] ? 0 : walk);

  let cursor = edgeIn;
  rows.forEach((r, i) => {
    if (i === 0) cursor += r.halfIn;
    else cursor += rows[i-1].halfIn + (pathAfter(i-1) || 0) + r.halfIn;
    r.centreIn = cursor;
    r.centreFt = cursor/12;
  });
  rows.forEach((r, i) => {
    r.walkIn = pathAfter(i) == null ? walk : pathAfter(i);
    r.paired = pathAfter(i) === 0;
    r.gapToNextIn = i < rows.length-1 ? (r.halfIn + (pathAfter(i)||0) + rows[i+1].halfIn) : null;
    r.nextHalfIn = i < rows.length-1 ? rows[i+1].halfIn : null;
    r.nextBed = i < rows.length-1 ? rows[i+1].bed : null;
  });
  const last = rows[rows.length-1];
  const totalIn = last ? last.centreIn + last.halfIn + edgeIn : edgeIn*2;
  const haveIn = (state.plot.w || 0) * 12;
  const walkTotalIn = rows.slice(0,-1).reduce((a,x)=>a+(x.walkIn||0),0);
  const paths = rows.slice(0,-1).filter(x=>!x.paired).length;
  return { rows, totalIn, totalFt: totalIn/12, haveIn, haveFt: haveIn/12, walk, paths,
    every, walkTotalFt: walkTotalIn/12,
    fits: totalIn <= haveIn, overIn: Math.max(0, totalIn - haveIn) };
}

      return `<div class="rowline">

          <div class="rl-crops">${crops.map(c=>

        </div>

          ${r.gapToNextIn!=null
            ? `<b>${Math.round(r.gapToNextIn)}"</b><i>to row ${i+2}</i>
               <span class="rl-math">${Math.round(r.halfIn)} + ${r.walkIn} walk + ${Math.round(r.nextHalfIn)}</span>`
            : `<i>last row</i>`}
        </div>
      </div>`;}).join('')}</div>
    <div class="hint">The crop marked with a dot is the one setting that row's width. Where a row carries several crops, the widest wins, because the string line has to clear all of them.</div>
  </div>`;
}

// ===========================================================================
// OPTIMISER
// Row order does not change total width at all: the half widths cancel out of
// the arithmetic, so any ordering gives the same number. Paths are the whole
// lever. What order does affect is shade, so we still sort tall to short.
// ===========================================================================
function optimiseRows() {
  const base = rowPlan(null);
  const live = state.beds.filter(b => bedSegs(b).length);
  // Narrow rows first so the pairable ones end up adjacent, which is what
  // actually buys width. It also stacks the tall crops at one end, so orient
  // that end north and nothing shades anything.
  const order = live.slice().sort((a,b) => rowNeedIn(a) - rowNeedIn(b)).map(b => b.id);

  const tries = [];
  [1,2,3].forEach(every => [24,18,12].forEach(walk => {
    [null, order].forEach(ord => {
      const cfg = { pathEvery:every, walk, order:ord };
      const p = rowPlan(cfg);
      tries.push({ cfg, ft:p.totalFt, fits:p.fits, paths:p.paths,
        pairs: p.rows.filter(x=>x.paired).length, sorted: !!ord });
    });
  }));
  // the most generous setup that still fits, else simply the narrowest
  const fitting = tries.filter(t => t.fits)
    .sort((a,b) => b.cfg.walk - a.cfg.walk || a.cfg.pathEvery - b.cfg.pathEvery);
  const best = fitting[0] || tries.slice()
    .sort((a,b) => a.ft - b.ft || b.cfg.walk - a.cfg.walk)[0];

  // what is actually eating the width, in case nothing fits
  const hogs = live.map(b => ({ bed:b, needIn:rowNeedIn(b),
      crops: bedSegs(b).map(s => (cropById(s.cropId)||{}).name).filter(Boolean) }))
    .sort((a,b) => b.needIn - a.needIn).slice(0, 4);

  return { base, best, tries, order, hogs, fits: !!fitting.length };
}

const FAM_GLYPH = {
  Nightshade:'tomato', Cucurbit:'sqsummer', Legume:'beanbush', Brassica:'cabbage',
  Umbel:'carrot', Amaranth:'beet', Aster:'lettuce', Allium:'onion',
  Grass:'corn', Mallow:'okra', Mint:'basil', 'Morning glory':'sweetpotato', Rose:'strawberry',
};
function cropGlyph(crop, px, cls) {
  const d = GLYPH[crop.id] || GLYPH[FAM_GLYPH[crop.fam]] || GLYPH.lettuce;
  const s = px || 22;
  return `<svg class="glyph ${cls||''}" viewBox="0 0 24 24" width="${s}" height="${s}"
    fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true"><path d="${d}"/></svg>`;
}

// ===========================================================================
// SECTION TAGS
// A tag identifies a section, or a run of feet within a long section. The QR
// carries a URL so a stock phone camera works, but the app's own scanner
// reads the id straight out of it and works with no signal.
// ===========================================================================
const TAG_BASE = 'steadn.app/s/';
function segId(bedId, segId2) { return (bedId + segId2).replace(/[^a-z0-9]/gi,'').slice(0,12); }
function tagPayload(bedId, sId, ftFrom, ftTo) {
  const base = TAG_BASE + segId(bedId, sId);
  return (ftFrom != null) ? `${base}-${ftFrom}` : base;
}
function qrSvg(text, px) {
  const q = qrcode(0, 'M');           // level M survives a smudged tag
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), quiet = 3, total = n + quiet*2;
  let d = '';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++)
    if (q.isDark(r,c)) d += `M${c+quiet} ${r+quiet}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${total} ${total}" width="${px}" height="${px}" shape-rendering="crispEdges">
    <rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

// one tag per section, plus sub tags every N feet on long runs so a problem
// can be pinned to a place instead of the whole row
function tagsFor(bed, seg, subEvery) {
  const c = cropById(seg.cropId);
  const label = seg.variety || (c?c.name:'?');
  const out = [];
  const step = subEvery || 0;
  if (!step || seg.ft <= step) {
    out.push({ bed, seg, crop:c, label, from:null, to:null,
      payload:tagPayload(bed.id, seg.id), ft:seg.ft });
  } else {
    for (let f=0; f<seg.ft; f+=step) {
      const to = Math.min(seg.ft, f+step);
      out.push({ bed, seg, crop:c, label, from:f, to,
        payload:tagPayload(bed.id, seg.id, f), ft:to-f });
    }
  }
  return out;
}
function allTags() {
  const out = [];
  state.beds.forEach(b => b.segments.forEach(s => {
    tagsFor(b, s, state.tagSub).forEach(t => out.push(t));
  }));
  return out;
}
function findTag(payload) {
  const all = allTags();
  return all.find(t => t.payload === payload)
      // a section tag still resolves when sub tags are switched on
      || all.find(t => t.payload.indexOf(payload + '-') === 0)
      || null;
}
// pounds already logged against a section, whichever tag it came in on
function segHarvest(bedId, sId) {
  const base = tagPayload(bedId, sId);
  return (state.harvests||[])
    .filter(h => h.tag && (h.tag === base || h.tag.indexOf(base + '-') === 0))
    .reduce((a,h) => a + (+h.lb||0), 0);
}

// ---- container conversions, because nobody carries a scale to the row ----
const CONTAINERS = [
  {n:'Handful',        lb:0.5},
  {n:'Quart basket',   lb:1.5},
  {n:'Gallon bucket',  lb:6},
  {n:'Half bushel',    lb:22},
  {n:'5 gal bucket',   lb:25},
  {n:'Bushel',         lb:45},
];
// crop specific density, since a bushel of greens is not a bushel of potatoes
const DENSITY = { tomato:1, potato:1.2, sweetpotato:1.1, beanbush:.55, beanpole:.55,
  pea:.6, southernpea:.6, corn:.85, okra:.5, cucumber:1, sqsummer:.9, sqwinter:1,
  pumpkin:1, melon:1, carrot:1.1, beet:1.1, turnip:1, radish:.9, onion:1,
  garlic:.8, lettuce:.22, spinach:.22, kale:.25, collards:.25, chard:.3,
  cabbage:.9, broccoli:.5, cauliflower:.5, brussels:.6, arugula:.2, mustard:.25,
  kohlrabi:.9, pepper:.6, eggplant:.8, basil:.15, strawberry:.8 };
function containerLb(cropId, c) {
  const d = DENSITY[cropId] != null ? DENSITY[cropId] : 0.8;
  return Math.round(c.lb * d * 10) / 10;
}

// ===========================================================================
// PRINTABLE PLANTING PLAN
// One page you can take to the garden: what goes where, how far apart the
// plants sit, and how far apart the rows sit.
// ===========================================================================
function rowGap() { return layoutRowSpacing(); }

// does the layout give this crop the room between rows it actually wants?
function rowFit(crop) {
  const have = rowGap(), want = crop.rsp || 18;
  if (have >= want) return { ok:true, have, want };
  return { ok:false, have, want, ratio: want/have };
}

// top down map drawn to scale, black on white, using the computed centrelines
function printMapSvg() {
  const rp = rowPlan();
  if (!rp.rows.length) return '';
  const W = 760, PADL = 74, PADR = 86, PADT = 22, PADB = 32;
  const plotL = state.plot.l;
  const inner = W - PADL - PADR;
  const sx = inner / Math.max(1, plotL);
  const depthFt = Math.max(rp.totalFt, rp.haveFt);
  const H = Math.min(460, Math.max(160, depthFt * 9));
  const sy = H / Math.max(1, depthFt);
  const total = H + PADT + PADB + 12;

  let out = '';
  const edgeY = PADT + rp.haveFt * sy;
  // ground you actually have
  out += `<rect x="${PADL}" y="${PADT}" width="${plotL*sx}" height="${(rp.haveFt*sy).toFixed(1)}"
    fill="none" stroke="#111" stroke-width="1.2"/>`;
  // anything past it needs ground you do not have
  if (rp.totalFt > rp.haveFt) {
    out += `<rect x="${PADL}" y="${edgeY.toFixed(1)}" width="${plotL*sx}"
      height="${((rp.totalFt-rp.haveFt)*sy).toFixed(1)}" fill="#fafafa" stroke="#bbb"
      stroke-width=".8" stroke-dasharray="5 4"/>`;
    out += `<text x="${(PADL+4).toFixed(1)}" y="${(edgeY+13).toFixed(1)}" class="pm-w">BEYOND THE PLOT &mdash; ${(rp.totalFt-rp.haveFt).toFixed(1)} FT OF GROUND YOU DO NOT HAVE</text>`;
  }
  out += `<line x1="${PADL}" y1="${edgeY.toFixed(1)}" x2="${(PADL+plotL*sx).toFixed(1)}" y2="${edgeY.toFixed(1)}"
    stroke="#111" stroke-width="1.2"/>`;
  out += `<text x="${(PADL+plotL*sx+7).toFixed(1)}" y="${(edgeY-3).toFixed(1)}" class="pm-e">${rp.haveFt}FT EDGE</text>`;

  rp.rows.forEach((r, i) => {
    const y = PADT + r.centreFt * sy;
    const half = Math.max(3, (r.halfIn/12) * sy);
    // the band this row occupies
    out += `<rect x="${PADL}" y="${(y-half).toFixed(1)}" width="${(plotL*sx).toFixed(1)}"
      height="${(half*2).toFixed(1)}" fill="#f2f2f2" stroke="#ccc" stroke-width=".5"/>`;
    // the centre line itself
    out += `<line x1="${PADL}" y1="${y.toFixed(1)}" x2="${(PADL+plotL*sx).toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="#111" stroke-width=".7" stroke-dasharray="4 3"/>`;
    // crops along the run, each carrying its own numbers
    let at = 0;
    const twoLine = half >= 11;
    bedSegs(r.bed).forEach(s => {
      const c = cropById(s.cropId); if (!c) return;
      const x1 = PADL + at*sx, w = s.ft*sx;
      at += s.ft;
      out += `<line x1="${(x1+w).toFixed(1)}" y1="${(y-half).toFixed(1)}" x2="${(x1+w).toFixed(1)}"
        y2="${(y+half).toFixed(1)}" stroke="#999" stroke-width=".5"/>`;
      const name = esc((s.variety||c.name).slice(0, Math.floor(w/5.2)));
      const nums = `${segCount(s)} plants at ${s.sp}"`;
      if (w > 34) {
        if (twoLine) {
          out += `<text x="${(x1+4).toFixed(1)}" y="${(y-1).toFixed(1)}" class="pm-c">${name}</text>`;
          if (w > 62) out += `<text x="${(x1+4).toFixed(1)}" y="${(y+8).toFixed(1)}" class="pm-s">${nums}</text>`;
        } else if (half >= 7) {
          out += `<text x="${(x1+4).toFixed(1)}" y="${(y+3).toFixed(1)}" class="pm-c">${name}${
            w>110?` <tspan class="pm-s">${nums}</tspan>`:''}</text>`;
        } else {
          // band too shallow to letter inside, so caption it just above
          out += `<text x="${(x1+4).toFixed(1)}" y="${(y-half-3).toFixed(1)}" class="pm-c">${name}${
            w>110?` <tspan class="pm-s">${nums}</tspan>`:''}</text>`;
        }
      }
    });
    out += `<text x="${(PADL-6).toFixed(1)}" y="${(y+3).toFixed(1)}" class="pm-l" text-anchor="end">${inFt(r.centreIn)}</text>`;
    // this row's claimed width, off to the right
    out += `<text x="${(PADL+plotL*sx+7).toFixed(1)}" y="${(y-1).toFixed(1)}" class="pm-r">${r.needIn}" wide</text>`;
    if (r.gapToNextIn!=null)
      out += `<text x="${(PADL+plotL*sx+7).toFixed(1)}" y="${(y+8).toFixed(1)}" class="pm-s">+${r.walkIn}" path</text>`;
  });

  // scale bar below everything drawn
  const baseY = PADT + Math.max(rp.haveFt, rp.totalFt) * sy;
  const step = plotL > 60 ? 20 : 10;
  out += `<line x1="${PADL}" y1="${baseY.toFixed(1)}" x2="${(PADL+plotL*sx).toFixed(1)}"
    y2="${baseY.toFixed(1)}" stroke="#111" stroke-width=".7"/>`;
  for (let ft=0; ft<=plotL; ft+=step) {
    const x = PADL + ft*sx;
    out += `<line x1="${x.toFixed(1)}" y1="${baseY.toFixed(1)}" x2="${x.toFixed(1)}"
      y2="${(baseY+5).toFixed(1)}" stroke="#111" stroke-width=".7"/>`;
    out += `<text x="${x.toFixed(1)}" y="${(baseY+15).toFixed(1)}" class="pm-l" text-anchor="middle">${ft}</text>`;
  }
  out += `<text x="${(PADL+plotL*sx/2).toFixed(1)}" y="${total-3}" class="pm-l" text-anchor="middle">feet along the row &middot; left figures are distance from the top edge of the plot &middot; right figures are how wide that row needs to be</text>`;
  return `<svg class="pmap" viewBox="0 0 ${W} ${total}">${out}</svg>`;
}

function printPlanView() {
  if (!state.beds.length) return `<div class="wrap"><div class="card">
    <div class="empty">No beds yet. Build a garden first, then print the plan.</div></div></div>`;

  const st = PLOT_STYLES[state.plot.style] || PLOT_STYLES.rows;
  const gap = rowGap();
  const tight = [];
  allSegs().forEach(({seg}) => {
    const c = cropById(seg.cropId); if (!c) return;
    const f = rowFit(c);
    if (!f.ok && !tight.find(t=>t.crop.id===c.id)) tight.push({ crop:c, ...f });
  });
  tight.sort((a,b)=>b.ratio-a.ratio);

  const totals = gardenTotals();

  return `<div class="wrap noprint">
    <div class="eyebrow">Planting plan</div>
    <div class="drafter">
      <div class="drafter-head">Print it <span>${state.beds.length} beds \u00b7 ${totals.plants} plants</span></div>
      <div class="filters">
        <button class="chip ${state.printQr?'on':''}" data-act="toggleprintqr">Include tag codes</button>
        <button class="chip ${state.printNotes?'on':''}" data-act="toggleprintnotes">Include depth and feeding</button>
      </div>
      <div class="drafter-actions">
        <button class="btn" data-act="doprint">Print</button>
        <span class="ackhint">Prints black on white. Set your browser to letter, portrait.</span>
      </div>
    </div>

    ${tight.length?`<div class="chk warn">
      <div class="chk-h">${tight.length===1?'One crop wants':plural(tight.length,'crop')+' want'} more room than this layout's default pitch</div>
      <div class="chk-b">${esc(st.n)} sets rows <b>${gap} in</b> apart as a default. The row positions below work out the real gaps from each crop's own requirement, so use those numbers when you mark out. These are the crops driving the width.</div>
      ${tight.map(t=>`<div class="cutline">
        <span class="cu-n">${esc(t.crop.name)}</span>
        <span class="cu-d">wants ${t.want} in between rows, this layout gives ${t.have} in</span>
      </div>`).join('')}
    </div>`:`<div class="chk ok">
      <div class="chk-h">Row spacing works</div>
      <div class="chk-b">${esc(st.n)} gives ${gap} in between rows, which suits everything in the plan.</div>
    </div>`}
  </div>

  ${rowLayoutView()}

  <div class="sheetpage" id="printarea">
    <div class="pp-head">
      <div>
        <div class="pp-title">Planting plan</div>
        <div class="pp-sub">${state.gardenSeason==='fall'?'Late summer into fall':'Spring into summer'} \u00b7 ${state.plot.l} \u00d7 ${state.plot.w} ft \u00b7 ${esc(st.n)} \u00b7 zone ${esc(state.place.zone)}${state.place.near?` \u00b7 ${esc(state.place.near)}`:''}</div>
      </div>
      <div class="pp-meta">
        <div>${fmtU(TODAY)}</div>
        <div>${totals.plants} plants \u00b7 ${totals.ft} row ft</div>
        <div>rows ${gap} in apart</div>
      </div>
    </div>

    ${printMapSvg()}

    ${state.beds.map(b=>{
      const used = bedUsed(b);
      return `<div class="pp-bed">
        <div class="pp-bedhead">
          <span class="pp-bn">${esc(b.name)}</span>
          <span class="pp-bd">${b.len} ft long \u00b7 ${used%1?used.toFixed(1):used} ft planted \u00b7 ${(b.len-used).toFixed(1)} ft open</span>
        </div>
        ${(()=>{ const rp=rowPlan(); const r=rp.rows.find(x=>x.bed.id===b.id); if(!r) return '';
          return `<div class="pp-pos">
            <span>Centre line <b>${inFt(r.centreIn)}</b> from the edge of the plot</span>
            ${r.gapToNextIn!=null?`<span>Next row <b>${Math.round(r.gapToNextIn)}"</b> further across
              <i>(${Math.round(r.halfIn)}" half of this row + ${r.walkIn}" walkway + ${Math.round(r.nextHalfIn)}" half of the next)</i></span>`
              :`<span>Last row of the plot</span>`}
          </div>`; })()}
        <table class="pp-tbl">
          <thead><tr>
            <th class="w-run">Run</th>
            <th class="w-ico"></th>
            <th>Crop</th>
            <th class="num">Plants<br><i>apart</i></th>
            <th class="num">Wants<br><i>row gap</i></th>
            <th class="num">Plants</th>
            <th class="num">Sow or set</th>
            ${state.printNotes?'<th class="num">Depth</th><th>First feeding</th>':''}
            ${state.printQr?'<th class="w-qr">Tag</th>':''}
          </tr></thead>
          <tbody>${(()=>{ let at=0; return bedSegs(b).map(s=>{
            const c=cropById(s.cropId); if(!c) return '';
            const from=at, to=at+s.ft; at=to;
            const f=rowFit(c);
            const feed=(c.feed||[])[0];
            return `<tr>
              <td class="w-run">${from % 1 ? from.toFixed(1) : from}\u2013${to % 1 ? to.toFixed(1) : to} ft</td>
              <td class="w-ico">${cropGlyph(c, 24)}</td>
              <td><b>${esc(s.variety||c.name)}</b>${s.variety?`<i class="pp-c"> ${esc(c.name)}</i>`:''}
                  <i class="pp-c">${esc(c.fam)}${s.planted?` \u00b7 planted ${fmtU(new Date(s.planted))}`:''}</i></td>
              <td class="num"><b>${s.sp}"</b></td>
              <td class="num"><b>${c.rsp}"</b></td>
              <td class="num"><b>${segCount(s)}</b></td>
              <td class="num">${s.plantOn?`<b>${fmtU(new Date(s.plantOn))}</b><i class="pp-c">${esc(s.season||'')}</i>`:'&mdash;'}</td>
              ${state.printNotes?`<td class="num">${esc(c.depth)}</td><td class="pp-feed">${feed?esc(feed.do):'\u2014'}</td>`:''}
              ${state.printQr?`<td class="w-qr">${qrSvg(tagPayload(b.id,s.id),52)}</td>`:''}
            </tr>`;}).join(''); })()}</tbody>
        </table>
      </div>`;}).join('')}

    <div class="pp-foot">
      Plants apart is measured along the row. Wants row gap is what that crop asks for between two rows of itself.
      The measured gap on each bed header is the real one: half of this row's requirement, plus the walkway, plus half of the next row's.
      ${tight.length?`Marked figures are wider than this layout provides, so those rows will be crowded.`:''}
      Generated by SteadN from zone ${esc(state.place.zone)} frost dates. Spacings are standard guidance, not a rule; your soil and your season shift them.
    </div>
  </div>`;
}

function harvestTotals() {
  const m = {};
  state.harvests.forEach(h => { m[h.cropId] = (m[h.cropId]||0) + (+h.lb||0); });
  return m;
}
function projectedYield() {
  const m = {};
  allSegs().forEach(({seg}) => { m[seg.cropId] = (m[seg.cropId]||0) + segYield(seg); });
  return m;
}
function pantryTotal(cid){ return state.pantry[cid] || 0; }

function adjTimes(r) {
  const ft = elevation();
  if (r.m === 'bath') {
    const add = bathAdd(ft);
    return { add, pt: r.pt?r.pt+add:null, qt: r.qt?r.qt+add:null,
             dial:null, weight:null };
  }
  return { add:0, pt:r.pt, qt:r.qt, dial:dialPsi(ft), weight:weightPsi(ft) };
}

    const segs = bedSegs(b);

    const rows = segs.map(s => {
      const c = cropById(s.cropId);
      const got = segHarvest(b.id, s.id);
      const exp = segYield(s);
      const pct = exp ? Math.min(100, got/exp*100) : 0;
      return `<button class="seg pickseg" data-opentag="${esc(tagPayload(b.id, s.id))}"
          style="flex:${s.ft}; background:${famColor(c?c.fam:'', got>0?0.85:0.5)}"

        <span class="seg-meta">${got>0?`${got.toFixed(1)} lb`:`${s.ft} ft`}</span>
        ${exp?`<span class="seg-prog"><i style="width:${pct.toFixed(0)}%"></i></span>`:''}

      ${state.beds.map(pickBar).join('')}

const CHORES = [
{id:'ch-water',   g:'chicken',n:'Scrub and refill waterers',   every:7,  why:'Biofilm builds fast in warm weather and carries most of what makes a flock sick.'},
{id:'ch-mite',    g:'chicken',n:'Night mite check',            every:30, why:'Check after dark at the vent and under wings. Red roost mites only feed at night.'},
{id:'ch-oyster',  g:'chicken',n:'Top up oyster shell',         every:14, why:'Free choice and separate from feed. Shell quality drops within days of running out.'},
{id:'ch-coop',    g:'chicken',n:'Deep clean the coop',         every:30, why:'If it stings your nose at bird height, the ammonia is already damaging their airways.'},
{id:'ch-nest',    g:'chicken',n:'Fresh nest box bedding',      every:14, why:'Clean boxes mean clean eggs and fewer hens laying somewhere else.'},
{id:'ch-famacha', g:'goat',   n:'FAMACHA eyelid check',        every:14, why:'Pale lower lids mean anemia from barber pole worm. This catches it before bottle jaw.'},
{id:'ch-hoof',    g:'goat',   n:'Trim hooves',                 every:49, why:'Overgrowth is what starts hoof rot. Every six to eight weeks, all of them.'},
{id:'ch-gmineral',g:'goat',   n:'Check loose mineral',         every:14, why:'Goat specific, loose not block. Empty feeders are how copper deficiency starts.'},
{id:'ch-fecal',   g:'goat',   n:'Fecal egg count',             every:90, why:'Test before you deworm. Calendar deworming is what created the resistance problem.'},
{id:'ch-udder',   g:'goat',   n:'Udder and teat check',        every:7,  why:'Catching mastitis in the first day is the difference between treatment and losing a half.'},
];
function choresDue() {
  if (!ANIMALS) return [];
  const out = [];
  CHORES.forEach(ch => {
    if (ch.g==='chicken' && !state.keeps.chickens) return;
    if (ch.g==='goat' && !state.keeps.goats) return;
    const last = state.chores[ch.id] ? new Date(state.chores[ch.id]) : null;
    const due = last ? shift(last, ch.every) : TODAY;
    out.push({ ...ch, last, due, away: dayDiff(due, TODAY) });
  });
  return out.sort((a,b)=>a.away-b.away);
}

function allTodos() {
  const out = [];
  gardenTasks().forEach(t => out.push({
    key:`g:${t.bed.id}:${t.seg.id}:${t.type}:${t.date.toISOString().slice(0,10)}`,
    away:t.away, date:t.date, kind:t.type, area:'Garden',
    title:`${t.crop.name}${t.seg.variety?` \u00b7 ${t.seg.variety}`:''}`,
    detail:`${t.bed.name} \u00b7 ${t.seg.ft} ft \u00b7 ${t.text}`,
    seg:`${t.bed.id}:${t.seg.id}` }));
  choresDue().forEach(c => { if (c.away <= 14) out.push({
    key:`c:${c.id}:${c.due.toISOString().slice(0,10)}`,
    away:c.away, date:c.due, kind:'chore', area:c.g==='goat'?'Goats':'Chickens',
    title:c.n, detail:c.why, chore:c.id }); });
  // planting windows closing on crops the year plan says you still need
  const planted = {};
  allSegs().forEach(({seg})=>{ planted[seg.cropId]=(planted[seg.cropId]||0)+(+seg.ft||0); });
  planRows().filter(r=>r.on).forEach(r => {
    if ((planted[r.cid]||0) >= r.feet) return;
    const c = r.crop; if (!c) return;
    windowsFor(c).filter(w=>w.kind!=='harvest').forEach(w => {
      const left = dayDiff(w.to, TODAY);
      if (left >= 0 && left <= 14 && dayDiff(w.from,TODAY) <= 0) out.push({
        key:`w:${c.id}:${w.kind}:${w.season}`, away:left, date:w.to, kind:'window', area:'Garden',
        title:`Last call: ${c.name}`,
        detail:`${KIND_LABEL[w.kind]} window shuts ${fmtU(w.to)}. Year plan wants ${r.feet} ft and you have ${(planted[r.cid]||0)||'none'}.`,
        crop:c.id });
    });
  });
  // seed starting, which happens weeks before anything reaches a bed
  (typeof startBatches === 'function' ? startBatches() : []).forEach(b => {
    if (b.status !== 'planned') return;
    const away = dayDiff(b.sowFrom, TODAY);
    if (away < -21 || away > 21) return;
    out.push({ key:`gh:${b.key}`, away, date:b.sowFrom, kind:'greenhouse', area:'Greenhouse',
      title:`Sow ${b.label} indoors`,
      detail:`${b.cells} cells, ${b.trays} ${b.trays===1?'tray':'trays'} &middot; sets out ${fmtU(b.target)} into ${b.bed.name}` });
  });
  return out.filter(t => !state.done[t.key]).sort((a,b)=>a.away-b.away);
}

function dashView() {
  const todos = allTodos();
  const over = todos.filter(t=>t.away<0);
  const today = todos.filter(t=>t.away===0);
  const week  = todos.filter(t=>t.away>0&&t.away<=7);
  const later = todos.filter(t=>t.away>7);
  const doneCount = Object.keys(state.done).filter(k=>state.done[k]).length;
  const {open} = nowBoard();
  const harvestNow = open.filter(o=>o.w.kind==='harvest').length;

  const line = t => `<div class="todo ${t.away<0?'over':t.away===0?'now':''}">
    <button class="tick" data-donekey="${esc(t.key)}" aria-label="Mark done"></button>
    <div class="td-body" ${t.seg?`data-seg="${t.seg}"`:t.crop?`data-crop="${t.crop}"`:''}>
      <div class="td-title"><span class="ttype ${t.kind}">${t.kind==='window'?'closing':t.kind}</span>${esc(t.title)}</div>
      <div class="td-detail">${esc(t.detail)}</div>
    </div>
    <div class="td-when ${t.away<=1?'warn':''}">${
      t.away<0?`${-t.away}d late`:t.away===0?'today':`${t.away}d`}</div>
  </div>`;

  const block = (label, list) => !list.length?'' :
    `<div class="eyebrow">${label} <em>${list.length}</em></div><div class="card">${list.map(line).join('')}</div>`;

  return `<div class="wrap">
    <div class="totals">
      <div><span class="tl">Overdue</span><b class="${over.length?'bad':''}">${over.length}</b></div>
      <div><span class="tl">Today</span><b>${today.length}</b></div>
      <div><span class="tl">This week</span><b>${week.length}</b></div>
      <div><span class="tl">Ready to pick</span><b>${harvestNow}</b></div>
      <div><span class="tl">Done</span><b>${doneCount}</b></div>
    </div>
    ${block('Overdue', over)}
    ${block('Today', today)}
    ${block('This week', week)}

    ${!todos.length?`<div class="card"><div class="empty">Nothing due. Build beds in the <b>Garden</b> tab and mark sections planted, and this fills itself from your crops, your animals, and your year plan.</div></div>`:''}
    ${doneCount?`<div class="hint">${doneCount} cleared. <button class="linkbtn" data-act="resetdone">Show them again</button></div>`:''}
  </div>`;
}

// SEASON LOG  \u2014 the year over year record
